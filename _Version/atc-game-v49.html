<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC · 金門尚義 RCBS · v48</title>
<script src="taxi_config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

/* ═══════════════════════════════════════════
   v42 — 明亮遊戲風 · 取色自 airport_view.jpg
   天空藍 #e8f6ff  海洋青 #1ab8d4  草地綠 #4caf6a
   沙灘金 #f0c84a  跑道灰 #b0bec5  警示紅 #ff5252
═══════════════════════════════════════════ */
:root{
  --sky-bg:#cce8f4;     /* 天藍底色 */
  --sky-bg2:#d8effa;
  --panel:#ffffffcc;    /* 半透明白面板 */
  --panel2:#e8f4fc;
  --glass:rgba(255,255,255,0.72);
  --glass2:rgba(230,245,255,0.60);
  --border:rgba(26,184,212,0.35);
  --border2:rgba(26,184,212,0.15);
  --ocean:#0899b8;      /* 海洋深青 */
  --ocean-lt:#1ab8d4;
  --sky:#4db8f0;
  --grass:#3a9e58;      /* 草地深綠 */
  --grass-lt:#5cc478;
  --sand:#d4a017;       /* 沙灘深金 */
  --sand-lt:#f0c84a;
  --rwy:#78909c;        /* 跑道灰 */
  --red:#e53935;
  --red-lt:#ff5252;
  --t1:#0d2b3e;         /* 深藍文字 */
  --t2:#1a5070;
  --t3:#4a8aa8;
  --t4:#cce0ee;
  --mono:'Share Tech Mono',monospace;
  --disp:'Orbitron',monospace;
  --ui:'Inter',sans-serif;
  --left-w:420px;
  --top-h:60vh;
  --cmd-h:56px;
  --r:10px;             /* 全局圓角 */
  --shadow:0 4px 20px rgba(0,80,140,0.13);
  --shadow2:0 8px 32px rgba(0,80,140,0.18);
}

*{margin:0;padding:0;box-sizing:border-box;}

/* ── 動畫庫 ── */
@keyframes scanline{
  0%{background-position:0 0;}
  100%{background-position:0 4px;}
}
@keyframes pulseGlow{
  0%,100%{opacity:1;}
  50%{opacity:0.55;}
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(-6px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes borderFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
@keyframes reqBlink{
  0%,100%{background:#ff5252;box-shadow:0 0 10px rgba(255,82,82,0.8);color:#fff;}
  50%{background:rgba(255,82,82,0.3);box-shadow:none;color:#ffaaaa;}
}
@keyframes depGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(240,200,74,0);}
  50%{box-shadow:0 0 0 3px rgba(240,200,74,0.3);}
}
@keyframes arrGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(26,184,212,0);}
  50%{box-shadow:0 0 0 3px rgba(26,184,212,0.35);}
}
@keyframes chSlide{
  from{opacity:0;transform:translateX(-8px);}
  to{opacity:1;transform:translateX(0);}
}
@keyframes shimmer{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}

/* ── BODY — 天空漸層背景 ── */
body{
  background:linear-gradient(145deg,#b8ddf0 0%,#cce8f8 35%,#d8f0e8 70%,#c8e8f4 100%);
  color:var(--t1);font-family:var(--ui);
  width:100vw;height:100vh;
  display:grid;
  grid-template-columns:var(--left-w) 1fr;
  grid-template-rows:var(--top-h) var(--cmd-h) 1fr;
  overflow:hidden;user-select:none;
  gap:6px;padding:6px;
}

/* ════════════════════════════════════
   LEFT COLUMN
════════════════════════════════════ */
#left-col{
  grid-column:1; grid-row:1/4;
  display:grid;
  grid-template-rows:var(--top-h) 1fr;
  gap:6px;
}

/* ── ASR 雷達框 ── */
#asr-wrap{
  background:#050d18;
  border-radius:var(--r);
  border:2px solid transparent;
  background-clip:padding-box;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow2),inset 0 0 30px rgba(0,0,0,0.4);
}
/* 動態彩色外框 */
#asr-wrap::before{
  content:'';position:absolute;inset:-2px;border-radius:calc(var(--r)+2px);
  background:linear-gradient(90deg,#1ab8d4,#4caf6a,#f0c84a,#1ab8d4);
  background-size:300% 100%;
  animation:borderFlow 4s linear infinite;
  z-index:0;
}
#asr-wrap::after{
  content:'';position:absolute;inset:2px;border-radius:calc(var(--r)-1px);
  background:#050d18;z-index:1;pointer-events:none;
}
canvas#minimap{display:block;flex:1;min-height:0;width:100%;position:relative;z-index:2;}
.mm-title{
  position:absolute;top:8px;left:10px;z-index:10;
  font-family:var(--disp);font-size:10px;
  color:#18e8d8;letter-spacing:2px;font-weight:700;
  text-shadow:0 0 12px rgba(24,232,216,0.9),0 0 4px rgba(24,232,216,0.6);
}

/* ASR 控制列 */
.asr-ctrl-bar{
  display:flex;align-items:center;gap:5px;padding:5px 8px;flex-shrink:0;
  background:rgba(4,14,28,0.92);
  border-top:1px solid rgba(26,184,212,0.3);
  z-index:10;flex-wrap:wrap;border-radius:0 0 calc(var(--r)-2px) calc(var(--r)-2px);
  position:relative;
}
.asr-btn{
  font-family:var(--mono);font-size:9px;padding:4px 9px;
  background:rgba(26,184,212,0.15);border:1px solid rgba(26,184,212,0.5);
  color:#1ab8d4;border-radius:5px;cursor:pointer;
  transition:all .18s;white-space:nowrap;flex-shrink:0;
}
.asr-btn:hover{background:rgba(26,184,212,0.30);box-shadow:0 0 10px rgba(26,184,212,0.4);transform:translateY(-1px);}
.asr-btn.off{background:rgba(10,20,36,0.6);border-color:rgba(30,50,70,0.6);color:#2a5070;}
.asr-popup-btn{
  margin-left:auto;
  font-family:var(--mono);font-size:9px;padding:4px 9px;
  background:rgba(76,175,106,0.15);border:1px solid rgba(76,175,106,0.5);
  color:#5cc478;border-radius:5px;cursor:pointer;transition:all .18s;
}
.asr-popup-btn:hover{background:rgba(76,175,106,0.28);box-shadow:0 0 10px rgba(76,175,106,0.4);}
.asr-inline-legend{display:flex;align-items:center;gap:8px;margin:0 4px;}
.asr-leg-item{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;color:#4a8aa8;white-space:nowrap;}
.asr-leg-dash{width:16px;height:0;border-top:1.5px dashed;flex-shrink:0;}

/* ── COMM LOG ── */
#ch-col{
  background:var(--glass);
  border-radius:var(--r);
  overflow:hidden;
  display:flex;flex-direction:column;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}
#ch-header{
  padding:8px 12px 7px;
  border-bottom:2px solid var(--border);
  font-family:var(--disp);font-size:9px;color:var(--ocean);
  letter-spacing:2px;font-weight:700;flex-shrink:0;
  background:linear-gradient(90deg,rgba(26,184,212,0.12) 0%,rgba(255,255,255,0.08) 100%);
  display:flex;align-items:center;justify-content:space-between;
}
.ch-live-badges{display:flex;gap:5px;align-items:center;}
.ch-live-badge{
  font-family:var(--mono);font-size:8px;font-weight:700;
  padding:2px 6px;border-radius:4px;letter-spacing:0.5px;
  border:1.5px solid transparent;transition:all .3s;
}
.ch-live-badge.twr{color:#0076b8;border-color:#4db8f0;background:rgba(77,184,240,0.18);}
.ch-live-badge.gnd{color:#a07800;border-color:#f0c84a;background:rgba(240,200,74,0.18);}
.ch-live-badge.app{color:#1a7a40;border-color:#5cc478;background:rgba(92,196,120,0.16);}

#ch-log{
  flex:1;overflow-y:auto;padding:4px 0;min-height:0;
  display:flex;flex-direction:column;gap:0;
}
#ch-log::-webkit-scrollbar{width:3px;}
#ch-log::-webkit-scrollbar-thumb{background:rgba(26,184,212,0.3);border-radius:2px;}

.ch-entry{
  display:grid;grid-template-columns:46px 1fr;
  border-bottom:1px solid rgba(26,184,212,0.10);
  transition:background .15s;
}
.ch-entry:hover{background:rgba(26,184,212,0.05);}
.ch-entry.new-entry{animation:chSlide .22s ease;}
.ch-entry-badge{display:flex;align-items:flex-start;justify-content:center;padding:7px 0 5px;}
.ch-badge-sq{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:20px;flex-shrink:0;border-radius:4px;
  font-family:var(--disp);font-size:8px;font-weight:800;letter-spacing:0.3px;
}
.ch-badge-sq.twr{background:rgba(77,184,240,0.22);color:#0076b8;border:1.5px solid rgba(77,184,240,0.6);}
.ch-badge-sq.gnd{background:rgba(240,200,74,0.22);color:#a07800;border:1.5px solid rgba(240,200,74,0.6);}
.ch-badge-sq.app{background:rgba(92,196,120,0.22);color:#1a7a40;border:1.5px solid rgba(92,196,120,0.6);}
.ch-badge-sq.atis{background:rgba(26,184,212,0.18);color:#0899b8;border:1.5px solid rgba(26,184,212,0.5);}
.ch-badge-sq.ac{background:rgba(13,43,62,0.10);color:#1a5070;border:1.5px solid rgba(26,80,112,0.3);}
.ch-entry-msg{font-family:var(--mono);font-size:12px;line-height:1.55;word-break:break-all;padding:5px 8px 5px 3px;}
.ch-entry-msg.twr-txt{color:#0060a0;}
.ch-entry-msg.app-txt{color:#1a7a40;}
.ch-entry-msg.gnd-txt{color:#8a6000;}
.ch-entry-msg.atis-txt{color:#0899b8;font-size:11px;}
.ch-entry-msg.ac-txt{color:#0d2b3e;font-weight:600;}

/* ════════════════════════════════════
   RIGHT — SMR
════════════════════════════════════ */
#smr-wrap{
  grid-column:2;grid-row:1;
  border-radius:var(--r);overflow:hidden;position:relative;
  background:#0a1820;
  border:2px solid rgba(26,184,212,0.3);
  box-shadow:var(--shadow2);
}
canvas#radar{display:block;}
.smr-label{
  position:absolute;top:9px;left:12px;
  font-family:var(--disp);font-size:10px;
  color:rgba(24,232,216,0.95);letter-spacing:2px;font-weight:700;
  text-shadow:0 0 12px rgba(24,232,216,0.7);
  pointer-events:none;z-index:5;
}
/* v42 版本標籤 */
.smr-version{
  position:absolute;top:9px;right:12px;
  font-family:var(--mono);font-size:9px;
  color:rgba(26,184,212,0.6);letter-spacing:1px;
  pointer-events:none;z-index:5;
}

/* ════════════════════════════════════
   CMD BAR
════════════════════════════════════ */
#cmd-bar{
  grid-column:2;grid-row:2;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--glass);
  border-radius:var(--r);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  overflow:hidden;
}
#cmd-label{
  font-family:var(--disp);font-size:8px;color:var(--ocean);
  letter-spacing:2px;white-space:nowrap;flex-shrink:0;
  text-transform:uppercase;
}
#cmd-btns{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;overflow-x:auto;flex:1;}
#cmd-btns::-webkit-scrollbar{height:2px;}
#cmd-btns::-webkit-scrollbar-thumb{background:rgba(26,184,212,0.3);}

/* ── 指令按鈕 ── */
.cb{
  background:white;
  border:1.5px solid rgba(26,184,212,0.4);color:var(--t2);
  font-family:var(--mono);font-size:11px;padding:7px 14px;border-radius:8px;
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 2px 8px rgba(0,80,140,0.10),0 1px 0 white inset;
}
.cb:hover:not(:disabled){
  background:linear-gradient(135deg,#e8f8ff 0%,#d0f0ff 100%);
  border-color:var(--ocean-lt);color:var(--ocean);
  box-shadow:0 4px 16px rgba(26,184,212,0.25),0 1px 0 white inset;
  transform:translateY(-2px);
}
.cb:active:not(:disabled){transform:translateY(0);box-shadow:0 1px 4px rgba(26,184,212,0.15);}
.cb:disabled{opacity:.35;cursor:default;}
.cb.seat-APP{border-left:4px solid var(--ocean-lt);}
.cb.seat-TWR{border-left:4px solid var(--sky);}
.cb.seat-GND{border-left:4px solid var(--sand-lt);}
.cb.seat-DEL{border-left:4px solid var(--grass-lt);}
.cb-seat-lbl{font-size:7px;font-weight:700;letter-spacing:0.5px;opacity:0.7;}
.cb-seat-lbl.APP{color:var(--ocean);}
.cb-seat-lbl.TWR{color:var(--sky);}
.cb-seat-lbl.GND{color:var(--sand);}
.cb-seat-lbl.DEL{color:var(--grass);}

/* ── 氣象時鐘區 ── */
#cmd-wx{
  display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;
  border-left:2px solid var(--border2);padding-left:12px;
}
#cmd-wx-rwy{display:flex;gap:5px;align-items:center;}
#cmd-wx-vals{display:flex;flex-direction:column;gap:2px;}
#cmd-clock{
  border-right:2px solid var(--border2);padding-right:14px;
  font-family:var(--mono);font-size:20px;font-weight:700;
  color:var(--ocean);letter-spacing:2px;white-space:nowrap;
  min-width:100px;text-align:center;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}
.rwy-lt{
  width:38px;height:24px;border-radius:5px;border:2px solid;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:10px;font-weight:700;transition:all .4s;
}
.rwy-lt.on-green{background:#e8fff3;border-color:#3a9e58;color:#1a7040;box-shadow:0 0 12px rgba(58,158,88,0.5);}
.rwy-lt.on-amber{background:#fff8e0;border-color:#d4a017;color:#8a6000;box-shadow:0 0 10px rgba(212,160,23,0.4);}
.rwy-lt.off{background:rgba(255,255,255,0.4);border-color:rgba(26,184,212,0.25);color:var(--t3);}

/* ════════════════════════════════════
   STRIPS AREA
════════════════════════════════════ */
#strips-area{
  grid-column:2;grid-row:3;
  display:grid;grid-template-columns:1fr 200px 1fr;
  gap:6px;overflow:hidden;min-height:0;
}
.strip-col{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass2);
  border-radius:var(--r);border:1px solid var(--border);
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.strip-col-hdr{
  display:flex;align-items:center;gap:6px;padding:7px 12px;
  font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:1.5px;flex-shrink:0;border-radius:var(--r) var(--r) 0 0;
}
.hdr-dep{
  color:var(--sand);
  background:linear-gradient(90deg,rgba(240,200,74,0.15) 0%,rgba(240,200,74,0.03) 100%);
  border-bottom:2px solid rgba(240,200,74,0.35);
}
.hdr-arr{
  color:var(--ocean-lt);
  background:linear-gradient(90deg,rgba(26,184,212,0.15) 0%,rgba(26,184,212,0.03) 100%);
  border-bottom:2px solid rgba(26,184,212,0.35);
}
.strip-cnt{
  font-size:9px;padding:2px 7px;border-radius:10px;
  background:rgba(255,255,255,0.5);color:var(--t2);
  border:1px solid var(--border);
}
.strip-list{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
.strip-list::-webkit-scrollbar{width:3px;}
.strip-list::-webkit-scrollbar-thumb{background:rgba(26,184,212,0.25);border-radius:2px;}

/* ── 管制條 card ── */
.fs{
  background:white;
  border:1.5px solid rgba(26,184,212,0.25);border-radius:8px;
  padding:7px 10px;cursor:pointer;transition:all .16s;
  border-left:4px solid transparent;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,80,140,0.08);
  animation:slideIn .2s ease;
}
.fs:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 16px rgba(0,80,140,0.14);
}
.fs.dep{border-left-color:var(--sand-lt);animation:depGlow 2.5s ease-in-out infinite;}
.fs.arr{border-left-color:var(--ocean-lt);animation:arrGlow 2.5s ease-in-out infinite;}
.fs.sel.dep{
  background:linear-gradient(135deg,#fffbe8 0%,#fff8d0 100%);
  box-shadow:0 0 0 2px var(--sand-lt),0 4px 20px rgba(240,200,74,0.3);
  animation:none;
}
.fs.sel.arr{
  background:linear-gradient(135deg,#e8f8ff 0%,#d0f0ff 100%);
  box-shadow:0 0 0 2px var(--ocean-lt),0 4px 20px rgba(26,184,212,0.3);
  animation:none;
}
.fs-top{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.fs-cs{font-family:var(--mono);font-size:14px;font-weight:bold;}
.dep .fs-cs{color:var(--sand);}
.arr .fs-cs{color:var(--ocean);}
.fs-badge{font-size:7px;padding:2px 5px;border-radius:3px;font-weight:700;font-family:var(--mono);}
.b-gnd{background:rgba(240,200,74,0.2);color:var(--sand);border:1px solid rgba(240,200,74,0.5);}
.b-rwy{background:rgba(229,57,53,0.12);color:var(--red);border:1px solid rgba(229,57,53,0.4);}
.b-air{background:rgba(77,184,240,0.15);color:var(--sky);border:1px solid rgba(77,184,240,0.45);}
.b-app{background:rgba(92,196,120,0.15);color:var(--grass);border:1px solid rgba(92,196,120,0.45);}
.fs-bot{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.fs-ty{font-size:10px;color:var(--t3);font-family:var(--mono);}
.fs-route{font-size:10px;color:var(--t2);}
.fs-pos{
  font-size:10px;font-family:var(--mono);margin-left:auto;
  padding:2px 6px;border-radius:4px;font-weight:600;
  background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.08);
}
.fs-pos.gnd{color:var(--sand);background:rgba(240,200,74,0.12);}
.fs-pos.rwy{color:var(--red);background:rgba(229,57,53,0.10);}
.fs-pos.air{color:var(--sky);background:rgba(77,184,240,0.12);}
.fs-pos.app{color:var(--grass);background:rgba(92,196,120,0.12);}

/* REQ 閃爍標籤 */
.req-tag{
  font-size:7px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:#ff5252;color:#fff;font-family:var(--mono);
  letter-spacing:.5px;display:inline-block;vertical-align:middle;margin-left:3px;
  animation:reqBlink .5s ease-in-out infinite;
}

/* ── 詳情欄 ── */
#ac-detail-col{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass);border-radius:var(--r);
  border:1px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
#ac-img-box{
  width:100%;aspect-ratio:3/2;
  background:linear-gradient(135deg,#c8e8f8 0%,#d8f0e8 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;border-radius:var(--r) var(--r) 0 0;
}
#ac-img-box img{width:100%;height:100%;object-fit:cover;}
#ac-img-placeholder{color:var(--t3);font-size:9px;text-align:center;padding:8px;font-family:var(--mono);}
#ac-info-text{padding:8px 10px;flex:1;overflow-y:auto;}
#ac-cs-big{font-family:var(--mono);font-size:16px;font-weight:bold;color:var(--ocean);margin-bottom:2px;}
#ac-airline-lbl{font-size:11px;color:var(--t2);margin-bottom:5px;}
.ac-row{font-size:11px;color:var(--t2);font-family:var(--mono);line-height:1.7;}
.ac-row span{color:var(--t1);font-weight:600;}
#ac-empty-msg{color:var(--t3);font-size:11px;text-align:center;padding:12px 8px;font-family:var(--mono);line-height:1.8;}

/* wind */
#wind-indicator{width:44px;height:44px;flex-shrink:0;}
#rwy-block{display:flex;flex-direction:column;gap:4px;}
.rwy-row{display:flex;align-items:center;gap:6px;}
.rwy-info{font-family:var(--mono);font-size:9px;color:var(--t3);}

#sb{display:none;}

<script>
'use strict';
// ══════════════════════════════════════
// EVENT DELEGATION (survives DOM rebuilds)
// ══════════════════════════════════════
document.addEventListener('click', e=>{
  // CMD button clicks
  const btn=e.target.closest('button.cb[data-action]');
  if(btn){
    const acid=btn.dataset.acid;
    const action=btn.dataset.action;
    const ac=ACs[acid];
    if(ac&&action){
      // 立即清空指令列，防止重複按
      const btnsEl=document.getElementById('cmd-btns');
      if(btnsEl) btnsEl.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 執行中 —</span>';
      execCmd(ac,action);
      return;
    }
  }
  // Strip card clicks
  const strip=e.target.closest('.fs[data-acid]');
  if(strip){
    selectStrip(strip.dataset.acid);
    return;
  }
});
// ══════════════════════════════════════
// CONSTANTS & CONFIG
// ══════════════════════════════════════
const GAME_SPEED  = 2;
const NM_PX       = 16;
const REPLY_DELAY = 1500;

let showAC = true;     // ASR aircraft display toggle

function toggleRoutes(){

  if(!win) return;
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>ASR · 廣域進場雷達 · RCBS</title>
<style>

</style></head><body>
<div id="popup-canvas-wrap">
  <canvas id="pp-canvas"></canvas>

</div>

</div>
<script>
let pShowR=true, pShowA=true;
function toggleR(){pShowR=!pShowR;document.getElementById('pp-routes').textContent=pShowR?'隱藏航線':'顯示航線';document.getElementById('pp-routes').className='pp-btn'+(pShowR?'':' off');}

const cv=document.getElementById('pp-canvas');
const ctx=cv.getContext('2d');
function resize(){
  const dpr=window.devicePixelRatio||1;
  const wrap=document.getElementById('popup-canvas-wrap');

window.addEventListener('resize',resize); resize();
function loop(){

    const src=window.opener;
    if(!src||src.closed){window.close();return;}
    src.drawMinimapTo(ctx,cv.clientWidth,cv.clientHeight,pShowR,pShowA);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
<\/script></body></html>`);

// Runway crosswind limits (real-world simplified):
// > 20kt crosswind component → close runway (amber warning at >15kt)
const XW_AMBER = 15, XW_CLOSE = 20;

// GS is now dynamic — computed from gOrig() on every draw call
// This global is kept for backward compat but updated each frame via getGS()
let GS = 0.24;
function getGS(){ const g=gOrig(); GS=g.gs; return g.gs; }

// ══════════════════════════════════════
// ══════════════════════════════════════
// 座標系統 v38 — 純圖片像素座標
// 圖片原始尺寸：2559 × 1100px
// 所有位置直接對應 airport_view.jpg 像素
// 比例尺：1.2817 px/m（由TWY A/B/C/D交叉點線性回歸求得，誤差±1px）
// ══════════════════════════════════════
const IMG_W = 2559, IMG_H = 1100;
const PX_PER_M = TAXI_CONFIG.airport.px_per_m; // 像素/公尺

// ── 跑道 ──
const RWY_Y    = TAXI_CONFIG.airport.rwy_y;    // 跑道中心線 y（像素）
const DTHR06   = { x: 60,   y: 614 };  // RWY06 位移入口
const THR24    = { x: 2490, y: 614 };  // RWY24 入口
const RWY_W_PX = Math.round(45 * PX_PER_M);  // 跑道寬度（像素）≈58px

// ── TWY N ──
const TWY_N_Y = TAXI_CONFIG.airport.twy_n_y; // TWY N 中心線 y（像素）

// ── TWY 連接道 x（像素）──
// ── 滑行道連接道：從 taxi_config.js 讀取 ──
const CONN = Object.fromEntries(
  Object.entries(TAXI_CONFIG.connectors).map(([k,v]) => [k, v.x])
);

// ── 等待點（TWY N 上）──
// ── 等待點：從 TAXI_CONFIG 動態建立（支援 H-C/H-D 和 H-A/H-B）──
const HOLDPOINTS = {};
Object.entries(TAXI_CONFIG.holdpoints).forEach(([key, hp]) => {
  const conn = TAXI_CONFIG.connectors[hp.connector];
  HOLDPOINTS[key] = { x: conn.x, y: TWY_N_Y, label: hp.label, rwy: hp.rwy };
});
// 保留舊名相容
const HOLD_06 = HOLDPOINTS['H-D'];
const HOLD_24 = HOLDPOINTS['H-A'];

// ── DTHR 回轉點（RWY06起飛用）──
// 飛機滑至此處後做360°小迴轉朝東起飛
const DTHR_TURNAROUND = { x: 80, y: RWY_Y };

// ── 機位（圖片像素座標，機頭停止點）──
// ── 機位：從 taxi_config.js 讀取 ──
const GATES = Object.fromEntries(
  Object.entries(TAXI_CONFIG.gates).map(([id,g]) => [id, {x:g.x, y:g.y, cat:g.cat}])
);
const ALL_GATES = Object.entries(GATES).map(([id,g])=>({id,...g}));

// ── 設施（像素座標）──
const TERMINAL = { x:2199, y:163 };
const FIRE_STN = { x:1946, y:224 };

// ── 座標轉換：圖片像素 → canvas 像素 ──
// canvas 尺寸由 resize() 動態決定，縮放時保持 cover（以跑道中心為錨點）
function imgToCv(ix, iy) {
  const { sx, sy, ox, oy } = getImgTransform();
  return { x: ox + ix * sx, y: oy + iy * sy };
}
let _imgTransform = null;
function getImgTransform() {
  if (_imgTransform &&
      _imgTransform.cW === cW && _imgTransform.cH === cH) return _imgTransform;
  // cover：維持圖片比例填滿canvas，以跑道中心線為垂直錨點
  const sx = cW / IMG_W;
  const sy = cH / IMG_H;
  // 使用 cover（取較大縮放），但允許上下裁切
  const s = Math.max(sx, sy);
  const ox = (cW - IMG_W * s) / 2;
  const oy = (cH - IMG_H * s) / 2;
  _imgTransform = { sx:s, sy:s, ox, oy, cW, cH };
  return _imgTransform;
}

// 每次 resize 清除快取
const _origResize = typeof resize === 'function' ? resize : null;

// 為相容舊程式碼提供 m2c 別名（部分 draw 函式仍用 m2c）
// 注意：v38 起地面飛機直接用 imgToCv 定位
function m2c(mx, my) { return imgToCv(mx, my); }
function gOrig() { return { ox:0, oy:0, gs:getImgTransform().sx }; }
function getGS() { return getImgTransform().sx; }
GS = 1;

// TWY_Y 與 RWY_LEN 設為相容舊物理引擎的虛擬值
const TWY_Y   = TWY_N_Y;   // 等待點 y（像素）
const RWY_LEN = THR24.x;   // 跑道長度（像素 x 方向，供滾行計算用）

// ══════════════════════════════════════
// WAYPOINTS — 官方 WGS84 精確換算（NM offset from ARP）
// +x = East（東）, +y = North（北）
// ══════════════════════════════════════
const WPT = {
  // SID 航點（官方 PDF 050/070）
  BS001:      { x: 16.722, y:  -7.767 }, // 241758.00N 1184002.00E
  BS002:      { x: -4.637, y:  -8.089 }, // 241738.68N 1181634.45E
  INDIA:      { x: 27.117, y: -19.663 }, // 240604.23N 1185126.99E
  CUBON:      { x: 32.571, y: -28.693 }, // 235702.40N 1185726.39E

  // STAR 中間點（官方 PDF 110）
  POSTY:      { x: 28.396, y: -14.922 }, // 241048.70N 1185251.30E
  SPICA:      { x:  0.027, y: -10.003 }, // 241543.82N 1182141.78E
  MELOG:      { x:  8.193, y:  -1.707 }, // 242401.60N 1183039.89E

  // ILS RWY06 航點（官方 PDF 120/170）
  SANDY:      { x: 11.613, y:  -8.737 }, // 241659.78N 1183425.31E (IAF)

  FAP_06:     { x: -3.632, y:  -1.490 }, // FAP, ICKM 4.6D
  RWY06_DTHR: { x: -0.613, y:  -0.307 }, // RWY06 位移入口 MAPt

  // ILS RWY24 航點（官方 PDF 130）
  AMTIK:      { x:  8.863, y:  -1.563 }, // IAF, BSN 9D / BS 104BRG
  INDOK:      { x:  6.659, y:   2.780 }, // IF, ICSY 7.9D
  FAP_24:     { x:  3.253, y:   1.334 }, // FAP, ICSY 4.2D，速限 230kt
  RWY24_THR:  { x:  0.602, y:   0.307 }, // RWY24 入口

  // RNP RWY06 航點（官方 PDF 160/170）
  KNISH:      { x: -7.284, y:  -9.293 }, // 241626.43N 1181340.01E
  KETCH:      { x: -9.524, y:  -4.812 }, // 242055.27N 1181112.39E (IF)
  KEBAB:      { x: -5.070, y:  -2.558 }, // 242310.52N 1181605.91E (FAF)

  // SPRAY 雷達引導終點
  SPRAY_J:    { x:  2.6,   y: -14.8  },  // HDG 170° ~15NM
  SPRAY_K:    { x: 14.8,   y:  -2.6  },  // HDG 100° ~15NM
};

// ── Helper: named waypoint copy ──
const W = (name) => ({...WPT[name], name});

// ══════════════════════════════════════
// SID ROUTES（官方程序）
// 所有 SID：離地後維持跑道航向直到通過 600ft
// ══════════════════════════════════════
const SID_ROUTES = {
  // RWY06：通過 600ft 後右轉
  'CUBON 1A': [W('BS001'), W('INDIA'), {...W('CUBON'), isFinal:true}],
  'INDIA 1A': [W('BS001'), {...W('INDIA'), isFinal:true}],
  'SANDY 1A': [{...W('SANDY'), spdMax:250, isFinal:true}],
  'SPRAY 1J': [{...WPT.SPRAY_J, name:'SPRAY-J', isFinal:true}],
  // RWY24：通過 600ft 後左轉
  'CUBON 1B': [{...W('BS002'), spdMax:250}, {...W('CUBON'), isFinal:true}],
  'INDIA 1B': [{...W('BS002'), spdMax:250}, {...W('INDIA'), isFinal:true}],
  'SANDY 1B': [{...W('SANDY'), spdMax:240, isFinal:true}],
  'SPRAY 1K': [{...WPT.SPRAY_K, name:'SPRAY-K', isFinal:true}],
};

// ══════════════════════════════════════
// ARRIVAL ROUTES（官方 STAR + ILS）
// altTarget 為航點最低高度限制
// ══════════════════════════════════════
const ARR_ROUTES = {
  // ILS RWY06 via SANDY → SPICA → SKIRT → FAP_06
  'ILS-SANDY-06': [
    {...W('SANDY'), altTarget:4000, spdMax:220},
    {...W('SPICA'), altTarget:3000},
    {...W('SKIRT'), altTarget:2300, spdMax:220, isIF:true},
    {...W('FAP_06'), altTarget:1500, isFF:true},
    {...WPT.RWY06_DTHR, name:'RWY06', altTarget:0, isTHR:true},
  ],
  // CUBON 1C → ILS RWY06 via SPICA → SKIRT → FAP_06
  'CUBON-1C-06': [
    {...W('CUBON'), altTarget:8000},
    {...W('SPICA'), altTarget:4000},
    {...W('SKIRT'), altTarget:2300, spdMax:220, isIF:true},
    {...W('FAP_06'), altTarget:1500, isFF:true},

    {...W('FAP_24'), altTarget:1500, isFF:true},

  'CUBON-2D-24': [

// ══════════════════════════════════════
// AIRCRAFT PERFORMANCE TABLE (item 8)
// Two base profiles: prop / jet
// Fields: vs_climb (ft/min), vs_desc, vs_final, spd_liftoff (kt),
//         spd_climb, spd_cruise, spd_approach, spd_land, turn_rate (deg/s)
// ══════════════════════════════════════
const AC_PERF = {
  // ── Turboprop (ATR 72, Fokker 50, etc.) ──
  prop: {
    vs_climb:  1200, vs_desc:  1500, vs_final: 650,
    spd_liftoff: 120, spd_climb: 170, spd_cruise: 240,

  },

  jet: {

function drawWindIndicator(){
  const wc=document.getElementById('wind-canvas');
  if(!wc)return;
  const wctx=wc.getContext('2d');
  const W=44, R=17, cx2=22, cy2=22;
  wctx.clearRect(0,0,W,W);
  wctx.strokeStyle='rgba(80,160,220,0.6)'; wctx.lineWidth=1.2;
  wctx.beginPath(); wctx.arc(cx2,cy2,R,0,Math.PI*2); wctx.stroke();
  wctx.strokeStyle='rgba(80,160,220,0.3)'; wctx.lineWidth=0.8;
  wctx.beginPath(); wctx.arc(cx2,cy2,R*0.5,0,Math.PI*2); wctx.stroke();
  // Cardinal letters — N at top, E right, S bottom, W left
  wctx.fillStyle='rgba(120,190,240,0.90)'; wctx.font='bold 6px Orbitron,monospace';
  wctx.textAlign='center'; wctx.textBaseline='middle';
  wctx.fillText('N',cx2,cy2-R+4);
  wctx.fillText('S',cx2,cy2+R-4);
  wctx.fillText('E',cx2+R-4,cy2);
  wctx.fillText('W',cx2-R+4,cy2);
  // Wind arrow: points in the direction wind is GOING TO (from = dir, to = dir+180)
  // Compass bearing → canvas angle: rad = (bearing - 90) * π/180
  // Wind FROM 050 → arrow points TOWARD 230°
  const toDir = (wind.dir + 180) % 360;
  const rad = (toDir - 90) * Math.PI / 180;
  // Tail (origin side) and head (arrow tip)
  const tailX = cx2 - Math.cos(rad) * (R * 0.55);
  const tailY = cy2 - Math.sin(rad) * (R * 0.55);
  const headX = cx2 + Math.cos(rad) * (R - 3);
  const headY = cy2 + Math.sin(rad) * (R - 3);
  wctx.strokeStyle='#ffb830'; wctx.lineWidth=2; wctx.lineCap='round';
  wctx.beginPath(); wctx.moveTo(tailX, tailY); wctx.lineTo(headX, headY); wctx.stroke();
  // Arrowhead at head — use rad for direction
  const aSize = 5;
  wctx.fillStyle='#ffb830';
  wctx.beginPath();
  wctx.moveTo(headX, headY);
  wctx.lineTo(headX - Math.cos(rad - 0.45)*aSize, headY - Math.sin(rad - 0.45)*aSize);
  wctx.lineTo(headX - Math.cos(rad + 0.45)*aSize, headY - Math.sin(rad + 0.45)*aSize);
  wctx.closePath(); wctx.fill();
}

function updateRunwayLights(){
  function xwind(rwyHdg){
    const diff=(wind.dir - rwyHdg + 360)%360;
    return Math.abs(Math.sin(diff*Math.PI/180)*wind.spd);
  }
  const xw06=xwind(63), xw24=xwind(243);
  function applyState(el,xw){
    if(!el)return;
    el.classList.remove('on-green','on-amber','off');
    if(xw>XW_CLOSE) el.classList.add('off');
    else if(xw>XW_AMBER) el.classList.add('on-amber');
    else el.classList.add('on-green');
  }
  applyState(document.getElementById('rwy06-light'),xw06);
  applyState(document.getElementById('rwy24-light'),xw24);
  // wind display
  const wEl=document.getElementById('wx-wind');
  if(wEl) wEl.textContent=String(wind.dir).padStart(3,'0')+'°/'+wind.spd+'KT';
}

  // Big Kinmen (大金門): main island, center near ARP, ~13NM E-W × 7NM N-S
  const bigKinmen=[
    [-4.81,0.07],[-3.88,1.27],[-2.25,1.99],[-0.06,1.87],[2.12,1.57],
    [3.49,0.97],[4.86,0.07],[4.58,-0.83],[3.22,-1.43],[1.03,-1.85],

    [-14.26,-18.23],[-13.44,-17.93],[-13.17,-18.53],
    [-13.83,-19.01],[-14.37,-18.65],[-14.26,-18.23]
  ];
  // China / Fujian coast: N of chart, large landmass
  const chinaCoast=[
    [-17.0,7.3],[-11.5,9.1],[-6.1,10.3],[-0.6,9.1],
    [4.9,7.3],[10.3,5.5],[15.8,4.3],[18.5,4.3],
    [18.5,16.0],[-17.0,16.0],[-17.0,7.3]
  ];
  // Xiamen peninsula (廈門半島): W part of China coast, protrudes south
  const xiamen=[
    [-17.0,1.9],[-15.4,4.3],[-13.2,5.5],[-11.5,4.3],
    [-12.1,1.9],[-14.3,0.7],[-15.9,0.7],[-17.0,1.9]
  ];

  [
    {pts:bigKinmen,   fill:'rgba(22,50,24,0.92)', stroke:'rgba(55,170,80,0.50)', sw:1.2},
    {pts:smallKinmen, fill:'rgba(20,46,22,0.90)', stroke:'rgba(50,155,72,0.45)', sw:1.0},
    {pts:dadan,       fill:'rgba(18,42,20,0.85)', stroke:'rgba(45,140,65,0.35)', sw:0.8},
    {pts:chinaCoast,  fill:'rgba(15,35,16,0.88)', stroke:'rgba(35,110,50,0.30)', sw:0.8},
    {pts:xiamen,      fill:'rgba(16,36,18,0.85)', stroke:'rgba(35,110,50,0.28)', sw:0.7},
  ].forEach(({pts,fill,stroke,sw})=>{
    const cp=pts.map(p=>nm2c(p[0],p[1]));
    cx.beginPath(); cp.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)); cx.closePath();
    cx.fillStyle=fill; cx.fill();
    cx.strokeStyle=stroke; cx.lineWidth=sw; cx.stroke();
  });

  // Water labels
  const straitP=nm2c(-3,4.5);
  cx.fillStyle='rgba(100,200,255,0.55)'; cx.font='bold 10px Share Tech Mono';
  cx.textAlign='center'; cx.fillText('金廈海峽',straitP.x,straitP.y);
  const seaP=nm2c(18,-10);
  cx.fillStyle='rgba(100,200,255,0.35)';
  cx.fillText('臺灣海峽',seaP.x,seaP.y);
  // Island labels
  cx.fillStyle='rgba(100,220,110,0.80)'; cx.font='bold 9px Share Tech Mono';
  cx.textAlign='center';
  const bkLbl=nm2c(-0.5,0.3); cx.fillText('大金門',bkLbl.x,bkLbl.y);
  const skLbl=nm2c(-5.6,-0.3); cx.fillText('小金門',skLbl.x,skLbl.y);
  const cnLbl=nm2c(-2,11); cx.fillStyle='rgba(80,170,90,0.65)';
  cx.fillText('中國福建',cnLbl.x,cnLbl.y);
  // Range rings (5,10,15,20,25 NM)
  [5,10,15,20,25].forEach((r,i)=>{
    const bright=i%2===1;
    cx.strokeStyle=bright?'rgba(90,190,255,0.35)':'rgba(90,190,255,0.12)';
    cx.lineWidth=bright?0.9:0.5;
    cx.beginPath(); cx.arc(ox,oy,r*NM_PX,0,Math.PI*2); cx.stroke();

    cx.textAlign='left'; cx.textBaseline='alphabetic';

  });
  // Radials (every 30°)
  cx.strokeStyle='rgba(30,90,140,0.1)'; cx.lineWidth=0.4;
  for(let a=0;a<360;a+=30){
    const rad=(a-90)*Math.PI/180;
    cx.beginPath(); cx.moveTo(ox,oy); cx.lineTo(ox+Math.cos(rad)*28*NM_PX,oy+Math.sin(rad)*28*NM_PX); cx.stroke();
  }

  // ── SID routes (correct per AIP charts) ──
  // All SIDs: maintain RWY HDG until 600ft, then turn
  // RWY06 (063°) → right turns; RWY24 (243°) → left turns
  // Small initial segment to represent the "maintain HDG until 600ft" leg
  const RWY06_exit = [0.0, 0.0];          // ARP (runway end approx)
  const RWY24_exit = [0.0, 0.0];
  const TURN06 = [0.65, 0.29];            // ~600ft climb-out on 063° from RWY06
  const TURN24 = [-0.65, 0.29];           // ~600ft climb-out on 243° from RWY24

  // SANDY is already at {x:11.61, y:-8.74} which is ~SE consistent with BS 129BRG track
  // Intermediate point at ~half distance along BS 129BRG
  const BS_129_MID = [5.8, -4.4];  // midpoint along BS 129BRG bearing toward SANDY

  const sidRoutes=[
    // CUBON 1A: RWY06 → maintain 063° to 600ft → right → BS001(E) → INDIA(SE) → CUBON(SE far)
    {pts:[RWY06_exit, TURN06,
          [WPT.BS001.x,WPT.BS001.y],
          [WPT.INDIA.x,WPT.INDIA.y],
          [WPT.CUBON.x,WPT.CUBON.y]],
     col:'rgba(61,220,132,0.38)', lbl:'CUBON 1A', dash:[6,5]},
    // INDIA 1A: RWY06 → 600ft → right → BS001 → INDIA (stops at INDIA)
    {pts:[RWY06_exit, TURN06,
          [WPT.BS001.x,WPT.BS001.y],
          [WPT.INDIA.x,WPT.INDIA.y]],
     col:'rgba(61,220,132,0.28)', lbl:'INDIA 1A', dash:[6,5]},
    // SANDY 1A: RWY06 → 600ft → right → track BS 129BRG → SANDY
    {pts:[RWY06_exit, TURN06,
          BS_129_MID,
          [WPT.SANDY.x,WPT.SANDY.y]],
     col:'rgba(61,220,132,0.24)', lbl:'SANDY 1A', dash:[4,6]},
    // SPRAY 1J: RWY06 → 600ft → right → HDG170 radar vectors (south ~15NM)
    {pts:[RWY06_exit, TURN06,
          [WPT.SPRAY_J.x,WPT.SPRAY_J.y]],
     col:'rgba(61,220,132,0.18)', lbl:'SPRAY 1J', dash:[3,7]},
    // CUBON 1B: RWY24 → 600ft → left → BS002(W-SW) → CUBON(SE far)
    {pts:[RWY24_exit, TURN24,
          [WPT.BS002.x,WPT.BS002.y],
          [WPT.CUBON.x,WPT.CUBON.y]],
     col:'rgba(255,184,48,0.35)', lbl:'CUBON 1B', dash:[6,5]},
    // INDIA 1B: RWY24 → 600ft → left → BS002 → INDIA
    {pts:[RWY24_exit, TURN24,
          [WPT.BS002.x,WPT.BS002.y],
          [WPT.INDIA.x,WPT.INDIA.y]],
     col:'rgba(255,184,48,0.25)', lbl:'INDIA 1B', dash:[6,5]},
    // SANDY 1B: RWY24 → 600ft → left → track BS 129BRG → SANDY
    {pts:[RWY24_exit, TURN24,
          BS_129_MID,
          [WPT.SANDY.x,WPT.SANDY.y]],
     col:'rgba(255,184,48,0.22)', lbl:'SANDY 1B', dash:[4,6]},
    // SPRAY 1K: RWY24 → 600ft → left → HDG100 radar vectors (E ~15NM)
    {pts:[RWY24_exit, TURN24,
          [WPT.SPRAY_K.x,WPT.SPRAY_K.y]],
     col:'rgba(255,184,48,0.16)', lbl:'SPRAY 1K', dash:[3,7]},
  ];
  sidRoutes.forEach(({pts,col,lbl,dash})=>{
    cx.strokeStyle=col; cx.lineWidth=1.2; cx.setLineDash(dash||[6,5]);
    cx.beginPath();
    pts.forEach(([nx,ny],i)=>{const p=nm2c(nx,ny); i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y);});
    cx.stroke(); cx.setLineDash([]);
    // label near terminus
    const ep=pts[pts.length-1], ep2=nm2c(ep[0],ep[1]);
    cx.fillStyle=col.replace(/[\d.]+\)$/,'0.85)');
    cx.font='bold 8px Share Tech Mono'; cx.textAlign='left';
    cx.fillText(lbl,ep2.x+5,ep2.y-4);
  });

  // ── STAR / IAP arrival routes ──
  const starRoutes=[
    // CUBON 1C: CUBON → SPICA → SKIRT(IF) → FAP_06 → RWY06
    {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.SPICA.x,WPT.SPICA.y],[WPT.SKIRT.x,WPT.SKIRT.y],[WPT.FAP_06.x,WPT.FAP_06.y],[0,0]],
     col:'rgba(126,207,255,0.32)', lbl:'CUBON 1C', anchor:'start'},
    // CUBON 2D: CUBON → POSTY → MELOG → INDOK(IF) → FAP_24 → RWY24
    {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.POSTY.x,WPT.POSTY.y],[WPT.MELOG.x,WPT.MELOG.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],[0,0]],
     col:'rgba(126,207,255,0.24)', lbl:'CUBON 2D', anchor:'start'},
    // ILS RWY06: SANDY → SPICA → SKIRT(IF) → FAP_06 → THR
    {pts:[[WPT.SANDY.x,WPT.SANDY.y],[WPT.SPICA.x,WPT.SPICA.y],[WPT.SKIRT.x,WPT.SKIRT.y],[WPT.FAP_06.x,WPT.FAP_06.y],[0,0]],
     col:'rgba(0,200,190,0.28)', lbl:'ILS RWY06', anchor:'start'},
    // ILS RWY24: AMTIK → INDOK(IF) → FAP_24 → THR
    {pts:[[WPT.AMTIK.x,WPT.AMTIK.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],[0,0]],
     col:'rgba(0,200,190,0.22)', lbl:'ILS RWY24', anchor:'start'},
    // ILS RWY24 alt entry: SANDY → MELOG → INDOK → FAP_24
    {pts:[[WPT.SANDY.x,WPT.SANDY.y],[WPT.MELOG.x,WPT.MELOG.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],[0,0]],
     col:'rgba(0,200,190,0.14)', lbl:'', anchor:'start'},
  ];
  starRoutes.forEach(({pts,col,lbl,anchor})=>{
    cx.strokeStyle=col; cx.lineWidth=1.1; cx.setLineDash([4,6]);
    cx.beginPath();
    pts.forEach(([nx,ny],i)=>{const p=nm2c(nx,ny); i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y);});
    cx.stroke(); cx.setLineDash([]);
    if(lbl){
      const sp=pts[0], sp2=nm2c(sp[0],sp[1]);
      cx.fillStyle=col.replace(/[\d.]+\)$/,'0.80)');
      cx.font='bold 8px Share Tech Mono'; cx.textAlign='left';
      cx.fillText(lbl,sp2.x+5,sp2.y-4);
    }
  });

  // ILS localizer feathers — beam extends outbound FROM threshold
  // RWY06 threshold at W end → localizer points W (inbound hdg 063° = aircraft flies EAST)
  // Feather shows the extended centreline toward SPICA/SANDY (ESE direction from ARP)
  drawILS_air('06'); drawILS_air('24');

  // ── Waypoints ──
  const IAF_names=['SANDY','SPICA','CUBON','AMTIK','MELOG'];
  const FF_names=['FAP_06','FAP_24','SKIRT','INDOK'];
  const HIDE=['SPRAY_J','SPRAY_K','RWY06_DTHR','RWY24_THR','KNISH','KETCH','KEBAB'];
  Object.entries(WPT).forEach(([nm,wp])=>{
    if(HIDE.includes(nm)) return;
    const p=nm2c(wp.x,wp.y);
    const isFF=FF_names.includes(nm);
    const isIAF=IAF_names.includes(nm);
    if(isFF){
      cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1;
      const s=5;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y); cx.lineTo(p.x,p.y+s); cx.lineTo(p.x-s,p.y); cx.closePath(); cx.stroke();
      cx.fillStyle='rgba(0,200,190,0.15)'; cx.fill();
    } else if(isIAF){
      cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1.2;
      const s=6;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y+s); cx.lineTo(p.x-s,p.y+s); cx.closePath(); cx.stroke();
    } else {
      cx.strokeStyle='rgba(0,200,190,0.50)'; cx.lineWidth=1;
      const s=4;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y+s); cx.lineTo(p.x-s,p.y+s); cx.closePath(); cx.stroke();
    }
    cx.fillStyle=isFF?'rgba(0,220,210,0.75)':'rgba(0,230,210,0.95)';
    cx.font=(isIAF?'bold ':'')+'10px Share Tech Mono';
    cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText(nm,p.x+8,p.y+3);
  });

  // ── RCBS ARP symbol ──
  cx.strokeStyle='rgba(80,240,150,0.95)'; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(ox,oy,5,0,Math.PI*2); cx.stroke();
  cx.beginPath(); cx.moveTo(ox-12,oy); cx.lineTo(ox+12,oy); cx.moveTo(ox,oy-12); cx.lineTo(ox,oy+12); cx.stroke();
  cx.fillStyle='rgba(80,240,150,0.95)'; cx.font='bold 11px Share Tech Mono';
  cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText('RCBS',ox+9,oy+16);

  // ── NDB BS symbol (345 kHz, at ARP area) ──
  const ndbP=nm2c(-0.5,0.3);
  cx.strokeStyle='rgba(255,200,60,0.80)'; cx.lineWidth=1.2;
  cx.beginPath(); cx.arc(ndbP.x,ndbP.y,6,0,Math.PI*2); cx.stroke();
  cx.beginPath(); cx.arc(ndbP.x,ndbP.y,3,0,Math.PI*2); cx.stroke();
  cx.fillStyle='rgba(255,200,60,0.90)'; cx.font='bold 9px Share Tech Mono';
  cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText('BS 345',ndbP.x+9,ndbP.y+3);

  Object.values(ACs).forEach(ac=>{if(!isGnd(ac.cmdStep))drawACAir(ac);});
}
function drawILS_air(rwy){
  // Localizer centreline extends outbound (away from runway, toward arriving aircraft)
  // RWY06: aircraft approaches from SE on hdg 063° → localizer extends to SE = hdg 063°+180 = 243° TRUE
  // RWY24: aircraft approaches from NW on hdg 243° → localizer extends to NW = hdg 243°+180 = 063° TRUE
  // In canvas: hdg 063° = ENE (right of east slightly) = inbound for RWY06
  // Outbound from RWY06 threshold = back-course toward SPICA/SANDY area
  const outHdg = rwy==='06' ? 63 : 243;   // outbound direction (toward arriving aircraft)
  const rad=(outHdg-90)*Math.PI/180;       // canvas rotation (0°=N → -90 offset)
  const{ox,oy}=aOrig(); const len=12*NM_PX;
  const ex=ox+Math.cos(rad)*len, ey=oy+Math.sin(rad)*len;
  cx.strokeStyle='rgba(0,200,190,0.25)'; cx.lineWidth=1; cx.setLineDash([8,6]);
  cx.beginPath(); cx.moveTo(ox,oy); cx.lineTo(ex,ey); cx.stroke(); cx.setLineDash([]);
  // Feather ticks
  const perp=rad+Math.PI/2;
  for(let d=2;d<=10;d+=2){
    const mx2=ox+Math.cos(rad)*d*NM_PX, my2=oy+Math.sin(rad)*d*NM_PX;
    const fw=0.45*NM_PX*(1-d/14);
    cx.strokeStyle='rgba(0,165,155,0.15)'; cx.lineWidth=0.5;
    cx.beginPath();
    cx.moveTo(mx2+Math.cos(perp)*fw,my2+Math.sin(perp)*fw);
    cx.lineTo(mx2-Math.cos(perp)*fw,my2-Math.sin(perp)*fw); cx.stroke();
  }
  cx.fillStyle='rgba(0,200,190,0.65)'; cx.font='8px Share Tech Mono'; cx.textAlign='left';
  const ilsIdent = rwy==='06'?'ILS/DME RWY06 · ICKM 108.9':'ILS/DME RWY24 · ICSY 110.7';
  cx.fillText(ilsIdent,ex+4,ey+3);
}

function drawArrow(px,py,hdgDeg,sz,col,isSel){
  const ang=hdgDeg*Math.PI/180;
  cx.save(); cx.translate(px,py); cx.rotate(ang);
  if(isSel){
    // Fixed-size selection rings regardless of sz (prevents jump on state change)
    const r1=sz*2.2, r2=sz*3.0;
    cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1.8; cx.setLineDash([]);
    cx.beginPath(); cx.arc(0,0,r1,0,Math.PI*2); cx.stroke();
    cx.strokeStyle='rgba(0,200,190,0.22)'; cx.lineWidth=1;
    cx.beginPath(); cx.arc(0,0,r2,0,Math.PI*2); cx.stroke();
  }
  // Arrow body
  cx.fillStyle=col; cx.strokeStyle='rgba(0,0,0,0.3)'; cx.lineWidth=0.5;
  cx.beginPath();
  cx.moveTo(0,-sz*2.0);
  cx.lineTo(sz*0.95,sz*0.9);
  cx.lineTo(0,sz*0.25);
  cx.lineTo(-sz*0.95,sz*0.9);
  cx.closePath(); cx.fill(); cx.stroke();
  cx.restore();
}

function getACPos(ac){
  if(ac.cmdStep==='TAKEOFF_ROLL'){
    const rwy=ac.assignedRwy||'06';
    // 起飛起始x（像素），RWY06從DTHR附近，RWY24從THR24端
    const rwyStartX = rwy==='06' ? DTHR06.x+30 : THR24.x-50;
    const rwyEndX   = rwy==='06' ? THR24.x      : DTHR06.x+30;
    const totalRoll = Math.abs(rwyEndX - rwyStartX);
    const t = Math.min(ac.rwyRollDist / Math.max(totalRoll, 1), 1);
    const curX = rwyStartX + (rwyEndX - rwyStartX) * t;
    const p = imgToCv(curX, RWY_Y);
    const hdg = rwy==='06' ? 90 : 270; // 畫面角度：90=向右(東)，270=向左(西)
    return { px:p.x, py:p.y, hdg };
  }
  if(ac.cmdStep==='TURNING_06'){
    const p = imgToCv(ac.gx, ac.gy);
    return { px:p.x, py:p.y, hdg:ac.gHdg };
  }
  if(ac.cmdStep==='WAIT_LINEUP'||ac.cmdStep==='TAXIING_TO_RWY'){
    if(ac.taxiIdx>=ac.taxiRoute.length && ac.cmdStep==='WAIT_LINEUP'){
      const rwyX = ac.assignedRwy==='06' ? DTHR06.x+30 : THR24.x-50;
      const p = imgToCv(rwyX, RWY_Y);
      return { px:p.x, py:p.y, hdg:ac.assignedRwy==='06'?90:270 };
    }
  }
  const p = imgToCv(ac.gx, ac.gy);
  return { px:p.x, py:p.y, hdg:ac.gHdg };
}

function drawACGnd(ac){
  const{px,py,hdg}=getACPos(ac);
  const isSel=ac.id===sel;
  const col=isSel?'#00c8be':ac.cat==='MIL'?'#ff9060':'#3ddc84';
  const sz=Math.max(GS*12,4.5);

  // reqFlash 只用管制條的 REQ 標籤顯示，畫面上不加外圈

  drawArrow(px,py,hdg,sz,col,isSel);

  // 班號：圓角矩形反白背景
  cx.save();
  const cs=ac.callsign;
  cx.font='bold 11px Share Tech Mono';
  const tw=cx.measureText(cs).width;
  const bx=px+sz*2+3, by=py-8, bw=tw+10, bh=16, br=4;
  // 背景
  const bgCol=isSel?'rgba(0,200,190,0.95)':ac.cat==='MIL'?'rgba(255,144,96,0.9)':'rgba(61,220,132,0.9)';
  cx.fillStyle=bgCol;
  cx.beginPath();
  cx.moveTo(bx+br,by); cx.lineTo(bx+bw-br,by);
  cx.arcTo(bx+bw,by,bx+bw,by+bh,br);
  cx.lineTo(bx+bw,by+bh-br);
  cx.arcTo(bx+bw,by+bh,bx,by+bh,br);
  cx.lineTo(bx+br,by+bh);
  cx.arcTo(bx,by+bh,bx,by,br);
  cx.lineTo(bx,by+br);
  cx.arcTo(bx,by,bx+bw,by,br);
  cx.closePath(); cx.fill();
  cx.fillStyle='#0a1820';
  cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText(cs,bx+5,by+bh/2);

  // REQ 標記僅在管制條上顯示，SMR 畫面不顯示

  cx.restore();
}

// 畫滑行路線預覽（懸停跑道選項時）
function drawTaxiPreview(route, col){
  if(!route||route.length<2) return;
  cx.save();
  cx.strokeStyle=col||'rgba(255,220,80,0.6)';
  cx.lineWidth=Math.max(2, 3*GS); cx.setLineDash([8,5]);
  cx.beginPath();
  route.forEach((pt,i)=>{
    const p=imgToCv(pt.x, pt.y);
    i===0?cx.moveTo(p.x,p.y):cx.lineTo(p.x,p.y);
  });
  cx.stroke(); cx.setLineDash([]); cx.restore();
}
function drawACAir(ac){
  const p=nm2c(ac.ax,ac.ay);
  const isSel=ac.id===sel;
  const col=isSel?'#00c8be':ac.cmdStep==='FINAL_APPROACH'?'#ffb830':ac.cat==='MIL'?'#ff9060':'#5abeff';
  const sz=8;
  const ang=ac.aHdg*Math.PI/180;
  for(let i=1;i<=5;i++){
    const bx=p.x-Math.sin(ang)*i*7, by=p.y+Math.cos(ang)*i*7;
    cx.fillStyle=`rgba(90,190,255,${0.16-i*0.025})`;
    cx.beginPath(); cx.arc(bx,by,3.5-i*0.5,0,Math.PI*2); cx.fill();
  }
  drawArrow(p.x,p.y,ac.aHdg,sz,col,isSel);
  cx.save();
  const lx=p.x+sz*2+4,ly=p.y-8;
  // 班號圓角標
  cx.font='bold 11px Share Tech Mono';
  const tw=cx.measureText(ac.callsign).width;
  const bw=tw+10,bh=15,br=4;
  cx.fillStyle=isSel?'rgba(0,200,190,0.9)':'rgba(90,190,255,0.85)';
  cx.beginPath();
  cx.moveTo(lx+br,ly); cx.lineTo(lx+bw-br,ly);
  cx.arcTo(lx+bw,ly,lx+bw,ly+bh,br); cx.lineTo(lx+bw,ly+bh-br);
  cx.arcTo(lx+bw,ly+bh,lx,ly+bh,br); cx.lineTo(lx+br,ly+bh);
  cx.arcTo(lx,ly+bh,lx,ly,br); cx.lineTo(lx,ly+br);
  cx.arcTo(lx,ly,lx+bw,ly,br); cx.closePath(); cx.fill();
  cx.fillStyle='#060e1a'; cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText(ac.callsign,lx+5,ly+bh/2);
  // 高度速度
  cx.font='10px Share Tech Mono'; cx.fillStyle='rgba(160,218,208,0.88)';
  cx.textBaseline='alphabetic';
  cx.fillText(Math.round(ac.altitude/100)*100+'ft',lx,ly+bh+11);
  cx.fillText(Math.round(ac.aSpd)+'kt',lx+56,ly+bh+11);
  cx.restore();
}

// Convert NM offset → ground canvas pixel (overlays air AC on SMR ground view)
// ARP is at roughly ground coordinate (RWY_LEN/2, 0) = runway midpoint
function nm2gCanvas(nx, ny){
  // NM座標（以ARP為原點）→ 圖片像素 → canvas像素
  // airport_view.jpg 的 x 軸對應真方位 063°（非正東）
  // 需要將 NM 座標旋轉到圖片座標系
  const A = 63 * Math.PI / 180; // 跑道真方位（圖片x軸方向）
  const scale = 1852 * PX_PER_M; // NM → 像素
  const arpPxX = (DTHR06.x + THR24.x) / 2;
  const arpPxY = RWY_Y;
  // 圖片x軸 = 沿063°方向，圖片y向下 = 沿153°方向（063+90）
  const imgX = arpPxX + (nx * Math.sin(A) + ny * Math.cos(A)) * scale;
  const imgY = arpPxY + (nx * Math.cos(A) - ny * Math.sin(A)) * scale;
  return imgToCv(imgX, imgY);
}

function drawACsOnGround(){
  // Draw arriving/departing air aircraft on the ground SMR view
  Object.values(ACs).forEach(ac=>{
    if(isGnd(ac.cmdStep)) return; // ground AC drawn separately
    if(['DEP_APP'].includes(ac.cmdStep) && Math.abs(ac.ax)>18) return; // too far out
    const p = nm2gCanvas(ac.ax, ac.ay);
    // Only draw if within canvas bounds (with margin)
    if(p.x < -40 || p.x > cW+40 || p.y < -40 || p.y > cH+40) return;
    const isSel = ac.id===sel;
    const isArr = ['APPROACHING','INBOUND','SEQUENCING','FINAL_APPROACH'].includes(ac.cmdStep);
    const col = isSel?'#00c8be': isArr?'#5abeff':'#3ddc84';
    const sz = Math.max(GS*12, 4.5); // same as drawACGnd — prevents jump on transition; GS refreshed by getGS()
    // Speed vector trail
    // SMR 圖片座標系：x軸對應真方位063°，轉換航向至圖片角度
    const smrHdg = (ac.aHdg - 63 + 90 + 360) % 360;
    const ang = smrHdg*Math.PI/180;
    for(let i=1;i<=4;i++){
      const tx=p.x - Math.sin(ang)*i*9, ty=p.y + Math.cos(ang)*i*9;
      cx.fillStyle=`rgba(90,190,255,${0.18-i*0.03})`;
      cx.beginPath(); cx.arc(tx,ty,3-i*0.4,0,Math.PI*2); cx.fill();
    }
    drawArrow(p.x, p.y, smrHdg, sz, col, isSel);
    // Label
    cx.save();
    cx.font='bold 10px Share Tech Mono';
    const tw2=cx.measureText(ac.callsign).width;
    const bx=p.x+sz*2+3, by=p.y-7, bw=tw2+8, bh=14, br=3;
    cx.fillStyle=isSel?'rgba(0,200,190,0.92)':'rgba(90,190,255,0.88)';
    cx.beginPath();
    cx.moveTo(bx+br,by); cx.lineTo(bx+bw-br,by);
    cx.arcTo(bx+bw,by,bx+bw,by+bh,br); cx.lineTo(bx+bw,by+bh-br);
    cx.arcTo(bx+bw,by+bh,bx,by+bh,br); cx.lineTo(bx+br,by+bh);
    cx.arcTo(bx,by+bh,bx,by,br); cx.lineTo(bx,by+br);
    cx.arcTo(bx,by,bx+bw,by,br); cx.closePath(); cx.fill();
    cx.fillStyle='#060e1a'; cx.textAlign='left'; cx.textBaseline='middle';
    cx.fillText(ac.callsign,bx+4,by+bh/2);
    // Alt+spd tag
    const altTxt=Math.round(ac.altitude/100)*100+'ft';
    cx.font='9px Share Tech Mono'; cx.fillStyle='rgba(160,218,208,0.85)';
    cx.textBaseline='alphabetic';
    cx.fillText(altTxt, bx, by+bh+10);
    cx.restore();
  });
}

function render(){ drawGround(); drawACsOnGround(); drawMinimap(); }

// ── 公用 minimap 繪圖核心（主畫面 & 彈出視窗共用）──
function drawMinimapTo(mc, W, H, doRoutes, doAC){
  const RANGE=30;
  const NM_MM = Math.min(W,H)*0.5/RANGE;
  // 左移、上移中心使CUBON（SE方向約32.5NM）可見於畫面右下
  const mox=W*0.34, moy=H*0.32;
  function mm2px(nx,ny){return{x:mox+nx*NM_MM, y:moy-ny*NM_MM};}

  // Background
  mc.fillStyle='#060e18'; mc.fillRect(0,0,W,H);

  // ── Range rings ──
  [5,10,15,20,25,30].forEach((r,i)=>{
    const bright=i%2===1;
    mc.strokeStyle=bright?'rgba(0,210,200,0.40)':'rgba(0,210,200,0.15)';
    mc.lineWidth=bright?0.8:0.4;
    mc.beginPath(); mc.arc(mox,moy,r*NM_MM,0,Math.PI*2); mc.stroke();
    if(bright){
      mc.fillStyle='rgba(0,220,210,0.60)'; mc.font='bold 7px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(r+'NM', mox+r*NM_MM+2, moy-2);
    }
  });

  // ── 跑道 + LOC延伸線 ──
  {
    const r06=mm2px(WPT.RWY06_DTHR.x, WPT.RWY06_DTHR.y);
    const r24=mm2px(WPT.RWY24_THR.x, WPT.RWY24_THR.y);
    mc.strokeStyle='rgba(200,220,200,0.80)'; mc.lineWidth=2.5;
    mc.beginPath(); mc.moveTo(r06.x,r06.y); mc.lineTo(r24.x,r24.y); mc.stroke();
    const sin63=Math.sin(63*Math.PI/180), cos63=Math.cos(63*Math.PI/180);
    const ext=12*NM_MM;
    mc.strokeStyle='rgba(0,200,190,0.20)'; mc.lineWidth=0.7; mc.setLineDash([5,5]);
    mc.beginPath(); mc.moveTo(r06.x,r06.y); mc.lineTo(r06.x-sin63*ext, r06.y+cos63*ext); mc.stroke();
    mc.beginPath(); mc.moveTo(r24.x,r24.y); mc.lineTo(r24.x+sin63*ext, r24.y-cos63*ext); mc.stroke();
    mc.setLineDash([]);
  }

  // ── TMA boundary（畫在航線下方）──
  const tma=[[-16,-7],[-5,-22],[30,-22],[30,8],[8,15],[-8,15],[-16,-7]];
  mc.strokeStyle='rgba(255,150,40,0.70)'; mc.lineWidth=1.1; mc.setLineDash([6,4]);
  mc.beginPath(); tma.forEach(([x,y],i)=>{const p=mm2px(x,y); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.closePath(); mc.stroke(); mc.setLineDash([]);
  const tmaLbl=mm2px(10,12); mc.fillStyle='rgba(255,150,40,0.75)'; mc.font='bold 7px Share Tech Mono'; mc.textAlign='left';
  mc.fillText('KINMEN TMA',tmaLbl.x,tmaLbl.y);

  if(doRoutes){
    const T06=[WPT.RWY06_DTHR.x, WPT.RWY06_DTHR.y];
    const T24=[WPT.RWY24_THR.x,  WPT.RWY24_THR.y];
    const R06=T06, R24=T24;

    // SID（離場，亮粉色）
    const mmSIDs=[
      {pts:[T06,[WPT.BS001.x,WPT.BS001.y],[WPT.INDIA.x,WPT.INDIA.y],[WPT.CUBON.x,WPT.CUBON.y]], col:'rgba(255,90,180,0.75)'},
      {pts:[T06,[WPT.SANDY.x,WPT.SANDY.y]], col:'rgba(255,90,180,0.58)'},
      {pts:[T24,[WPT.BS002.x,WPT.BS002.y],[WPT.CUBON.x,WPT.CUBON.y]], col:'rgba(255,90,180,0.65)'},
      {pts:[T24,[WPT.SANDY.x,WPT.SANDY.y]], col:'rgba(255,90,180,0.50)'},
    ];
    mmSIDs.forEach(({pts,col})=>{
      mc.strokeStyle=col; mc.lineWidth=0.9; mc.setLineDash([5,4]);
      mc.beginPath(); pts.forEach(([nx,ny],i)=>{const p=mm2px(nx,ny); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.stroke(); mc.setLineDash([]);
    });

    // STAR（進場，亮藍色）
    const mmSTARs=[
      {pts:[[WPT.SANDY.x,WPT.SANDY.y],[WPT.SPICA.x,WPT.SPICA.y]], col:'rgba(96,200,255,0.58)'},
      {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.SPICA.x,WPT.SPICA.y],[WPT.SKIRT.x,WPT.SKIRT.y],[WPT.FAP_06.x,WPT.FAP_06.y],R06], col:'rgba(96,200,255,0.75)'},
      {pts:[[WPT.AMTIK.x,WPT.AMTIK.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],R24], col:'rgba(96,200,255,0.58)'},
      {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.POSTY.x,WPT.POSTY.y],[WPT.MELOG.x,WPT.MELOG.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],R24], col:'rgba(96,200,255,0.58)'},
    ];
    mmSTARs.forEach(({pts,col})=>{
      mc.strokeStyle=col; mc.lineWidth=0.9; mc.setLineDash([3,5]);
      mc.beginPath(); pts.forEach(([nx,ny],i)=>{const p=mm2px(nx,ny); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.stroke(); mc.setLineDash([]);
    });

    // ── Waypoints：AMTIK省略（與MELOG距離僅0.7NM，ASR上重疊）──
    const SHOW_WPT=['BS001','BS002','INDIA','CUBON','POSTY','SPICA','MELOG','SANDY','SKIRT','INDOK','FAP_06','FAP_24'];
    SHOW_WPT.forEach(nm=>{
      const wp=WPT[nm]; if(!wp) return;
      const p=mm2px(wp.x,wp.y);
      if(p.x<-10||p.x>W+10||p.y<-10||p.y>H+10) return;
      // 三角形符號
      mc.strokeStyle='rgba(0,220,205,0.85)'; mc.lineWidth=0.9;
      const s=3.5;
      mc.beginPath(); mc.moveTo(p.x,p.y-s); mc.lineTo(p.x+s,p.y+s); mc.lineTo(p.x-s,p.y+s); mc.closePath(); mc.stroke();
      // 名稱標籤
      mc.fillStyle='rgba(0,225,210,0.92)';
      mc.font='10px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(nm, p.x+5, p.y+4);
    });
  }

  // ── RCBS ARP crosshair ──
  const arp=mm2px(0,0);
  mc.strokeStyle='rgba(80,240,150,0.95)'; mc.lineWidth=1.2;
  mc.beginPath(); mc.arc(arp.x,arp.y,3.5,0,Math.PI*2); mc.stroke();
  mc.beginPath(); mc.moveTo(arp.x-9,arp.y); mc.lineTo(arp.x+9,arp.y); mc.moveTo(arp.x,arp.y-9); mc.lineTo(arp.x,arp.y+9); mc.stroke();
  mc.fillStyle='rgba(80,240,150,0.95)'; mc.font='bold 10px Share Tech Mono';
  mc.textAlign='left'; mc.fillText('RCBS',arp.x+6,arp.y+14);

  // ── Aircraft blips ──
  if(doAC){
    Object.values(ACs).forEach(ac=>{
      const isAir=!isGnd(ac.cmdStep);
      if(!isAir) return;
      const isArr=['APPROACHING','INBOUND','SEQUENCING','FINAL_APPROACH'].includes(ac.cmdStep);
      // 離場飛機：飛出SMR畫面後才出現在ASR上
      const isDep=['AIRBORNE_CLIMB','DEP_APP'].includes(ac.cmdStep);
      if(isDep){
        const smrPt=nm2gCanvas(ac.ax,ac.ay);
        const onSMR=(smrPt.x>-20&&smrPt.x<cW+20&&smrPt.y>-20&&smrPt.y<cH+20);
        if(onSMR) return; // 還在SMR畫面內，不在ASR顯示
      }
      const isSel=ac.id===sel;
      const p=mm2px(ac.ax,ac.ay);
      if(p.x<-8||p.x>W+8||p.y<-8||p.y>H+8) return;
      const col=isSel?'rgba(0,200,190,1)':isArr?'rgba(126,207,255,0.95)':'rgba(61,220,132,0.95)';
      const r=3.5;
      if(isSel){
        mc.strokeStyle='rgba(0,200,190,0.7)'; mc.lineWidth=1;
        mc.beginPath(); mc.arc(p.x,p.y,r+3,0,Math.PI*2); mc.stroke();
      }
      mc.fillStyle=col; mc.beginPath(); mc.arc(p.x,p.y,r,0,Math.PI*2); mc.fill();
      const vrad=ac.aHdg*Math.PI/180;
      mc.strokeStyle=col; mc.lineWidth=0.9;
      mc.beginPath(); mc.moveTo(p.x,p.y); mc.lineTo(p.x+Math.sin(vrad)*10, p.y-Math.cos(vrad)*10); mc.stroke();
      mc.fillStyle=col; mc.font='bold 9px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(ac.callsign, p.x+r+3, p.y+3);
      mc.fillStyle='rgba(180,235,225,0.85)'; mc.font='8px Share Tech Mono';
      mc.fillText(Math.round(ac.altitude/100)*100+'ft', p.x+r+3, p.y+13);
    });
  }
}

function drawMinimap(){
  if(!mmCx||!mmW||!mmH) return;
  drawMinimapTo(mmCx, mmW, mmH, showRoutes, showAC);
}

// ══════════════════════════════════════
// GAME LOGIC
// ══════════════════════════════════════
let lastT=0;
function update(rdt){
  gTime+=rdt;
  Object.values(ACs).forEach(ac=>upAC(ac,rdt));
}
function upAC(ac,dt){
  ac.waitTimer+=dt;

  switch(ac.cmdStep){

    // 停機坪等待，飛行員主動請求出發許可
    case 'WAIT_REQ':
      if(!ac.pilotCalled && ac.waitTimer>18){
        ac.pilotCalled=true;
        qC([{seat:'AC',cs:ac.callsign,
          msg:PHR.AC.REQ_CLR(ac.callsign,ac.gate,ac.destination,ac.fl),type:'ac'}],
          ()=>{
            ac.cmdStep='WAIT_CLR';
            ac.reqFlash=true;
            updateUI();
          });
      }
      break;

    // 已頒出發許可，等玩家按後推
    case 'WAIT_CLR':
    case 'WAIT_PBK':
      break;

    // 已後推，等玩家選跑道
    case 'WAIT_RWY':
      break;

    // 滑行中
    case 'TAXIING':
      if(ac.taxiRoute.length===0) break; // 安全保護：路線未設定則不動
      moveTaxi(ac,dt);
      if(ac.taxiIdx >= ac.taxiRoute.length){
        if(!ac.assignedHold){
          // 後推到 TWY N，停下等玩家選繼續滑行
          ac.cmdStep='WAIT_TAXI_RESUME';
          ac.reqFlash=true;
          qC([
            {seat:TAXI_CONFIG.comms.taxi.atc_seat,cs:ac.callsign,
             msg:`${ac.callsign}，已到達TWY N，請指示`,type:'atc'},
            {seat:'AC',cs:ac.callsign,
             msg:`等待滑行指示，${ac.callsign}`,type:'ac'},
          ],()=>{ updateUI(); });
        } else {
          // 到達目標等待點（H-C/H-D/H-A/H-B）
          ac.cmdStep='WAIT_ENTRY';
          ac.reqFlash=true;
          qC([
            {seat:'AC',cs:ac.callsign,
             msg:`${ac.assignedHold}，${ac.callsign}，等待起飛許可`,type:'ac'},
          ],()=>{ updateUI(); });
        }
        updateUI();
      }
      break;

    case 'WAIT_TAXI_RESUME':
      break;

    // 在等待點，等玩家選 TWR 指令
    case 'WAIT_ENTRY':
      break;

    // 已進入跑道，等待起飛許可
    case 'WAIT_LINEUP':
      if(!ac.pilotCalled2 && ac.waitTimer>8){
        ac.pilotCalled2=true;
        ac.reqFlash=true;
        qC([{seat:'AC',cs:ac.callsign,
          msg:PHR.AC.READY(ac.callsign,ac.assignedRwy),type:'ac'}],
          ()=>{ updateUI(); });
      }
      break;

    case 'TAKEOFF_ROLL': {
      const perf = getPerf(ac);
      // 速度單位：px/s（liftoff kt × PX_PER_M ≈ px/s，近似 kt→m/s 後乘比例尺）
      const maxSpd = perf.spd_liftoff * PX_PER_M * 0.5144; // kt→px/s
      const accelRate = (14 + (ac.gSpd / maxSpd) * 22) * PX_PER_M * 0.5144;
      ac.gSpd = Math.min(ac.gSpd + accelRate * dt, maxSpd);
      ac.rwyRollDist += ac.gSpd * dt; // px
      const rwyStartX = ac.assignedRwy==='06' ? DTHR06.x+30 : THR24.x-30;
      const availRoll = ac.assignedRwy==='06'
        ? (THR24.x - rwyStartX)     // px
        : (rwyStartX - DTHR06.x);   // px
      if(ac.rwyRollDist >= availRoll * 0.70){
        ac.cmdStep='AIRBORNE_CLIMB';
        ac.onRwy=false;
        const rwyHdg = ac.assignedRwy==='06' ? 63 : 243;
        const arpPxX = (DTHR06.x + THR24.x) / 2;
        const liftPxX = ac.assignedRwy==='06'
          ? (rwyStartX + ac.rwyRollDist)
          : (rwyStartX - ac.rwyRollDist);
        ac.ax = (liftPxX - arpPxX) / PX_PER_M / 1852; // px→m→NM
        ac.ay = 0;
        ac.aHdg = rwyHdg;
        ac.aSpd = perf.spd_liftoff;
        ac.altitude = 80;
        ac.targetAlt = ac.fl*100 || 18000;
        ac.targetHdg = rwyHdg;
        ac.holdRwyHdg = true;
        ac.airRouteIdx = 0;
        qC([
          {seat:'TWR',cs:ac.callsign,msg:PHR.TWR.AIRBORNE(ac.callsign),type:'atc'},
          {seat:'AC', cs:ac.callsign,msg:PHR.AC.WILCO('離場，'+ac.callsign+'，再見'),type:'ac'},
        ],()=>{ ac.reqFlash=true; ac.handoffPending=true; updateUI(); });
        setMsg(ac.callsign+' 離地');
      }
      break;
    }

    // 空中爬升，等交接塔台→進近
    case 'AIRBORNE_CLIMB':
      moveAir(ac,dt);
      break;

    // RWY06：DTHR 360° 迴轉（gHdg 270→90，向右轉完整一圈）
    case 'TURNING_06': {
      const turnSpd = 40; // deg/s（慢一點，更真實）
      let diff = 90 - ac.gHdg;
      while(diff > 180) diff -= 360; while(diff < -180) diff += 360;
      // 強制右轉（正方向）
      if(diff < 0) diff += 360;
      if(diff < turnSpd*dt){
        ac.gHdg = 90;
        ac.cmdStep = ac._afterTurn || 'TAKEOFF_ROLL';
        ac._afterTurn = null;
        ac.gSpd = 0;
      } else {
        ac.gHdg = (ac.gHdg + turnSpd*dt + 360) % 360;
      }
      break;
    }

    // RWY24：THR24 180° 轉頭（gHdg 90→270，向左轉半圈）
    case 'TURNING_24': {
      const turnSpd = 40;
      let diff = 270 - ac.gHdg;
      while(diff > 180) diff -= 360; while(diff < -180) diff += 360;
      if(Math.abs(diff) < turnSpd*dt){
        ac.gHdg = 270;
        ac.cmdStep = ac._afterTurn || 'TAKEOFF_ROLL';
        ac._afterTurn = null;
        ac.gSpd = 0;
      } else {
        ac.gHdg = (ac.gHdg + Math.sign(diff)*turnSpd*dt + 360) % 360;
      }
      break;
    }

    // 進入跑道頭的最後一段滑行
    case 'TAXIING_TO_RWY':
      moveTaxi(ac,dt);
      break;



    // 進場相關
    case 'INBOUND': case 'SEQUENCING':
      // 若 waitTimer 為負，飛機尚未出現，保持靜止
      if(ac.waitTimer < 0) break;
      moveAir(ac,dt);
      // 進場中首次呼叫高雄進近
      if(!ac.pilotCalled && ac.cmdStep==='INBOUND' && ac.waitTimer>5){
        ac.pilotCalled=true;
        const distNM=Math.round(Math.sqrt(ac.ax*ac.ax+ac.ay*ac.ay));
        const alt=Math.round(ac.altitude/100)*100;
        let nearWpt='進場中';
        if(ac.airRoute && ac.airRoute.length>0 && ac.airRouteIdx<ac.airRoute.length){
          nearWpt=ac.airRoute[ac.airRouteIdx].name||'進場中';
        }
        qC([{seat:'AC',cs:ac.callsign,
          msg:`高雄進近，${ac.callsign}，${nearWpt}報告，距場${distNM}浬，高度${alt}呎，請求ILS進場`,
          type:'ac'}],()=>{ac.reqFlash=true; updateUI();});
      }
      break;

    // APPROACHING：飛機從畫面外飛向CUBON，期間顯示跑道選項
    case 'APPROACHING':
      if(ac.waitTimer < 0) break;
      // 持續將航向指向CUBON
      {
        const dx = WPT.CUBON.x - ac.ax;
        const dy = WPT.CUBON.y - ac.ay;
        ac.targetHdg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
      }
      moveAir(ac, dt);
      // 第一次出現在雷達上：APP發雷達識別通話，顯示REQ讓玩家選跑道
      if(!ac.pilotCalled && ac.waitTimer > 2){
        ac.pilotCalled = true;
        ac.reqFlash = true;
        const distNM = Math.round(Math.sqrt(ac.ax*ac.ax + ac.ay*ac.ay));
        const alt = Math.round(ac.altitude/100)*100;
        qC([
          {seat:'AC', cs:ac.callsign,
           msg:`高雄進近，${ac.callsign}，距場${distNM}浬，高度${alt}呎，請求進場`,
           type:'ac'},
          {seat:'APP',cs:ac.callsign,
           msg:`${ac.callsign}，高雄進近，雷達識別，請確認進場跑道`,
           type:'atc'},
        ],()=>{ updateUI(); });
        updateUI();
      }
      // 超時自動指派RWY06（60遊戲秒內未選），APP發通知
      if(!ac.rwyAssigned && ac.waitTimer > 60){
        ac.assignedRwy = '06';
        ac.rwyAssigned = true;
        ac.pendingArrRoute = 'CUBON-1C-06';
        qC([
          {seat:'APP',cs:ac.callsign,
           msg:`${ac.callsign}，預設指派ILS跑道06，CUBON 1C進場`,
           type:'atc'},
          {seat:'AC', cs:ac.callsign,
           msg:`ILS跑道06，CUBON 1C，${ac.callsign}`,
           type:'ac'},
        ],null);
      }
      // 抵達CUBON附近 → 切換為INBOUND，設定航路
      {
        const dx = WPT.CUBON.x - ac.ax;
        const dy = WPT.CUBON.y - ac.ay;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 1.5){
          const routeKey = ac.pendingArrRoute || 'CUBON-1C-06';
          ac.airRoute = [...(ARR_ROUTES[routeKey] || [])];
          ac.airRouteIdx = 0;
          ac.holdRwyHdg = false;
          ac.cmdStep = 'INBOUND';
          ac.reqFlash = false;
          updateUI();
        }
      }
      break;

    // 已移交高雄進近的離場飛機（TMA內，等待移交台北ACC）
    case 'DEP_APP':
      moveAir(ac,dt);
      // 飛完SID終點（CUBON等）後，APP發移交台北ACC訊息，然後消失
      if(ac.airRouteIdx >= ac.airRoute.length && !ac.accHandoffDone){
        ac.accHandoffDone=true;
        qC([
          {seat:'APP',cs:ac.callsign,msg:`${ac.callsign}，聯繫${TAXI_CONFIG.comms.handoff_to_acc.transfer_name}，再見`,type:'atc'},
          {seat:'AC', cs:ac.callsign,msg:`台北管制，${ac.callsign}，再見`,type:'ac'},
        ],()=>{
          // 短暫延遲後移除
          setTimeout(()=>{
            delete ACs[ac.id];
            if(sel===ac.id){sel=null; updateUI();}
          }, 3000);
        });
      }
      break;

    case 'FINAL_APPROACH':
      moveAir(ac,dt);
      if(ac.clearedILS){
        const rwy = ac.assignedRwy||'06';
        // 觸地：飛機接近跑道入口且高度低於 200ft
        const thrNM = rwy==='06' ? WPT.RWY06_DTHR : WPT.RWY24_THR;
        const distToThr = Math.sqrt((ac.ax-thrNM.x)**2+(ac.ay-thrNM.y)**2);
        if(distToThr < 0.5 && ac.altitude < 200){
          ac.cmdStep='LANDED';
          ac.onRwy=true;
          ac.gx = rwy==='06' ? THR24.x-80 : DTHR06.x+80;
          ac.gy = RWY_Y;
          ac.gHdg = rwy==='06' ? 270 : 90;
          ac.gSpd = 8;
          ac.altitude = 0;
          qC([
            {seat:'TWR',cs:ac.callsign,msg:PHR.TWR.VACATE(ac.callsign,'TWY A'),type:'atc'},
            {seat:'AC', cs:ac.callsign,msg:`脫離跑道，聯繫地面，${ac.callsign}`,type:'ac'},
          ],()=>{ updateUI(); });
          setMsg(ac.callsign+' 落地');
          updateUI();
        }
      }
      break;

    case 'LANDED':
      // 落地後滑行至停機坪後移除
      ac.gSpd=8;
      ac.waitTimer+=dt;
      if(ac.waitTimer>12){
        delete ACs[ac.id];
        if(sel===ac.id){sel=null; updateUI();}
      }
      break;
  }
}

function moveTaxi(ac,dt){
  if(atcSpeaking) return; // ATC 正在發話，飛機等待
  if(ac.taxiIdx>=ac.taxiRoute.length) return;
  const tgt=ac.taxiRoute[ac.taxiIdx];
  const dx=tgt.x-ac.gx, dy=tgt.y-ac.gy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  // gSpd 單位 m/s，座標為像素；移動量 = gSpd * dt * PX_PER_M
  const spd=(ac.gSpd||5) * PX_PER_M;
  if(dist<Math.max(spd*dt*1.5, 1.5)){
    ac.gx=tgt.x; ac.gy=tgt.y; ac.taxiIdx++;
  } else {
    ac.gx+=dx/dist*spd*dt;
    ac.gy+=dy/dist*spd*dt;
    if(tgt.isPushback){
      // 後推：機頭保持朝北（0°），等到達TWY N後轉向
      const northHdg = 0;
      let diff = northHdg - ac.gHdg;
      while(diff>180)diff-=360; while(diff<-180)diff+=360;
      const maxTurn=90*dt;
      if(Math.abs(diff)<maxTurn) ac.gHdg=northHdg;
      else ac.gHdg=(ac.gHdg+Math.sign(diff)*maxTurn+360)%360;
    } else {
      // 正常滑行：朝目標轉頭
      let targetHdg=Math.atan2(dx, -dy)*180/Math.PI;
      if(targetHdg<0) targetHdg+=360;
      let diff=targetHdg-ac.gHdg;
      while(diff>180)diff-=360; while(diff<-180)diff+=360;
      const maxTurn=120*dt;
      if(Math.abs(diff)<maxTurn) ac.gHdg=targetHdg;
      else ac.gHdg=(ac.gHdg+Math.sign(diff)*maxTurn+360)%360;
    }
  }
}
function moveAir(ac,dt){
  const perf = getPerf(ac);

  // ── 1. 600ft 前維持跑道航向 ──
  if(ac.holdRwyHdg){
    if(ac.altitude >= 600){
      ac.holdRwyHdg = false;
    } else {
      const rwyHdg = ac.assignedRwy==='06' ? 63 : 243;
      ac.targetHdg = rwyHdg;
    }
  }

  // ── 2. airRoute 航點循跡 ──
  if(!ac.holdRwyHdg && ac.airRoute && ac.airRouteIdx < ac.airRoute.length){
    const wpt = ac.airRoute[ac.airRouteIdx];
    const dx = wpt.x - ac.ax, dy = wpt.y - ac.ay;
    const distNM = Math.sqrt(dx*dx + dy*dy);

    if(wpt.spdMax && ac.aSpd > wpt.spdMax) ac.aSpd = wpt.spdMax;
    if(wpt.altTarget !== undefined) ac.targetAlt = wpt.altTarget;

    let hdgToWpt = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;

    // 在 FAP（最後進場點）後 → 維持 ILS 航向，不直飛座標
    if(wpt.isFF && ac.clearedILS){
      hdgToWpt = ac.assignedRwy==='06' ? 67 : 247;
    }
    // 已過 FAP 正在飛向 THR → 維持 ILS 航向
    if(wpt.isTHR && ac.clearedILS){
      hdgToWpt = ac.assignedRwy==='06' ? 67 : 247;
    }
    // 名稱確認（FAP_06 / FAP_24）
    if((wpt.name==='FAP_06' || wpt.name==='RWY06') && ac.clearedILS) hdgToWpt = 67;
    if((wpt.name==='FAP_24' || wpt.name==='RWY24') && ac.clearedILS) hdgToWpt = 247;

    ac.targetHdg = hdgToWpt;

    const captureR = wpt.isTHR ? 0.4 : (wpt.isFF ? 0.5 : 0.8);
    if(distNM < captureR) ac.airRouteIdx++;
  }

  // ── 3. 平滑轉向 ──
  if(ac.targetHdg !== null && ac.targetHdg !== undefined){
    let d = ac.targetHdg - ac.aHdg;
    while(d > 180) d -= 360; while(d < -180) d += 360;
    const maxTurn = perf.turn_rate * dt;
    if(Math.abs(d) < maxTurn) ac.aHdg = ac.targetHdg;
    else ac.aHdg = (ac.aHdg + Math.sign(d)*maxTurn + 360) % 360;
  }

  // ── 4. 高度管理（從 AC_PERF 取值）──
  if(ac.targetAlt !== undefined){
    const altDiff = ac.targetAlt - ac.altitude;
    let vs;
    if(ac.cmdStep === 'FINAL_APPROACH') vs = perf.vs_final / 60;
    else if(altDiff > 0)                vs = perf.vs_climb  / 60;
    else                                vs = perf.vs_desc   / 60;
    if(Math.abs(altDiff) < vs*dt) ac.altitude = ac.targetAlt;
    else ac.altitude += Math.sign(altDiff) * vs * dt;
  }

  // ── 5. 速度管理（從 AC_PERF 取值）──
  if(ac.cmdStep==='AIRBORNE_CLIMB'||ac.cmdStep==='DEP_APP'){
    const tgt = ac.altitude > 10000 ? perf.spd_cruise : perf.spd_climb;
    if(ac.aSpd < tgt) ac.aSpd = Math.min(ac.aSpd + 5*dt, tgt);
  } else if(ac.cmdStep==='INBOUND'||ac.cmdStep==='SEQUENCING'||ac.cmdStep==='APPROACHING'){
    if(ac.aSpd > perf.spd_approach) ac.aSpd = Math.max(ac.aSpd - 3*dt, perf.spd_approach);
  } else if(ac.cmdStep==='FINAL_APPROACH'){
    const tgt = ac.clearedILS ? perf.spd_land : perf.spd_approach;
    if(ac.aSpd > tgt) ac.aSpd = Math.max(ac.aSpd - 4*dt, tgt);
    else              ac.aSpd = Math.min(ac.aSpd + 2*dt, tgt);
  }

  // ── 6. 位置更新 ──
  const rad = ac.aHdg * Math.PI / 180;
  const nms = ac.aSpd / 3600;
  ac.ax += Math.sin(rad) * nms * dt;
  ac.ay += Math.cos(rad) * nms * dt;
}
