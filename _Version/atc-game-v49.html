const W_=()=>String(wind.dir).padStart(3,'0')+'°/'+wind.spd+'KT';
const SQ=()=>Math.floor(Math.random()*6000+1000).toString();

// ══════════════════════════════════════
// COMMANDS
// ══════════════════════════════════════
function getCmds(ac){
  if(!ac) return [];
  switch(ac.cmdStep){
    case 'PROCESSING':   return []; // 通話中，暫無可用指令
    case 'WAIT_REQ':   return [];
    case 'WAIT_CLR':   return [{l:'出發許可 CLR',a:'CLR',seat:TAXI_CONFIG.comms.clearance.atc_seat}];
    case 'WAIT_PBK':   return [
      {l:'後推 PBK',a:'PBK',seat:TAXI_CONFIG.comms.pushback.atc_seat},
    ];
    case 'WAIT_RWY':   return [
      {l:'跑道 06',a:'RWY06',seat:TAXI_CONFIG.comms.taxi.atc_seat,rwy:'06'},
      {l:'跑道 24',a:'RWY24',seat:TAXI_CONFIG.comms.taxi.atc_seat,rwy:'24'},
      {l:'取消',   a:'CANCEL_RWY',seat:'GND'},
    ];
    // 後推到 TWY N 停下，等玩家選繼續滑行
    case 'WAIT_TAXI_RESUME':
      if(ac.assignedRwy==='06') return [
        {l:'繼續滑行→H-D',a:'TAXI_HD',seat:TAXI_CONFIG.comms.taxi.atc_seat},
        {l:'繼續滑行→H-C',a:'TAXI_HC',seat:TAXI_CONFIG.comms.taxi.atc_seat},
      ];
      return [
        {l:'繼續滑行→H-A',a:'TAXI_HA',seat:TAXI_CONFIG.comms.taxi.atc_seat},
        {l:'繼續滑行→H-B',a:'TAXI_HB',seat:TAXI_CONFIG.comms.taxi.atc_seat},
      ];
    case 'TAXIING':    return [{l:'停止 HLD',a:'HLD',seat:TAXI_CONFIG.comms.taxi.atc_seat}];
    // 到達等待點，玩家選起飛指令（TWR）
    case 'WAIT_ENTRY': {
      const twr = TAXI_CONFIG.comms.takeoff.atc_seat;
      const lbl = ac.assignedHold || (ac.assignedRwy==='06'?'H-D':'H-A');
      return [
        {l:'許可起飛 T/O',  a:'TOF',      seat:twr},
        {l:'跑道頭等待 LUP',a:'LUP',      seat:twr},
        {l:'原地等待',       a:'HLD_WAIT', seat:twr},
      ];
    }
    // 跑道頭等待後只剩許可起飛
    case 'WAIT_LINEUP': return [{l:'許可起飛 T/O',a:'TOF',seat:TAXI_CONFIG.comms.takeoff.atc_seat}];
    case 'AIRBORNE_CLIMB': return ac.handoffPending?[{l:'移交進近 →APP',a:'HANDOFF',seat:TAXI_CONFIG.comms.handoff_to_departure.atc_seat}]:[];
    case 'DEP_APP':        return []; // 高雄進近管轄中，等待自動移交台北ACC
    // ── APPROACHING：飛往CUBON途中，選擇跑道（高雄進近） ──
    case 'APPROACHING': return [
      {l:'指派 RWY06',a:'ASSIGN06',seat:TAXI_CONFIG.comms.approach.atc_seat,rwy:'06'},
      {l:'指派 RWY24',a:'ASSIGN24',seat:TAXI_CONFIG.comms.approach.atc_seat,rwy:'24'},
    ];
    case 'INBOUND':    return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:TAXI_CONFIG.comms.ils_clearance.atc_seat},
      {l:'ILS許可 RWY24',a:'ILS24',seat:TAXI_CONFIG.comms.ils_clearance.atc_seat},
      {l:'向量引導',      a:'VEC',  seat:TAXI_CONFIG.comms.approach.atc_seat},
    ];
    case 'SEQUENCING': return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:TAXI_CONFIG.comms.ils_clearance.atc_seat},
      {l:'ILS許可 RWY24',a:'ILS24',seat:TAXI_CONFIG.comms.ils_clearance.atc_seat},
      {l:'向量引導',      a:'VEC',  seat:TAXI_CONFIG.comms.approach.atc_seat},
    ];
    case 'FINAL_APPROACH':
      if(!ac.landingCleared) return [
        {l:'降落許可',a:'LND',seat:TAXI_CONFIG.comms.landing.atc_seat},
        {l:'重飛',    a:'GAR',seat:TAXI_CONFIG.comms.landing.atc_seat},
      ];
      return [{l:'重飛',a:'GAR',seat:TAXI_CONFIG.comms.landing.atc_seat}];
    default: return [];
  }
}

function execCmd(ac,a){
  const cs=ac.callsign;

  switch(a){
    case 'CLR': {
      const rwy = ac.assignedRwy || '06';
      const sidName = rwy==='24' ? 'CUBON 1B' : 'CUBON 1A';
      ac.sid = sidName;
      ac.airRoute = SID_ROUTES[sidName] ? [...SID_ROUTES[sidName]] : [];
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = true;
      ac.reqFlash = false;
      ac.cmdStep = 'PROCESSING'; // 暫時狀態：通話中，沒有可用指令
      const sq=SQ();
      qC([
        {seat:TAXI_CONFIG.comms.clearance.atc_seat,cs,msg:PHR.DEL.CLEARANCE(cs,ac.destination,ac.fl,sidName,sq),type:'atc'},
        {seat:'AC', cs,msg:PHR.DEL.READBACK(cs,ac.destination,ac.fl,sidName,sq),type:'ac'},
      ],()=>{ ac.cmdStep='WAIT_PBK'; ac.reqFlash=true; updateUI(); });
      break;
    }

    case 'PBK':
      ac.cmdStep='WAIT_RWY';
      ac.reqFlash=false;
      updateUI();
      break;

    case 'RWY06':
    case 'RWY24': {
      const rwy = a==='RWY06' ? '06' : '24';
      ac.assignedRwy = rwy;
      ac.reqFlash = false;
      const face = rwy==='06' ? '西' : '東'; // 06跑道後推後機頭面西（往H-D方向），24跑道面東（往H-A方向）
      // 只發後推指令，滑行指令待玩家在 TWY N 停下後再發
      qC([
        {seat:TAXI_CONFIG.comms.pushback.atc_seat,cs,msg:PHR.GND.PUSHBACK(cs,ac.gate,face),type:'atc'},
        {seat:'AC',cs,msg:PHR.GND.PUSHBACK_READBACK(cs,ac.gate,face),type:'ac'},
      ],()=>{ updateUI(); });
      // 後推路線：機位 → TWY N（y=TWY_N_Y），到達後停下
      ac.taxiRoute = [{ x: ac.gx, y: TWY_N_Y, isPushback: true }];
      ac.taxiIdx = 0; ac.gSpd = 2;
      ac.cmdStep = 'TAXIING';
      ac.reqFlash = false; // 滑行中不亮 REQ
      break;
    }

    // 到達 TWY N 後玩家選擇目標等待點
    case 'TAXI_HD': case 'TAXI_HC': case 'TAXI_HA': case 'TAXI_HB': {
      const holdKey = {TAXI_HD:'H-D',TAXI_HC:'H-C',TAXI_HA:'H-A',TAXI_HB:'H-B'}[a];
      const hp = HOLDPOINTS[holdKey];
      ac.assignedHold = holdKey;
      qC([
        {seat:TAXI_CONFIG.comms.taxi.atc_seat,cs,msg:PHR.GND.TAXI(cs,'TWY N',hp.label,ac.assignedRwy),type:'atc'},
        {seat:'AC',cs,msg:PHR.GND.TAXI_READBACK(cs,'TWY N',hp.label,ac.assignedRwy),type:'ac'},
      ],()=>{ updateUI(); });
      // 從 TWY N 滑至等待點（連接道北端），到達後停下等 TWR 指令
      ac.taxiRoute = [{ x: hp.x, y: TWY_N_Y }, { x: hp.x, y: hp.y }];
      ac.taxiIdx = 0; ac.gSpd = 5;
      ac.cmdStep = 'TAXIING';
      ac.reqFlash = false; // 滑行中不亮 REQ
      break;
    }

    case 'HLD_WAIT':
      // 原地等待（TWR指令）
      qC([
        {seat:TAXI_CONFIG.comms.lineup.atc_seat,cs,msg:`${cs}，${ac.assignedHold||'等待點'}，原地等待`,type:'atc'},
        {seat:'AC',cs,msg:`原地等待，${cs}`,type:'ac'},
      ],()=>{ updateUI(); });
      // 不改變 cmdStep，保持 WAIT_ENTRY
      break;

    case 'CANCEL_RWY':
      // 取消，回到後推待命狀態
      ac.cmdStep='WAIT_PBK';
      ac.reqFlash=false;
      updateUI();
      break;

    case 'HLD':
      ac.taxiIdx=ac.taxiRoute.length; // 停在原地
      setMsg(cs+' 停止');
      break;

    // HOLD_ENTRY 已移除（由 HLD_WAIT 取代）

    // 舊 LUP 已合併至 TOF/LUP 新邏輯

    case 'TOF':
    case 'LUP': {
      const rwy = ac.assignedRwy||'06';
      const hold = ac.assignedHold || (rwy==='06'?'H-D':'H-A');
      const isImmediate = (a==='TOF'); // TOF=立即起飛，LUP=跑道頭等待

      if(isImmediate){
        qC([
          {seat:TAXI_CONFIG.comms.takeoff.atc_seat,cs,msg:PHR.TWR.TAKEOFF(cs,rwy,W_()),type:'atc'},
          {seat:'AC',cs,msg:PHR.TWR.TAKEOFF_RB(cs,rwy),type:'ac'},
        ],null);
      } else {
        qC([
          {seat:TAXI_CONFIG.comms.lineup.atc_seat,cs,msg:PHR.TWR.LINEUP(cs,rwy),type:'atc'},
          {seat:'AC',cs,msg:PHR.TWR.LINEUP_RB(cs,rwy),type:'ac'},
        ],null);
      }
      ac.reqFlash = false;

      if(rwy==='06'){
        // RWY06：從 H-C 或 H-D 進跑道 → 向西滑至 DTHR → 360° 迴轉 → 向東起飛
        const connX = CONN[hold==='H-C'?'C':'D'];
        const dthrX = DTHR06.x + 30;
        ac.taxiRoute = [
          { x: connX, y: RWY_Y },  // 從等待點進入跑道
          { x: dthrX, y: RWY_Y },  // 向西滑至 DTHR
        ];
        ac.taxiIdx=0; ac.gSpd=5;
        ac.cmdStep='TAXIING_TO_RWY';
        const chk06 = setInterval(()=>{
          if(ac.taxiIdx >= ac.taxiRoute.length){
            clearInterval(chk06);
            ac.gx=dthrX; ac.gy=RWY_Y;
            ac.gHdg=270; ac.gSpd=0;
            ac.onRwy=true; ac.rwyRollDist=0;
            ac.cmdStep = 'TURNING_06';
            ac._afterTurn = isImmediate ? 'TAKEOFF_ROLL' : 'WAIT_LINEUP';
            ac.waitTimer=0;
            updateUI();
          }
        },100);

      } else {
        // RWY24 H-A：TWY A 直接進跑道 → 180° 轉頭向西
        // RWY24 H-B：TWY B 進跑道 → 滑到 THR24 → 180° 轉頭向西
        const connX = CONN[hold==='H-A'?'A':'B'];
        const needSlideToThr = (hold==='H-B');
        const taxiPts = needSlideToThr
          ? [{ x: connX, y: RWY_Y }, { x: THR24.x - 20, y: RWY_Y }]
          : [{ x: connX, y: RWY_Y }];
        ac.taxiRoute = taxiPts;
        ac.taxiIdx=0; ac.gSpd=5;
        ac.cmdStep='TAXIING_TO_RWY';
        const chk24 = setInterval(()=>{
          if(ac.taxiIdx >= ac.taxiRoute.length){
            clearInterval(chk24);
            ac.gx = needSlideToThr ? THR24.x-20 : connX;
            ac.gy = RWY_Y;
            ac.gHdg = 90; ac.gSpd = 0;  // 朝東（剛進來的方向）
            ac.onRwy=true; ac.rwyRollDist=0;
            ac.cmdStep = 'TURNING_24';
            ac._afterTurn = isImmediate ? 'TAKEOFF_ROLL' : 'WAIT_LINEUP';
            ac.waitTimer=0;
            updateUI();
          }
        },100);
      }
      break;
    }

    // ── 指派進場跑道（APPROACHING狀態）──
    case 'ASSIGN06':
    case 'ASSIGN24': {
      const rwy = a==='ASSIGN24' ? '24' : '06';
      const routeKey = rwy==='06' ? 'CUBON-1C-06' : 'CUBON-2D-24';
      const starName = rwy==='06' ? 'CUBON 1C' : 'CUBON 2D';
      ac.assignedRwy = rwy;
      ac.rwyAssigned = true;
      ac.reqFlash = false;
      ac.pendingArrRoute = routeKey;
      qC([
        {seat:'APP',cs,msg:`${cs}，許可ILS跑道${rwy}進場，${starName}，下降並維持8000呎`,type:'atc'},
        {seat:'AC', cs,msg:`ILS跑道${rwy}，${starName}，下降8000呎，${cs}`,type:'ac'},
      ],()=>{ updateUI(); });
      updateUI();
      break;
    }

        case 'HANDOFF':
      // 塔台移交高雄進近（離場）
      qC([
        {seat:'TWR',cs,msg:`${cs}，聯繫高雄進近124.6，再見`,type:'atc'},
        {seat:'AC', cs,msg:PHR.AC.WILCO(`高雄進近124.6，${cs}，再見`),type:'ac'},
      ],()=>{
        ac.cmdStep='DEP_APP';
        ac.handoffPending=false;
        ac.reqFlash=false;
        updateUI();
      });
      setMsg(cs+' 已移交高雄進近 124.6');
      break;

    // ── 進場指令（高雄進近管） ──
    case 'D4K':
      qC([{seat:'APP',cs,msg:PHR.APP.CONTACT(cs,'4000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'4000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=4000; ac.cmdStep='SEQUENCING';}); break;
    case 'D2K':
      qC([{seat:'APP',cs,msg:PHR.APP.CONTACT(cs,'2000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'2000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=2000; ac.cmdStep='SEQUENCING';}); break;
    case 'ILS06':
    case 'ILS24':
    case 'ILS': {
      const ilsRwy = a==='ILS24' ? '24' : '06';
      ac.assignedRwy = ilsRwy;

      // 選擇進場路線：依飛機目前位置選最近 IAF
      let routeKey;
      if(ilsRwy==='06'){
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-1C-06' : 'ILS-SANDY-06';
      } else {
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-2D-24' : 'ILS-AMTIK-24';
      }

      // 從距飛機最近的剩餘航點開始
      const fullRoute = [...(ARR_ROUTES[routeKey] || [])];
      let startIdx = 0, minDist = Infinity;
      fullRoute.forEach((wpt,i)=>{
        if(wpt.isTHR) return;
        const d = Math.sqrt((ac.ax-wpt.x)**2+(ac.ay-wpt.y)**2);
        if(d < minDist){ minDist=d; startIdx=i; }
      });
      ac.airRoute = fullRoute.slice(startIdx);
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = false;

      // APP發ILS許可，並在readback後自動移交金門塔台
      qC([
        {seat:'APP',cs,msg:PHR.APP.ILS(cs,ilsRwy,'2000'),type:'atc'},
        {seat:'AC', cs,msg:PHR.APP.ILS_RB(cs,ilsRwy),type:'ac'},
        {seat:'APP',cs,msg:`${cs}，聯繫金門塔台118.0，再見`,type:'atc'},
        {seat:'AC', cs,msg:`金門塔台118.0，${cs}，再見`,type:'ac'},
      ],()=>{
        ac.cmdStep='FINAL_APPROACH';
        ac.clearedILS=true;
        ac.aSpd=155;
        // 飛機呼叫塔台建立最後進場
        setTimeout(()=>{
          qC([{seat:'AC',cs,
            msg:`金門塔台，${cs}，ILS跑道${ilsRwy}，最後進場，請求降落許可`,
            type:'ac'}],()=>{ac.reqFlash=true; updateUI();});
        }, 800);
        updateUI();
      });
      break;
    }
    case 'LND':
      ac.landingCleared=true;
      qC([{seat:'TWR',cs,msg:PHR.TWR.LAND(cs,ac.assignedRwy||'06',W_()),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.LAND_RB(cs,ac.assignedRwy||'06'),type:'ac'}],
        ()=>{ updateUI(); }); break;
    case 'GAR':
      qC([{seat:'TWR',cs,msg:PHR.TWR.GOAROUND(cs),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.GOAROUND_RB(cs),type:'ac'}],
        ()=>{ac.cmdStep='SEQUENCING';ac.clearedILS=false;ac.targetAlt=3000;ac.aSpd=200;}); break;
    case 'VEC': {
      const nh=Math.round((ac.aHdg+30)%360);
      qC([{seat:'APP',cs,msg:PHR.APP.VECTOR(cs,nh,'排序間距'),type:'atc'},
          {seat:'AC', cs,msg:PHR.AC.WILCO(`航向${nh}，${cs}`),type:'ac'}],
        ()=>{ac.targetHdg=nh; ac.airRoute=[]; ac.airRouteIdx=0;}); break;
    }
  }
  updateUI();
}

// 建立滑行路線（像素座標）：後推→TWY N→連接道→等待點
// buildTaxiRoute 已由 execCmd 內的路線邏輯取代
function buildTaxiRoute(ac, holdPt){ return []; }

function getTaxiPreview(ac, rwy){
  const holdKey = ac.assignedHold || (rwy==='06'?'H-D':'H-A');
  const hp = HOLDPOINTS[holdKey] || (rwy==='06'?HOLD_06:HOLD_24);
  return [
    { x: ac.gx, y: TWY_N_Y },
    { x: hp.x,  y: TWY_N_Y },
    { x: hp.x,  y: hp.y    },
  ];

// ══════════════════════════════════════
// TYPEWRITER COMMS
// ══════════════════════════════════════
function qC(lines,onDone){
  twQueue.push({lines,onDone,idx:0});
  if(!twTimer) processQueue();
}
let atcSpeaking = false; // ATC 正在發話時為 true，飛機不能移動（AC回話時可移動）

function processQueue(){
  twTimer=null;
  if(!twQueue.length){ atcSpeaking=false; return; }
  const job=twQueue[0];
  if(job.idx>=job.lines.length){
    twQueue.shift();
    if(job.onDone) setTimeout(job.onDone, 150);
    twTimer=setTimeout(processQueue, 60);
    return;
  }
  const e=job.lines[job.idx++];
  // 間隔計算：ATC→AC 或 AC→ATC 之間固定 3 遊戲秒
  // 3 遊戲秒 = 3000 / GAME_SPEED 毫秒（真實時間）
  const INTER_MSG_DELAY = Math.round(3000 / GAME_SPEED); // ms
  const delay = e.type==='ac' ? INTER_MSG_DELAY : 0;
  // ATC 發話期間鎖定移動；AC 回話期間解鎖
  atcSpeaking = (e.type==='atc');
  twTimer=setTimeout(()=>{
    typeLine(e, ()=>{
      if(e.type==='atc') atcSpeaking=false; // ATC 訊息結束，解鎖
      twTimer=setTimeout(processQueue, INTER_MSG_DELAY); // 訊息結束後也等間隔
    });
  }, delay);
}
// Track which channel the last ATC message used
let lastAtcSeatKey = null;
let activeTypingEl = null; // currently typing message element — prevents visual overlap

function typeLine(entry,onDone){
  const{seat,cs,msg,type}=entry;
  cLog.unshift({seat,msg,type,t:gTime});
  if(cLog.length>100)cLog.pop();

  // Determine badge class, label, message class
  let badgeCls, badgeLabel, msgCls;
  if(seat==='TWR'){
    badgeCls='twr'; badgeLabel='TWR'; msgCls='twr-txt';
    lastAtcSeatKey='twr';
  } else if(seat==='APP'){
    badgeCls='app'; badgeLabel='APP'; msgCls='app-txt';
    lastAtcSeatKey='app';
  } else if(seat==='GND'||seat==='DEL'){
    badgeCls='gnd'; badgeLabel='GND'; msgCls='gnd-txt';
    lastAtcSeatKey='gnd';
  } else if(seat==='ATIS'){
    badgeCls='atis'; badgeLabel='ATIS'; msgCls='atis-txt';
    lastAtcSeatKey='atis';
  } else {
    badgeCls='ac'; badgeLabel='A/C'; msgCls='ac-txt';
  }

  const log=document.getElementById('ch-log');
  if(log){
    // Build the new row
    const row=document.createElement('div');
    row.className='ch-entry new-entry';

    const badgeWrap=document.createElement('div');
    badgeWrap.className='ch-entry-badge';
    const sq=document.createElement('span');
    sq.className='ch-badge-sq '+badgeCls;
    sq.textContent=badgeLabel;
    badgeWrap.appendChild(sq);

    const msgEl=document.createElement('span');
    msgEl.className='ch-entry-msg '+msgCls;

    row.appendChild(badgeWrap);
    row.appendChild(msgEl);

    // Insert at top
    log.insertBefore(row, log.firstChild);
    // Trim to max 30 entries
    while(log.children.length>30) log.removeChild(log.lastChild);

    // Mark this as the active typing element
    activeTypingEl=msgEl;

    // Typewriter — character by character
    let i2=0; const chars2=[...msg];
    function tick2(){
      if(i2<chars2.length){
        msgEl.textContent+=chars2[i2++];
        setTimeout(tick2, TW_SPD);
      } else {
        activeTypingEl=null;
        if(onDone) onDone();
      }
    }
    tick2();
    return;
  }
  if(onDone) onDone();
}
function fSeat(s){ cFilt=s; }

// ══════════════════════════════════════
// CANVAS CLICK
// ══════════════════════════════════════
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let found=null, bestDist=999;
  Object.values(ACs).forEach(ac=>{
    let px,py;
    if(isGnd(ac.cmdStep)){
      const pos=getACPos(ac); px=pos.px; py=pos.py;
    } else {
      // Air AC drawn on ground view via nm2gCanvas
      const p=nm2gCanvas(ac.ax,ac.ay); px=p.x; py=p.y;
    }
    const d=Math.sqrt((mx-px)**2+(my-py)**2);
    if(d<30 && d<bestDist){ bestDist=d; found=ac; }
  });
  sel = found ? found.id : null;
  updateUI();
});

// ══════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════
function posText(ac){
  const s=ac.cmdStep;
  switch(s){
    case 'PROCESSING':    return `通話中...`;
    case 'WAIT_REQ':     return `停機 ${ac.gate} ⏳`;
    case 'WAIT_CLR':     return `停機 ${ac.gate} — 等許可`;
    case 'WAIT_PBK':     return `停機 ${ac.gate} — 等後推`;
    case 'WAIT_RWY':        return `停機 ${ac.gate} — 選擇跑道`;
    case 'TAXIING':         return ac.assignedHold
                              ? `TWY N → ${ac.assignedHold}`
                              : `後推中 → TWY N`;
    case 'WAIT_TAXI_RESUME':return `TWY N — 等待滑行指示`;
    case 'TAXIING_TO_RWY':  return `進入跑道 ${ac.assignedRwy}`;
    case 'WAIT_ENTRY':      return `${ac.assignedHold||'等待點'} — 等起飛許可`;
    case 'WAIT_LINEUP':     return `RWY ${ac.assignedRwy} 跑道頭等待`;
    case 'TURNING_06':      return `DTHR 360° 迴轉中`;
    case 'TURNING_24':      return `THR24 180° 轉頭中`;
    case 'TAKEOFF_ROLL':    return `RWY ${ac.assignedRwy} 起飛滾行 ↑`;
    case 'AIRBORNE_CLIMB': return `爬升中 ${Math.round(ac.altitude)}ft`;
    case 'DEP_APP':        return `高雄進近 ${Math.round(ac.altitude)}ft`;
    case 'APPROACHING':    return `進入TMA ${Math.round(ac.altitude)}ft`;
    case 'INBOUND':        return `進場中 ${Math.round(ac.altitude)}ft`;
    case 'SEQUENCING':     return `引導排序 ${Math.round(ac.altitude)}ft`;
    case 'FINAL_APPROACH': return `ILS RWY${ac.assignedRwy||'06'} 最終進場`;
    case 'LANDED':       return `落地滑行 RWY${ac.assignedRwy||'06'}`;
    default: return s;
  }
}
function posClass(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','WAIT_TAXI_RESUME','TAXIING_TO_RWY'].includes(s)) return 'gnd';
  if(['WAIT_ENTRY','WAIT_LINEUP','TURNING_06','TURNING_24','TAKEOFF_ROLL','LANDED'].includes(s)) return 'rwy';
  if(s==='FINAL_APPROACH') return 'app';
  return 'air';
}
function badgeCls(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','WAIT_TAXI_RESUME','TAXIING_TO_RWY'].includes(s)) return 'b-gnd';
  if(['WAIT_ENTRY','WAIT_LINEUP','TURNING_06','TURNING_24','TAKEOFF_ROLL','LANDED'].includes(s)) return 'b-rwy';
  if(s==='FINAL_APPROACH') return 'b-app';
  return 'b-air';
}
function badgeTxt(ac){
  const s=ac.cmdStep;
  const m={
    PROCESSING:'通話中',WAIT_REQ:'停機',WAIT_CLR:'等許可',WAIT_PBK:'等後推',WAIT_RWY:'選跑道',
    TAXIING:'滑行',WAIT_TAXI_RESUME:'TWY N等',TAXIING_TO_RWY:'進跑道',
    WAIT_ENTRY:'等起飛',WAIT_LINEUP:'跑道頭等',TAKEOFF_ROLL:'起飛',
    TURNING_06:'迴轉',TURNING_24:'轉頭',
    AIRBORNE_CLIMB:'爬升',DEP_APP:'高雄進近',APPROACHING:'進入TMA',
    INBOUND:'進場',SEQUENCING:'排序',FINAL_APPROACH:'ILS進場',
    LANDED:'落地'
  };
  return m[s]||s;
}
function isGnd(s){
  return['WAIT_REQ','WAIT_CLR','PROCESSING','WAIT_PBK','WAIT_RWY',
         'TAXIING','WAIT_TAXI_RESUME','TAXIING_TO_RWY',
         'WAIT_ENTRY','WAIT_LINEUP',
         'TURNING_06','TURNING_24','TAKEOFF_ROLL','LANDED'].includes(s);
}
function setMsg(t){ /* status bar removed in v24 */ }
function setView(v){ view=v; } // kept for compatibility; both canvases always render

// AC image path
function acImgSrc(airline,type){
  const al_code=airline==='立榮航空'?'B7':airline==='華信航空'?'AE':airline==='中華民國空軍'?'ROCAF':'XX';
  const ty=type.replace(/[\s\-]/g,'').replace('/','');
  return `/image/${al_code}-${ty}.jpg`;
}

// ══════════════════════════════════════
// UI UPDATE
// ══════════════════════════════════════
function updateClock(){
  const t=gTime;
  const h=Math.floor(t/3600)%24, m=Math.floor((t%3600)/60), s=Math.floor(t%60);
  const str=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el=document.getElementById('clock-sm');
  if(el) el.textContent=str;
}

function updateUI(){
  updateClock();

  // ── 中間欄：選中航班詳情 ──
  const ac=sel?ACs[sel]:null;

  const imgBox=document.getElementById('ac-img-box');
  const infoText=document.getElementById('ac-info-text');

  if(ac && imgBox && infoText){
    const gnd=isGnd(ac.cmdStep);
    const imgSrc=acImgSrc(ac.airline,ac.type);
    imgBox.innerHTML=`<img src="${imgSrc}" alt="${ac.type}"
      onerror="this.parentElement.innerHTML='<div id=\\"ac-img-placeholder\\">${ac.type}</div>'">`;
    // Air: show alt+spd, hide gate/rwy. Ground: show gate/rwy, hide alt+spd
    const airInfo=!gnd
      ?`<div class="ac-row">高度 <span>${Math.round(ac.altitude/100)*100}ft</span> &nbsp; 速度 <span>${Math.round(ac.aSpd)}kt</span> &nbsp; 航向 <span>${String(Math.round(ac.aHdg)%360).padStart(3,'0')}°</span></div>`
      :'';
    const gndInfo=gnd
      ?`<div class="ac-row">機坪 <span>${ac.gate||'—'}</span>${ac.assignedRwy?` &nbsp; 跑道 <span>RWY ${ac.assignedRwy}</span>`:''}</div>`
      :'';
    infoText.innerHTML=`
      <div id="ac-cs-big">${ac.callsign}</div>
      <div id="ac-airline-lbl">${ac.airline} &nbsp;<span style="color:var(--t3);font-family:var(--mono);font-size:10px">${ac.type}</span></div>
      <div class="ac-row">${gnd?`目的地 <span>${ac.destination}</span>`:`來自 <span>${ac.origin}</span>`}</div>
      ${airInfo}${gndInfo}`;
  } else if(imgBox && infoText){
    imgBox.innerHTML='<div id="ac-img-placeholder">— 點選航機 —</div>';
    infoText.innerHTML='<div id="ac-empty-msg">選擇左側或右側<br>管制條以顯示詳情</div>';
  }

  rebuildCmds(ac);
  rebuildStrips();
  updateChannels();
}

// Update ATC channel callsign displays
function updateChannels(){
  // 三個頻道徽章恆亮
  ['badge-app','badge-twr','badge-gnd'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.add('on');
  });
}

function rebuildCmds(ac){
  const btns=document.getElementById('cmd-btns');
  if(!btns) return;
  if(ac){
    const cmds=getCmds(ac);
    btns.innerHTML='';
    if(!cmds.length){
      btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 等待指示 —</span>';
      return;
    }
    cmds.forEach(cmd=>{
      const b=document.createElement('button');
      b.className='cb seat-'+(cmd.seat||'GND');
      const seatCls={DEL:'DEL',GND:'GND',TWR:'TWR',APP:'APP'}[cmd.seat]||'GND';
      b.innerHTML=`<span class="cb-seat-lbl ${seatCls}">[${cmd.seat}]</span>${cmd.l}`;
      b.dataset.action=cmd.a;
      b.dataset.acid=ac.id;
      if(cmd.rwy){
        b.addEventListener('mouseenter',()=>{ ac.previewRwy=cmd.rwy; });
        b.addEventListener('mouseleave',()=>{ ac.previewRwy=null; });
      }
      btns.appendChild(b);
    });
  } else {
    btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 點選航機後顯示指令 —</span>';
  }
}

function rebuildStrips(){
  const sdep=document.getElementById('sdep');
  const sarr=document.getElementById('sarr');
  if(!sdep||!sarr) return;

  sdep.innerHTML=''; sarr.innerHTML='';

  const DEP=['WAIT_REQ','WAIT_CLR','PROCESSING','WAIT_PBK','WAIT_RWY',
             'TAXIING','WAIT_TAXI_RESUME','TAXIING_TO_RWY',
             'WAIT_ENTRY','WAIT_LINEUP',
             'TURNING_06','TURNING_24','TAKEOFF_ROLL','AIRBORNE_CLIMB','DEP_APP'];
  const ARR=['APPROACHING','INBOUND','SEQUENCING','FINAL_APPROACH','LANDED'];
  let dc=0, ac2=0;
  let firstDep=null, firstArr=null;

  // If selected AC no longer exists, clear selection
  if(sel && !ACs[sel]){
    // Try to find another AC to select
    const remaining=Object.values(ACs);
    sel = remaining.length ? remaining[0].id : null;
  }

  Object.values(ACs).forEach(a=>{
    const isDep=DEP.includes(a.cmdStep);
    const isArr=ARR.includes(a.cmdStep);
    if(!isDep&&!isArr) return;

    const isSel=a.id===sel;
    if(isDep){ dc++; if(!firstDep) firstDep=a.id; }
    else      { ac2++; if(!firstArr) firstArr=a.id; }

    const div=document.createElement('div');
    div.className=`fs ${isDep?'dep':'arr'}${isSel?' sel':''}${a.reqFlash?' req-flash':''}`;
    div.dataset.acid=a.id;

    const destIcao=AIRPORT_ICAO[a.destination]||a.destination;
    const origIcao=AIRPORT_ICAO[a.origin]||a.origin;
    const routeTxt=isDep
      ?`→ ${a.destination} <span style="color:var(--t2);font-size:9px">${destIcao}</span>`
      :`← ${a.origin} <span style="color:var(--t2);font-size:9px">${origIcao}</span>`;

    div.innerHTML=`
      <div class="fs-top">
        <span class="fs-cs">${a.callsign}</span>
        ${a.reqFlash?'<span class="req-tag">REQ</span>':''}
      </div>
      <div class="fs-bot">
        <span class="fs-ty">${a.type}</span>
        <span class="fs-route">${routeTxt}</span>
        <span class="fs-pos ${posClass(a)}">${posText(a)}</span>
      </div>`;

    (isDep?sdep:sarr).appendChild(div);
  });

  document.getElementById('cnt-dep').textContent=dc;
  document.getElementById('cnt-arr').textContent=ac2;
}

// ══════════════════════════════════════
// SPAWN
// ══════════════════════════════════════
function broadcastATIS(){
  const atisMsg=`金門機場情報資訊甲，跑道使用中06，地面風050度12節，能見度10公里，晴天，QNH 1013，進場ILS跑道06，離場程序CUBON 1A，情報甲`;
  qC([{seat:'ATIS',cs:'ATIS',msg:atisMsg,type:'atc'}],null);
}

function spawnInitial(){
  resize();
  // ── 從 taxi_config.js 的 initial_aircraft 讀取初始場景 ──
  TAXI_CONFIG.initial_aircraft.forEach(cfg => {
    const gate = GATES[cfg.gate];
    if(!gate){ console.warn('spawnInitial: 找不到機位', cfg.gate); return; }
    const ac = makeAC({
      callsign:    cfg.callsign,
      airline:     cfg.airline,
      type:        cfg.type,
      cat:         cfg.cat,
      gate:        cfg.gate,
      gx:          gate.x,
      gy:          gate.y,
      destination: cfg.destination,
      depTime:     cfg.dep_time,
      fl:          cfg.fl,
    });
    ac.waitTimer = cfg.wait_timer ?? 10;
    ACs[ac.id] = ac;
  });
  updateRunwayLights();
  updateUI();
}

// ══════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════
spawnInitial();
broadcastATIS();
function loop(ts){
  const dt=(ts-lastT)/1000; lastT=ts;
  if(dt>0&&dt<0.5){update(dt*GAME_SPEED);}
  render();
  // Update wind/lights and clock every second, not every frame
  const sec=Math.floor(gTime);
  if(sec!==loop._lastSec){
    loop._lastSec=sec;
    updateClock();
    if(sec%5===0){drawWindIndicator(); updateRunwayLights();}
  }
  requestAnimationFrame(loop);
}
loop._lastSec=-1;
requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
