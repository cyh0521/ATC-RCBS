    case 'WAIT_CLR':     return `停機 ${ac.gate} — 等許可`;
    case 'WAIT_PBK':     return `停機 ${ac.gate} — 等後推`;
    case 'WAIT_RWY':     return `滑行道 — 選擇跑道`;
    case 'TAXIING':      return `TWY N → ${ac.assignedRwy==='06'?'H-D':'H-A'}`;
    case 'TAXIING_TO_RWY': return `進入跑道 ${ac.assignedRwy}`;
    case 'WAIT_ENTRY':   return `${ac.assignedRwy==='06'?'H-D':'H-A'} 跑道入口`;
    case 'AT_ENTRY':     return `${ac.assignedRwy==='06'?'H-D':'H-A'} 入口等待`;
    case 'WAIT_LINEUP':  return `RWY ${ac.assignedRwy} 跑道內等待`;
    case 'TAKEOFF_ROLL': return `RWY ${ac.assignedRwy} 起飛滾行 ↑`;
    case 'AIRBORNE_CLIMB': return `爬升中 ${Math.round(ac.altitude)}ft`;
    case 'HANDED_OFF':   return `離場 ${Math.round(ac.altitude)}ft`;
    case 'INBOUND':      return `進場中 ${Math.round(ac.altitude)}ft`;
    case 'SEQUENCING':   return `引導排序 ${Math.round(ac.altitude)}ft`;
    case 'FINAL_APPROACH':return `ILS RWY${ac.assignedRwy||'06'} 最終進場`;
    case 'LANDED':       return `落地滑行 RWY${ac.assignedRwy||'06'}`;
    default: return s;
  }
}
function posClass(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY'].includes(s)) return 'gnd';
  if(['WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s)) return 'rwy';
  if(s==='FINAL_APPROACH') return 'app';
  return 'air';
}
function badgeCls(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY'].includes(s)) return 'b-gnd';
  if(['WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s)) return 'b-rwy';
  if(s==='FINAL_APPROACH') return 'b-app';
  return 'b-air';
}
function badgeTxt(ac){
  const s=ac.cmdStep;
  const m={
    WAIT_REQ:'停機',WAIT_CLR:'等許可',WAIT_PBK:'等後推',WAIT_RWY:'選跑道',
    TAXIING:'滑行',TAXIING_TO_RWY:'進跑道',WAIT_ENTRY:'入口',AT_ENTRY:'入口等',
    WAIT_LINEUP:'跑道等',TAKEOFF_ROLL:'起飛',
    AIRBORNE_CLIMB:'爬升',HANDED_OFF:'離場',
    INBOUND:'進場',SEQUENCING:'排序',FINAL_APPROACH:'ILS進場',
    LANDED:'落地'
  };
  return m[s]||s;
}
function isGnd(s){
  return['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY',
         'WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s);
}

function updateUI(){
  updateClock();

  // ── 中間欄：選中航班詳情 ──
  const ac=sel?ACs[sel]:null;

    const airInfo=!gnd
      ?`<div class="ac-row">高度 <span>${Math.round(ac.altitude/100)*100}ft</span> &nbsp; 速度 <span>${Math.round(ac.aSpd)}kt</span></div>`
      :'';

      ?`<div class="ac-row">機坪 <span>${ac.gate||'—'}</span>${ac.assignedRwy?` &nbsp; 跑道 <span>RWY ${ac.assignedRwy}</span>`:''}</div>`
      :'';
    infoText.innerHTML=`
      <div id="ac-cs-big">${ac.callsign}</div>
      <div id="ac-airline-lbl">${ac.airline} &nbsp;<span style="color:var(--t3);font-family:var(--mono);font-size:10px">${ac.type}</span></div>
      <div class="ac-row">${gnd?`目的地 <span>${ac.destination}</span>`:`來自 <span>${ac.origin}</span>`}</div>
      ${airInfo}${gndInfo}`;
  } else if(imgBox && infoText){
    imgBox.innerHTML='<div id="ac-img-placeholder">— 點選航機 —</div>';
    infoText.innerHTML='<div id="ac-empty-msg">選擇左側或右側<br>管制條以顯示詳情</div>';
  }

  rebuildCmds(ac);
  rebuildStrips();
  updateChannels();
}

// Update ATC channel callsign displays
function updateChannels(){
  const twrActive = Object.values(ACs).some(a=>{
    const s=a.cmdStep;
    return['INBOUND','SEQUENCING','FINAL_APPROACH','WAIT_ENTRY','AT_ENTRY',
           'WAIT_LINEUP','TAKEOFF_ROLL','LANDED','AIRBORNE_CLIMB','HANDED_OFF'].includes(s);
  });
  const gndActive = Object.values(ACs).some(a=>{
    const s=a.cmdStep;
    return['WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY','WAIT_REQ'].includes(s);
  });
  const bTwr=document.getElementById('badge-twr');
  const bGnd=document.getElementById('badge-gnd');
  if(bTwr) bTwr.classList.toggle('on',twrActive);
  if(bGnd) bGnd.classList.toggle('on',gndActive);
}

function rebuildCmds(ac){
  const btns=document.getElementById('cmd-btns');
  if(!btns) return;
  if(ac){
    const cmds=getCmds(ac);
    btns.innerHTML='';
    if(!cmds.length){
      btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 等待指示 —</span>';
      return;
    }
    cmds.forEach(cmd=>{
      const b=document.createElement('button');
      b.className='cb seat-'+(cmd.seat||'GND');
      const seatCls={DEL:'DEL',GND:'GND',TWR:'TWR',APP:'APP'}[cmd.seat]||'GND';
      b.innerHTML=`<span class="cb-seat-lbl ${seatCls}">[${cmd.seat}]</span>${cmd.l}`;
      b.dataset.action=cmd.a;
      b.dataset.acid=ac.id;
      if(cmd.rwy){
        b.addEventListener('mouseenter',()=>{ ac.previewRwy=cmd.rwy; });
        b.addEventListener('mouseleave',()=>{ ac.previewRwy=null; });
      }
      btns.appendChild(b);
    });
  } else {
    btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 點選航機後顯示指令 —</span>';
  }
}

function rebuildStrips(){
  const sdep=document.getElementById('sdep');
  const sarr=document.getElementById('sarr');
  if(!sdep||!sarr) return;

  sdep.innerHTML=''; sarr.innerHTML='';

  const DEP=['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY',
             'WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','AIRBORNE_CLIMB','HANDED_OFF'];
  const ARR=['INBOUND','SEQUENCING','FINAL_APPROACH','LANDED'];
  let dc=0, ac2=0;
  let firstDep=null, firstArr=null;

  // If selected AC no longer exists, clear selection
  if(sel && !ACs[sel]){
    // Try to find another AC to select
    const remaining=Object.values(ACs);
    sel = remaining.length ? remaining[0].id : null;
  }

  Object.values(ACs).forEach(a=>{
    const isDep=DEP.includes(a.cmdStep);
    const isArr=ARR.includes(a.cmdStep);
    if(!isDep&&!isArr) return;

    const isSel=a.id===sel;
    if(isDep){ dc++; if(!firstDep) firstDep=a.id; }
    else      { ac2++; if(!firstArr) firstArr=a.id; }

    const div=document.createElement('div');
    div.className=`fs ${isDep?'dep':'arr'}${isSel?' sel':''}${a.reqFlash?' req-flash':''}`;
    div.dataset.acid=a.id;

    const destIcao=AIRPORT_ICAO[a.destination]||a.destination;
    const origIcao=AIRPORT_ICAO[a.origin]||a.origin;
    const routeTxt=isDep
      ?`→ ${a.destination} <span style="color:var(--t2);font-size:9px">${destIcao}</span>`
      :`← ${a.origin} <span style="color:var(--t2);font-size:9px">${origIcao}</span>`;

    div.innerHTML=`
      <div class="fs-top">
        <span class="fs-cs">${a.callsign}</span>
        ${a.reqFlash?'<span class="req-tag">REQ</span>':''}
      </div>
      <div class="fs-bot">
        <span class="fs-ty">${a.type}</span>
        <span class="fs-route">${routeTxt}</span>
        <span class="fs-pos ${posClass(a)}">${posText(a)}</span>
      </div>`;

    (isDep?sdep:sarr).appendChild(div);
  });

  document.getElementById('cnt-dep').textContent=dc;
  document.getElementById('cnt-arr').textContent=ac2;
}

// SPAWN
// ══════════════════════════════════════
function broadcastATIS(){
  const atisMsg=`金門機場情報資訊甲，跑道使用中06，地面風050度12節，能見度10公里，晴天，QNH 1013，進場ILS跑道06，離場程序CUBON 1A，情報甲`;
  qC([{seat:'ATIS',cs:'ATIS',msg:atisMsg,type:'atc'}],null);
}

function spawnInitial(){
  resize();

  // ── 離場：立榮 B78642 ──
  const a1=makeAC({
    callsign:'B78642', airline:'立榮航空', type:'ATR 72-600', cat:'COM',
    gate:'N2', gx:GATES_COM[1].x, gy:GATES_COM[1].y,
    destination:'松山', depTime:'08:10', fl:180,
  });
  a1.waitTimer=10;
  ACs[a1.id]=a1;

  // ── 離場：空軍 Air Force 1352 ──
  const a2=makeAC({
    callsign:'Air Force 1352', airline:'中華民國空軍', type:'C-130H', cat:'MIL',
    gate:'M1', gx:GATES_MIL[0].x, gy:GATES_MIL[0].y,
    destination:'屏東', depTime:'08:25', fl:200,
  });
  a2.waitTimer=4;
  ACs[a2.id]=a2;

  // ── 進場：立榮 B71234 — 由SANDY進入 ILS RWY06 ──
  const a3=makeAC({
    callsign:'B71234', airline:'立榮航空', type:'ATR 72-600', cat:'COM',
    gate:'N3', origin:'松山', arrTime:'08:20',
  });
  a3.cmdStep='INBOUND'; a3.assignedRwy='06';
  // 生成在 SANDY 東方 2NM 處，朝 SPICA 方向（約 283°）
  a3.ax=WPT.SANDY.x+2.0; a3.ay=WPT.SANDY.y-0.5;
  a3.aHdg=283; a3.aSpd=200;
  a3.altitude=4000; a3.targetAlt=4000; a3.targetHdg=283;
  // 指派 ILS-SANDY-06 航路，從 SANDY 點開始
  a3.airRoute=[...ARR_ROUTES['ILS-SANDY-06']];
  a3.airRouteIdx=0; a3.holdRwyHdg=false;
  a3.waitTimer=0; a3.pilotCalled=false;
  ACs[a3.id]=a3;

  // ── 進場：華信 AE1024 — 由CUBON進入 CUBON 1C → ILS RWY06 ──
  const a4=makeAC({
    callsign:'AE1024', airline:'華信航空', type:'ATR 72-600', cat:'COM',
    gate:'N5', origin:'臺中', arrTime:'08:35',
  });
  a4.cmdStep='INBOUND'; a4.assignedRwy='06';
  // 生成在 CUBON 附近，朝 SPICA 方向（CUBON 1C 初始航跡 304°）
  a4.ax=WPT.CUBON.x+2.2; a4.ay=WPT.CUBON.y-1.8;
  a4.aHdg=304; a4.aSpd=220;
  a4.altitude=8000; a4.targetAlt=8000; a4.targetHdg=304;
  // 指派 CUBON-1C-06 航路
  a4.airRoute=[...ARR_ROUTES['CUBON-1C-06']];
  a4.airRouteIdx=0; a4.holdRwyHdg=false;
  a4.waitTimer=0; a4.pilotCalled=false;
  ACs[a4.id]=a4;

  updateRunwayLights();
  updateUI();
}

// ══════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════
spawnInitial();
broadcastATIS();
function loop(ts){
  const dt=(ts-lastT)/1000; lastT=ts;
  if(dt>0&&dt<0.5){update(dt*GAME_SPEED);}
  render();
  // Update wind/lights and clock every second, not every frame
  const sec=Math.floor(gTime);
  if(sec!==loop._lastSec){
    loop._lastSec=sec;
    updateClock();
    if(sec%5===0){drawWindIndicator(); updateRunwayLights();}
  }
  requestAnimationFrame(loop);
}
loop._lastSec=-1;
requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
</script>
