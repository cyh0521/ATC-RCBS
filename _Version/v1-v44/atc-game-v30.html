    AIRBORNE:(cs)=>
      `${cs}，離地，繼續爬升，聯繫高雄進近124.6，再見`,
    VACATE:(cs,twy)=>
      `${cs}，脫離跑道後，聯繫地面126.2，使用${twy}`,
  },
  APP:{
    CONTACT:(cs,alt,hdg)=>
      `${cs}，高雄進近，雷達識別，下降並維持${alt}呎，航向${hdg}度`,
    CONTACT_RB:(cs,alt,hdg)=>
      `下降並維持${alt}呎，航向${hdg}，${cs}`,
    SEQ:(cs,type,dist)=>
      `${cs}，前方${type}，間距${dist}浬，保持現在速度`,
    ILS:(cs,rwy,alt)=>
      `${cs}，許可ILS進場，跑道${rwy}，下降至${alt}呎，報告建立航道`,
    ILS_RB:(cs,rwy)=>
      `許可ILS進場，跑道${rwy}，${cs}，建立航道後報告`,
    VECTOR:(cs,hdg,reason)=>
      `${cs}，雷達引導，航向${hdg}度，${reason}`,
  },
  AC:{
    WILCO:(msg)=>`${msg}`,
    READY:(cs,rwy)=>`管制，${cs}，在跑道${rwy}，等候起飛`,
    REQ_CLR:(cs,gate,dest,fl)=>
      `金門地面，${cs}，${gate}機坪，請求出發許可，目的地${dest}，申請飛行高度層${fl}`,
  },
};
const W_=()=>String(wind.dir).padStart(3,'0')+'°/'+wind.spd+'KT';
const SQ=()=>Math.floor(Math.random()*6000+1000).toString();

// ══════════════════════════════════════
// COMMANDS
// ══════════════════════════════════════
function getCmds(ac){
  if(!ac) return [];
  switch(ac.cmdStep){
    case 'WAIT_REQ':   return [];
    case 'WAIT_CLR':   return [{l:'出發許可 CLR',a:'CLR',seat:'GND'}];
    case 'WAIT_PBK':   return [
      {l:'後推 PBK',a:'PBK',seat:'GND'},
    ];
    case 'WAIT_RWY':   return [
      {l:'跑道 06',a:'RWY06',seat:'GND',rwy:'06'},
      {l:'跑道 24',a:'RWY24',seat:'GND',rwy:'24'},
      {l:'取消',   a:'CANCEL_RWY',seat:'GND'},
    ];
    case 'TAXIING':    return [{l:'停止 HLD',a:'HLD',seat:'GND'}];
    // ── 三選項：入口外等待、入口等待（跑道外）、進跑道等待 ──
    case 'WAIT_ENTRY': return [
      {l:'許可起飛 T/O',  a:'TOF',        seat:'TWR'},
      {l:'入口等待 EWY',  a:'HOLD_ENTRY', seat:'TWR'},
      {l:'進跑道等待 LUP',a:'LUP',        seat:'TWR'},
    ];
    // 入口等待後：保留三個選項（玩家仍可隨時下其他指令）
    case 'AT_ENTRY': return [
      {l:'許可起飛 T/O',  a:'TOF',        seat:'TWR'},
      {l:'入口等待 EWY',  a:'HOLD_ENTRY', seat:'TWR'},
      {l:'進跑道等待 LUP',a:'LUP',        seat:'TWR'},
    ];
    // 跑道內等待後：僅保留許可起飛
    case 'WAIT_LINEUP': return [{l:'許可起飛 T/O',a:'TOF',seat:'TWR'}];
    case 'AIRBORNE_CLIMB': return ac.handoffPending?[{l:'移轉離場 DEP→',a:'HANDOFF',seat:'TWR'}]:[];
    // ── 進場指令 ──
    case 'INBOUND':    return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:'TWR'},
      {l:'ILS許可 RWY24',a:'ILS24',seat:'TWR'},
      {l:'向量引導',      a:'VEC',  seat:'TWR'},
    ];
    case 'SEQUENCING': return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:'TWR'},
      {l:'ILS許可 RWY24',a:'ILS24',seat:'TWR'},
      {l:'向量引導',      a:'VEC',  seat:'TWR'},
    ];
    case 'FINAL_APPROACH':
      // 未下降落許可：顯示降落許可與重飛
      if(!ac.landingCleared) return [
        {l:'降落許可',a:'LND',seat:'TWR'},
        {l:'重飛',    a:'GAR',seat:'TWR'},
      ];
      // 已下降落許可：只剩重飛
      return [{l:'重飛',a:'GAR',seat:'TWR'}];
    default: return [];
  }
}

function execCmd(ac,a){
  const cs=ac.callsign;

  switch(a){
    case 'CLR': {
      // SID 依確認跑道決定（若跑道未選，預設 RWY06）
      const rwy = ac.assignedRwy || '06';
      const sidName = rwy==='24' ? 'CUBON 1B' : 'CUBON 1A';
      ac.sid = sidName;
      ac.airRoute = SID_ROUTES[sidName] ? [...SID_ROUTES[sidName]] : [];
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = true;
      const sq=SQ();
      qC([
        {seat:'GND',cs,msg:PHR.DEL.CLEARANCE(cs,ac.destination,ac.fl,sidName,sq),type:'atc'},
        {seat:'AC', cs,msg:PHR.DEL.READBACK(cs,ac.destination,ac.fl,sidName,sq),type:'ac'},
      ],()=>{ ac.cmdStep='WAIT_PBK'; ac.reqFlash=true; updateUI(); });
      ac.reqFlash=false;
      break;
    }

    case 'PBK':
      // 先靜默進入跑道選擇狀態，不發通話；跑道選定後一併發出後推+滑行指令
      ac.cmdStep='WAIT_RWY';
      ac.reqFlash=true;
      updateUI();
      break;

    case 'RWY06':
    case 'RWY24': {
      const rwy=a==='RWY06'?'06':'24';
      ac.assignedRwy=rwy;
      ac.reqFlash=false;
      const holdPt=rwy==='06'?HOLD_06:HOLD_24;
      const face=rwy==='06'?'東':'西';
      // 一次發出後推+滑行指令（合併為真實程序）
      qC([
        {seat:'GND',cs,msg:PHR.GND.PUSHBACK(cs,ac.gate,face),type:'atc'},
        {seat:'AC', cs,msg:PHR.GND.PUSHBACK_READBACK(cs,ac.gate),type:'ac'},
        {seat:'GND',cs,msg:PHR.GND.TAXI(cs,'TWY N',holdPt.label,rwy),type:'atc'},
        {seat:'AC', cs,msg:PHR.GND.TAXI_READBACK(cs,'TWY N',holdPt.label,rwy),type:'ac'},
      ],()=>{ ac.cmdStep='TAXIING'; updateUI(); });
      // 立即開始後推動畫
      ac.taxiRoute=buildTaxiRoute(ac, holdPt);
      ac.taxiIdx=0; ac.gSpd=5;
      ac.cmdStep='TAXIING';
      break;
    }

    case 'CANCEL_RWY':
      // 取消，回到後推待命狀態
      ac.cmdStep='WAIT_PBK';
      ac.reqFlash=false;
      updateUI();
      break;

    case 'HLD':
      ac.taxiIdx=ac.taxiRoute.length; // 停在原地
      setMsg(cs+' 停止');
      break;

    case 'HOLD_ENTRY':
      // 入口等待：停在入口外，保持三個選項（AT_ENTRY 狀態）
      qC([
        {seat:'TWR',cs,msg:`${cs}，跑道${ac.assignedRwy}入口等待`,type:'atc'},
        {seat:'AC', cs,msg:`入口等待，跑道${ac.assignedRwy}，${cs}`,type:'ac'},
      ],()=>{ ac.cmdStep='AT_ENTRY'; updateUI(); });
      setMsg(cs+' 入口等待');
      break;

    case 'LUP': {
      const rwy=ac.assignedRwy||'06';
      const rwyX=rwy==='06'?50:RWY_LEN-50;
      const rwyHdg=rwy==='06'?90:270;
      // Issue lineup clearance immediately
      qC([
        {seat:'TWR',cs,msg:PHR.TWR.LINEUP(cs,rwy),type:'atc'},
        {seat:'AC', cs,msg:PHR.TWR.LINEUP_RB(cs,rwy),type:'ac'},
      ],()=>{
        // Start taxi to runway after readback
        ac.taxiRoute=[{x:rwyX,y:0}];
        ac.taxiIdx=0; ac.gSpd=5;
        ac.cmdStep='TAXIING_TO_RWY';
        updateUI();
        const checkInterval=setInterval(()=>{
          if(ac.taxiIdx>=ac.taxiRoute.length){
            clearInterval(checkInterval);
            ac.gHdg=rwyHdg;
            ac.onRwy=true; ac.rwyRollDist=0;
            ac.cmdStep='WAIT_LINEUP';
            ac.waitTimer=0; ac.pilotCalled2=false;
            updateUI();
          }
        },200);
      });
      setMsg(cs+' 進跑道等待');
      break;
    }

    case 'TOF': {
      const rwy=ac.assignedRwy||'06';
      const rwyX=rwy==='06'?50:RWY_LEN-50;
      const rwyHdg=rwy==='06'?90:270;
      // Issue comms immediately (while aircraft taxis to threshold)
      qC([
        {seat:'TWR',cs,msg:PHR.TWR.TAKEOFF(cs,rwy,W_()),type:'atc'},
        {seat:'AC', cs,msg:PHR.TWR.TAKEOFF_RB(cs,rwy),type:'ac'},
      ],null);
      // Set up taxi to runway threshold (visible animation)
      ac.taxiRoute=[{x:rwyX,y:0}];
      ac.taxiIdx=0; ac.gSpd=7;
      ac.cmdStep='TAXIING_TO_RWY';
      ac.reqFlash=false;
      // Poll until aircraft reaches threshold, then start roll
      const checkTOF=setInterval(()=>{
        if(ac.taxiIdx>=ac.taxiRoute.length){
          clearInterval(checkTOF);
          ac.gx=rwyX; ac.gy=0; ac.gHdg=rwyHdg;
          ac.onRwy=true; ac.rwyRollDist=0; ac.gSpd=0;
          ac.taxiRoute=[]; ac.taxiIdx=0;
          ac.cmdStep='TAKEOFF_ROLL';
          updateUI();
        }
      },100);
      break;
    }

    case 'HANDOFF':
      qC([
        {seat:'TWR',cs,msg:`${cs}，聯繫高雄進近124.6，再見`,type:'atc'},
        {seat:'AC', cs,msg:PHR.AC.WILCO(`高雄進近124.6，${cs}，再見`),type:'ac'},
      ],()=>{
        ac.cmdStep='HANDED_OFF';
        ac.handoffPending=false;
        ac.reqFlash=false;
        updateUI();
      });
      setMsg(cs+' 已移轉高雄進近 124.6');
      break;

    // ── 進場指令 ──
    case 'D4K':
      qC([{seat:'TWR',cs,msg:PHR.APP.CONTACT(cs,'4000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'4000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=4000; ac.cmdStep='SEQUENCING';}); break;
    case 'D2K':
      qC([{seat:'TWR',cs,msg:PHR.APP.CONTACT(cs,'2000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'2000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=2000; ac.cmdStep='SEQUENCING';}); break;
    case 'ILS06':
    case 'ILS24':
    case 'ILS': {
      const ilsRwy = a==='ILS24' ? '24' : '06';
      ac.assignedRwy = ilsRwy;

      // 選擇進場路線：依飛機目前位置選最近 IAF
      let routeKey;
      if(ilsRwy==='06'){
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-1C-06' : 'ILS-SANDY-06';
      } else {
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-2D-24' : 'ILS-AMTIK-24';
      }

      // 從距飛機最近的剩餘航點開始（跳過已通過的點）
      const fullRoute = [...(ARR_ROUTES[routeKey] || [])];
      let startIdx = 0, minDist = Infinity;
      fullRoute.forEach((wpt,i)=>{
        if(wpt.isTHR) return;
        const d = Math.sqrt((ac.ax-wpt.x)**2+(ac.ay-wpt.y)**2);
        if(d < minDist){ minDist=d; startIdx=i; }
      });
      ac.airRoute = fullRoute.slice(startIdx);
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = false;

      qC([{seat:'TWR',cs,msg:PHR.APP.ILS(cs,ilsRwy,'2000'),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.ILS_RB(cs,ilsRwy),type:'ac'}],
        ()=>{
          ac.cmdStep='FINAL_APPROACH';
          ac.clearedILS=true;
          ac.aSpd=155;
          updateUI();
        });
      break;
    }
    case 'LND':
      ac.landingCleared=true;
      qC([{seat:'TWR',cs,msg:PHR.TWR.LAND(cs,ac.assignedRwy||'06',W_()),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.LAND_RB(cs,ac.assignedRwy||'06'),type:'ac'}],
        ()=>{ updateUI(); }); break;
    case 'GAR':
      qC([{seat:'TWR',cs,msg:PHR.TWR.GOAROUND(cs),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.GOAROUND_RB(cs),type:'ac'}],
        ()=>{ac.cmdStep='SEQUENCING';ac.clearedILS=false;ac.targetAlt=3000;ac.aSpd=200;}); break;
    case 'VEC': {
      const nh=Math.round((ac.aHdg+30)%360);
      qC([{seat:'TWR',cs,msg:PHR.APP.VECTOR(cs,nh,'排序間距'),type:'atc'},
          {seat:'AC', cs,msg:PHR.AC.WILCO(`航向${nh}，${cs}`),type:'ac'}],
        ()=>{ac.targetHdg=nh; ac.airRoute=[]; ac.airRouteIdx=0;}); break;
    }
  }
  updateUI();
}

// 建立滑行路線：後推退到TWY N → 沿N平行道 → 直角轉入連接道 → 等待點
function buildTaxiRoute(ac, holdPt){
  const pushY=TWY_Y;
  return [
    {x:ac.gx,    y:pushY,     isPushback:true}, // ①後推退至TWY N（機頭不轉）
    {x:holdPt.x, y:TWY_Y                      }, // ②沿TWY N東/西滑行到連接道口（直角轉彎）
    {x:holdPt.x, y:holdPt.y                   }, // ③沿連接道南進至等待點（再直角轉彎）
  ];
}

// 滑行道預覽路線（用於懸停顯示）
function getTaxiPreview(ac, rwy){
  const holdPt=rwy==='06'?HOLD_06:HOLD_24;
  return buildTaxiRoute(ac, holdPt);
}

// ══════════════════════════════════════
// TYPEWRITER COMMS
// ══════════════════════════════════════
function qC(lines,onDone){
  twQueue.push({lines,onDone,idx:0});
  if(!twTimer) processQueue();
}
function processQueue(){
  twTimer=null;
  if(!twQueue.length) return;
  const job=twQueue[0];
  if(job.idx>=job.lines.length){
    twQueue.shift();
    if(job.onDone) setTimeout(job.onDone, 150);
    twTimer=setTimeout(processQueue, 60);
    return;
  }
  const e=job.lines[job.idx++];
  // Aircraft readback gets a realistic delay; ATC messages play immediately
  const delay = e.type==='ac' ? REPLY_DELAY : 0;
  twTimer=setTimeout(()=>{
    // typeLine calls onDone when typewriter finishes → triggers next processQueue
    typeLine(e, ()=>{ twTimer=setTimeout(processQueue, 80); });
  }, delay);
}
// Track which channel the last ATC message used
let lastAtcSeatKey = null;
let activeTypingEl = null; // currently typing message element — prevents visual overlap

function typeLine(entry,onDone){
  const{seat,cs,msg,type}=entry;
  cLog.unshift({seat,msg,type,t:gTime});
  if(cLog.length>100)cLog.pop();

  // Determine badge class, label, message class
  let badgeCls, badgeLabel, msgCls;
  if(seat==='TWR'||seat==='APP'){
    badgeCls='twr'; badgeLabel='TWR'; msgCls='twr-txt';
    lastAtcSeatKey='twr';
  } else if(seat==='GND'||seat==='DEL'){
    badgeCls='gnd'; badgeLabel='GND'; msgCls='gnd-txt';
    lastAtcSeatKey='gnd';
  } else if(seat==='ATIS'){
    badgeCls='atis'; badgeLabel='ATIS'; msgCls='atis-txt';
    lastAtcSeatKey='atis';
  } else {
    // All aircraft use A/C label regardless of callsign
    badgeCls='ac'; badgeLabel='A/C'; msgCls='ac-txt';
  }

  const log=document.getElementById('ch-log');
  if(log){
    // Build the new row
    const row=document.createElement('div');
    row.className='ch-entry new-entry';

    const badgeWrap=document.createElement('div');
    badgeWrap.className='ch-entry-badge';
    const sq=document.createElement('span');
    sq.className='ch-badge-sq '+badgeCls;
    sq.textContent=badgeLabel;
    badgeWrap.appendChild(sq);

    const msgEl=document.createElement('span');
    msgEl.className='ch-entry-msg '+msgCls;

    row.appendChild(badgeWrap);
    row.appendChild(msgEl);

    // Insert at top
    log.insertBefore(row, log.firstChild);
    // Trim to max 30 entries
    while(log.children.length>30) log.removeChild(log.lastChild);

    // Mark this as the active typing element
    activeTypingEl=msgEl;

    // Typewriter — character by character
    let i2=0; const chars2=[...msg];
    function tick2(){
      if(i2<chars2.length){
        msgEl.textContent+=chars2[i2++];
        setTimeout(tick2, TW_SPD);
      } else {
        activeTypingEl=null;
        if(onDone) onDone();
      }
    }
    tick2();
    return;
  }
  if(onDone) onDone();
}
function fSeat(s){ cFilt=s; }

// ══════════════════════════════════════
// CANVAS CLICK
// ══════════════════════════════════════
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let found=null, bestDist=999;
  Object.values(ACs).forEach(ac=>{
    let px,py;
    if(isGnd(ac.cmdStep)){
      const pos=getACPos(ac); px=pos.px; py=pos.py;
    } else {
      // Air AC drawn on ground view via nm2gCanvas
      const p=nm2gCanvas(ac.ax,ac.ay); px=p.x; py=p.y;
    }
    const d=Math.sqrt((mx-px)**2+(my-py)**2);
    if(d<30 && d<bestDist){ bestDist=d; found=ac; }
  });
  sel = found ? found.id : null;
  updateUI();
});

function selectStrip(id){

// ══════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════
function posText(ac){
  const s=ac.cmdStep;
  switch(s){
    case 'WAIT_REQ':     return `停機 ${ac.gate} ⏳`;
    case 'WAIT_CLR':     return `停機 ${ac.gate} — 等許可`;
    case 'WAIT_PBK':     return `停機 ${ac.gate} — 等後推`;
    case 'WAIT_RWY':     return `滑行道 — 選擇跑道`;
    case 'TAXIING':      return `TWY N → ${ac.assignedRwy==='06'?'H-D':'H-A'}`;
    case 'TAXIING_TO_RWY': return `進入跑道 ${ac.assignedRwy}`;
    case 'WAIT_ENTRY':   return `${ac.assignedRwy==='06'?'H-D':'H-A'} 跑道入口`;
    case 'AT_ENTRY':     return `${ac.assignedRwy==='06'?'H-D':'H-A'} 入口等待`;
    case 'WAIT_LINEUP':  return `RWY ${ac.assignedRwy} 跑道內等待`;
    case 'TAKEOFF_ROLL': return `RWY ${ac.assignedRwy} 起飛滾行 ↑`;
    case 'AIRBORNE_CLIMB': return `爬升中 ${Math.round(ac.altitude)}ft`;
    case 'HANDED_OFF':   return `離場 ${Math.round(ac.altitude)}ft`;
    case 'INBOUND':      return `進場中 ${Math.round(ac.altitude)}ft`;
    case 'SEQUENCING':   return `引導排序 ${Math.round(ac.altitude)}ft`;
    case 'FINAL_APPROACH':return `ILS RWY${ac.assignedRwy||'06'} 最終進場`;
    case 'LANDED':       return `落地滑行 RWY${ac.assignedRwy||'06'}`;
    default: return s;
  }
}
function posClass(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY'].includes(s)) return 'gnd';
  if(['WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s)) return 'rwy';
  if(s==='FINAL_APPROACH') return 'app';
  return 'air';
}
function badgeCls(ac){
  const s=ac.cmdStep;
  if(['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY'].includes(s)) return 'b-gnd';
  if(['WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s)) return 'b-rwy';
  if(s==='FINAL_APPROACH') return 'b-app';
  return 'b-air';
}
function badgeTxt(ac){
  const s=ac.cmdStep;
  const m={
    WAIT_REQ:'停機',WAIT_CLR:'等許可',WAIT_PBK:'等後推',WAIT_RWY:'選跑道',
    TAXIING:'滑行',TAXIING_TO_RWY:'進跑道',WAIT_ENTRY:'入口',AT_ENTRY:'入口等',
    WAIT_LINEUP:'跑道等',TAKEOFF_ROLL:'起飛',
    AIRBORNE_CLIMB:'爬升',HANDED_OFF:'離場',
    INBOUND:'進場',SEQUENCING:'排序',FINAL_APPROACH:'ILS進場',
    LANDED:'落地'
  };
  return m[s]||s;
}
function isGnd(s){
  return['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY',
         'WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','LANDED'].includes(s);
}
function setMsg(t){ /* status bar removed in v24 */ }
function setView(v){ view=v; } // kept for compatibility; both canvases always render

// AC image path
function acImgSrc(airline,type){
  const al_code=airline==='立榮航空'?'B7':airline==='華信航空'?'AE':airline==='中華民國空軍'?'ROCAF':'XX';
  const ty=type.replace(/[\s\-]/g,'').replace('/','');
  return `/image/${al_code}-${ty}.jpg`;
}

// ══════════════════════════════════════
// UI UPDATE
// ══════════════════════════════════════
function updateClock(){
  const t=gTime;
  const h=Math.floor(t/3600)%24, m=Math.floor((t%3600)/60), s=Math.floor(t%60);
  const str=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el=document.getElementById('clock-sm');
  if(el) el.textContent=str;
}

function updateUI(){
  updateClock();

  // ── 中間欄：選中航班詳情 ──
  const ac=sel?ACs[sel]:null;

  const imgBox=document.getElementById('ac-img-box');
  const infoText=document.getElementById('ac-info-text');

  if(ac && imgBox && infoText){
    const gnd=isGnd(ac.cmdStep);
    const imgSrc=acImgSrc(ac.airline,ac.type);
    imgBox.innerHTML=`<img src="${imgSrc}" alt="${ac.type}"
      onerror="this.parentElement.innerHTML='<div id=\\"ac-img-placeholder\\">${ac.type}</div>'">`;
    // Air: show alt+spd, hide gate/rwy. Ground: show gate/rwy, hide alt+spd
    const airInfo=!gnd
      ?`<div class="ac-row">高度 <span>${Math.round(ac.altitude/100)*100}ft</span> &nbsp; 速度 <span>${Math.round(ac.aSpd)}kt</span> &nbsp; 航向 <span>${String(Math.round(ac.aHdg)%360).padStart(3,'0')}°</span></div>`
      :'';
    const gndInfo=gnd
      ?`<div class="ac-row">機坪 <span>${ac.gate||'—'}</span>${ac.assignedRwy?` &nbsp; 跑道 <span>RWY ${ac.assignedRwy}</span>`:''}</div>`
      :'';
    infoText.innerHTML=`
      <div id="ac-cs-big">${ac.callsign}</div>
      <div id="ac-airline-lbl">${ac.airline} &nbsp;<span style="color:var(--t3);font-family:var(--mono);font-size:10px">${ac.type}</span></div>
      <div class="ac-row">${gnd?`目的地 <span>${ac.destination}</span>`:`來自 <span>${ac.origin}</span>`}</div>
      ${airInfo}${gndInfo}`;
  } else if(imgBox && infoText){
    imgBox.innerHTML='<div id="ac-img-placeholder">— 點選航機 —</div>';
    infoText.innerHTML='<div id="ac-empty-msg">選擇左側或右側<br>管制條以顯示詳情</div>';
  }

  rebuildCmds(ac);
  rebuildStrips();
  updateChannels();
}

// Update ATC channel callsign displays
function updateChannels(){
  const twrActive = Object.values(ACs).some(a=>{
    const s=a.cmdStep;
    return['INBOUND','SEQUENCING','FINAL_APPROACH','WAIT_ENTRY','AT_ENTRY',
           'WAIT_LINEUP','TAKEOFF_ROLL','LANDED','AIRBORNE_CLIMB','HANDED_OFF'].includes(s);
  });
  const gndActive = Object.values(ACs).some(a=>{
    const s=a.cmdStep;
    return['WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY','WAIT_REQ'].includes(s);
  });
  const bTwr=document.getElementById('badge-twr');
  const bGnd=document.getElementById('badge-gnd');
  if(bTwr) bTwr.classList.toggle('on',twrActive);
  if(bGnd) bGnd.classList.toggle('on',gndActive);
}

function rebuildCmds(ac){
  const btns=document.getElementById('cmd-btns');
  if(!btns) return;
  if(ac){
    const cmds=getCmds(ac);
    btns.innerHTML='';
    if(!cmds.length){
      btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 等待指示 —</span>';
      return;
    }
    cmds.forEach(cmd=>{
      const b=document.createElement('button');
      b.className='cb seat-'+(cmd.seat||'GND');
      const seatCls={DEL:'DEL',GND:'GND',TWR:'TWR',APP:'APP'}[cmd.seat]||'GND';
      b.innerHTML=`<span class="cb-seat-lbl ${seatCls}">[${cmd.seat}]</span>${cmd.l}`;
      b.dataset.action=cmd.a;
      b.dataset.acid=ac.id;
      if(cmd.rwy){
        b.addEventListener('mouseenter',()=>{ ac.previewRwy=cmd.rwy; });
        b.addEventListener('mouseleave',()=>{ ac.previewRwy=null; });
      }
      btns.appendChild(b);
    });
  } else {
    btns.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--mono)">— 點選航機後顯示指令 —</span>';
  }
}

function rebuildStrips(){
  const sdep=document.getElementById('sdep');
  const sarr=document.getElementById('sarr');
  if(!sdep||!sarr) return;

  sdep.innerHTML=''; sarr.innerHTML='';

  const DEP=['WAIT_REQ','WAIT_CLR','WAIT_PBK','WAIT_RWY','TAXIING','TAXIING_TO_RWY',
             'WAIT_ENTRY','AT_ENTRY','WAIT_LINEUP','TAKEOFF_ROLL','AIRBORNE_CLIMB','HANDED_OFF'];
  const ARR=['INBOUND','SEQUENCING','FINAL_APPROACH','LANDED'];
  let dc=0, ac2=0;
  let firstDep=null, firstArr=null;

  // If selected AC no longer exists, clear selection
  if(sel && !ACs[sel]){
    // Try to find another AC to select
    const remaining=Object.values(ACs);
    sel = remaining.length ? remaining[0].id : null;
  }

  Object.values(ACs).forEach(a=>{
    const isDep=DEP.includes(a.cmdStep);
    const isArr=ARR.includes(a.cmdStep);
    if(!isDep&&!isArr) return;

    const isSel=a.id===sel;
    if(isDep){ dc++; if(!firstDep) firstDep=a.id; }
    else      { ac2++; if(!firstArr) firstArr=a.id; }

    const div=document.createElement('div');
    div.className=`fs ${isDep?'dep':'arr'}${isSel?' sel':''}${a.reqFlash?' req-flash':''}`;
    div.dataset.acid=a.id;

    const destIcao=AIRPORT_ICAO[a.destination]||a.destination;
    const origIcao=AIRPORT_ICAO[a.origin]||a.origin;
    const routeTxt=isDep
      ?`→ ${a.destination} <span style="color:var(--t2);font-size:9px">${destIcao}</span>`
      :`← ${a.origin} <span style="color:var(--t2);font-size:9px">${origIcao}</span>`;

    div.innerHTML=`
      <div class="fs-top">
        <span class="fs-cs">${a.callsign}</span>
        ${a.reqFlash?'<span class="req-tag">REQ</span>':''}
      </div>
      <div class="fs-bot">
        <span class="fs-ty">${a.type}</span>
        <span class="fs-route">${routeTxt}</span>
        <span class="fs-pos ${posClass(a)}">${posText(a)}</span>
      </div>`;

    (isDep?sdep:sarr).appendChild(div);
  });

  document.getElementById('cnt-dep').textContent=dc;
  document.getElementById('cnt-arr').textContent=ac2;
}

// ══════════════════════════════════════
// SPAWN

function broadcastATIS(){
  const atisMsg=`金門機場情報資訊甲，跑道使用中06，地面風050度12節，能見度10公里，晴天，QNH 1013，進場ILS跑道06，離場程序CUBON 1A，情報甲`;
  qC([{seat:'ATIS',cs:'ATIS',msg:atisMsg,type:'atc'}],null);
}

function spawnInitial(){
  resize();

  // ── 離場：立榮 B78642 ──
  const a1=makeAC({
    callsign:'B78642', airline:'立榮航空', type:'ATR 72-600', cat:'COM',
    gate:'2', gx:GATES_COM[1].x, gy:GATES_COM[1].y,
    destination:'松山', depTime:'08:10', fl:180,
  });
  a1.waitTimer=10;
  ACs[a1.id]=a1;

  // ── 離場：空軍 Air Force 1352 ──
  const a2=makeAC({
    callsign:'Air Force 1352', airline:'中華民國空軍', type:'C-130H', cat:'MIL',
    gate:'M1', gx:GATES_MIL[0].x, gy:GATES_MIL[0].y,
    destination:'屏東', depTime:'08:25', fl:200,
  });
  a2.waitTimer=4;
  ACs[a2.id]=a2;

  // ── 進場班機：統一從 CUBON 點出現，間隔 2 分鐘 ──
  // CUBON 1C → SPICA → FF06 → RWY06
  // 第一架立即出現；第二架 waitTimer 為負，等 120 遊戲秒後才開始計時
  const dxCS = WPT.SPICA.x - WPT.CUBON.x;
  const dyCS = WPT.SPICA.y - WPT.CUBON.y;
  const cubonToSpicaHdg = (Math.atan2(dxCS, dyCS) * 180 / Math.PI + 360) % 360;

  const a3=makeAC({
    callsign:'B71234', airline:'立榮航空', type:'ATR 72-600', cat:'COM',
    gate:'3', origin:'松山', arrTime:'08:20',
  });
  a3.cmdStep='INBOUND'; a3.assignedRwy='06';
  a3.ax=WPT.CUBON.x; a3.ay=WPT.CUBON.y;
  a3.aHdg=cubonToSpicaHdg; a3.aSpd=200;
  a3.altitude=8000; a3.targetAlt=8000;
  a3.airRoute=[...ARR_ROUTES['CUBON-1C-06']];
  a3.airRouteIdx=0; a3.holdRwyHdg=false;
  a3.waitTimer=0; a3.pilotCalled=false;
  ACs[a3.id]=a3;

  const a4=makeAC({
    callsign:'AE1024', airline:'華信航空', type:'ATR 72-600', cat:'COM',
    gate:'5', origin:'臺中', arrTime:'08:35',
  });
  a4.cmdStep='INBOUND'; a4.assignedRwy='06';
  a4.ax=WPT.CUBON.x; a4.ay=WPT.CUBON.y;
  a4.aHdg=cubonToSpicaHdg; a4.aSpd=200;
  a4.altitude=9000; a4.targetAlt=9000;
  a4.airRoute=[...ARR_ROUTES['CUBON-1C-06']];
  a4.airRouteIdx=0; a4.holdRwyHdg=false;
  a4.waitTimer=-120; // 延遲 120 遊戲秒（2分鐘）後開始移動
  a4.pilotCalled=false;
  ACs[a4.id]=a4;

  updateRunwayLights();
  updateUI();
}

// ══════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════
spawnInitial();
broadcastATIS();
function loop(ts){
  const dt=(ts-lastT)/1000; lastT=ts;
  if(dt>0&&dt<0.5){update(dt*GAME_SPEED);}
  render();
  // Update wind/lights and clock every second, not every frame
  const sec=Math.floor(gTime);
  if(sec!==loop._lastSec){
    loop._lastSec=sec;
    updateClock();
    if(sec%5===0){drawWindIndicator(); updateRunwayLights();}
  }
  requestAnimationFrame(loop);
}
loop._lastSec=-1;
requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});
</script>
