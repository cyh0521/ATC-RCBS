<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC · 金門尚義 RCBS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#111820; --bg2:#18222e; --panel:#1c2d3f; --panel2:#243448;
  --border:#2e4560; --borderB:rgba(100,180,255,0.25);
  --green:#3ddc84; --teal:#00c8be; --blue:#5abeff;
  --amber:#ffb830; --red:#ff5c5c; --purple:#c090ff; --sky:#7ecfff;
  --t1:#eef4ff; --t2:#90b8d8; --t3:#4a7090; --t4:#263a50;
  --mono:'Share Tech Mono',monospace; --disp:'Orbitron',monospace; --ui:'Inter',sans-serif;
  --left-w:420px;   /* ASR radar / channel column width — 4:5 ratio */
  --top-h:60vh;     /* upper row height */
  --cmd-h:52px;     /* command bar height — taller for bigger buttons */
  --bottom-h:calc(100vh - var(--top-h)); /* lower row height */
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--t1);font-family:var(--ui);
  width:100vw;height:100vh;
  display:grid;
  /* columns: left fixed | right fills */
  grid-template-columns:var(--left-w) 1fr;
  /* rows: upper | cmd bar | strips */
  grid-template-rows:var(--top-h) var(--cmd-h) 1fr;
  overflow:hidden;user-select:none;
}

/* ═══════════════════════════════════════════
   LEFT COLUMN — spans all rows
═══════════════════════════════════════════ */
#left-col{
  grid-column:1; grid-row:1/4;
  display:grid;
  grid-template-rows:var(--top-h) 1fr;
  border-right:2px solid rgba(100,180,255,0.2);
}

/* ── 左上：ASR 雷達 ── */
#asr-wrap{
  background:#060e18;border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
canvas#minimap{display:block;flex:1;min-height:0;width:100%;}
.mm-title{
  position:absolute;top:6px;left:8px;
  font-family:var(--disp);font-size:10px;
  color:rgba(0,220,210,0.85);letter-spacing:2px;font-weight:700;
  pointer-events:none;
}

/* ── 左下：頻道通話記錄（滾動日誌式） ── */
#ch-col{
  background:#0a1520;overflow:hidden;
  display:flex;flex-direction:column;
}
#ch-header{
  padding:5px 10px 4px;border-bottom:1px solid var(--border);
  font-family:var(--disp);font-size:9px;color:var(--t3);
  letter-spacing:2px;font-weight:700;flex-shrink:0;
  background:rgba(0,0,0,0.2);
  display:flex;align-items:center;justify-content:space-between;
}
.ch-live-badges{display:flex;gap:6px;align-items:center;}
.ch-live-badge{
  font-family:var(--mono);font-size:8px;font-weight:700;
  padding:1px 5px;border-radius:2px;letter-spacing:0.5px;
  border:1px solid transparent;transition:all .3s;
}
/* ── 頻道徽章：恆亮 ── */
.ch-live-badge.twr{color:#60c8ff;border-color:#60c8ff;background:rgba(96,200,255,0.15);}
.ch-live-badge.twr.on{color:#60c8ff;border-color:#60c8ff;background:rgba(96,200,255,0.15);}
.ch-live-badge.gnd{color:#ffb830;border-color:#ffb830;background:rgba(255,184,48,0.13);}
.ch-live-badge.gnd.on{color:#ffb830;border-color:#ffb830;background:rgba(255,184,48,0.13);}
.ch-live-badge.app{color:#3ddc84;border-color:#3ddc84;background:rgba(61,220,132,0.13);}
.ch-live-badge.app.on{color:#3ddc84;border-color:#3ddc84;background:rgba(61,220,132,0.13);}
/* 通話記錄容器 */
#ch-log{
  flex:1;overflow-y:auto;
  padding:4px 0 2px;min-height:0;
  display:flex;flex-direction:column;
  gap:0;
}
#ch-log::-webkit-scrollbar{width:2px;}
#ch-log::-webkit-scrollbar-thumb{background:var(--border);}
/* 每條記錄：左側固定方型色塊 + 右側文字 */
.ch-entry{
  display:grid;
  grid-template-columns:46px 1fr;
  border-bottom:1px solid rgba(46,69,96,0.18);
}
.ch-entry.new-entry{animation:chSlide .18s ease;}
@keyframes chSlide{from{opacity:0;}to{opacity:1;}}
/* 色塊容器 — 垂直居中對齊方塊 */
.ch-entry-badge{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:7px 0 5px 0;
}
/* 固定大小正方形色塊 — 不隨內容縮放 */
.ch-badge-sq{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:20px;flex-shrink:0;
  border-radius:2px;
  font-family:var(--disp);font-size:8.5px;font-weight:800;
  letter-spacing:0.3px;line-height:1;
}
/* 各席位色塊顏色 */
.ch-badge-sq.twr{ background:rgba(96,200,255,0.25);  color:#60c8ff;  border:1px solid rgba(96,200,255,0.70);}
.ch-badge-sq.gnd{ background:rgba(255,184,48,0.22);  color:#ffd070;  border:1px solid rgba(255,200,80,0.55);}
.ch-badge-sq.app{ background:rgba(61,220,132,0.20);  color:#3ddc84;  border:1px solid rgba(61,220,132,0.55);}
.ch-badge-sq.atis{background:rgba(0,200,190,0.20);   color:#55ddd5;  border:1px solid rgba(0,210,200,0.50);}
.ch-badge-sq.ac{  background:rgba(160,190,255,0.12); color:#c0d4ff;  border:1px solid rgba(160,190,255,0.30);}
/* 對話文字 — 較大字體，易讀 */
.ch-entry-msg{
  font-family:var(--mono);font-size:12.5px;line-height:1.5;
  word-break:break-all;padding:5px 8px 5px 3px;
}
/* 各席位文字顏色 */
.ch-entry-msg.twr-txt{ color:#60c8ff;}
.ch-entry-msg.app-txt{ color:#3ddc84;}
.ch-entry-msg.gnd-txt{ color:#ffd070;}
.ch-entry-msg.atis-txt{color:#55ddd5;font-size:11.5px;}
.ch-entry-msg.ac-txt{  color:#ffffff;}

/* wind + rwy block inside cmd-wx */
#wind-indicator{width:44px;height:44px;flex-shrink:0;}
#rwy-block{display:flex;flex-direction:column;gap:4px;}
.rwy-row{display:flex;align-items:center;gap:6px;}
.rwy-lt{
  width:36px;height:22px;border-radius:3px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:10px;font-weight:700;transition:all .4s;
}
.rwy-lt.on-green{background:#1a4a28;border-color:#22cc66;color:#44ff88;box-shadow:0 0 8px rgba(34,204,102,0.5);}
.rwy-lt.on-amber{background:#4a3010;border-color:#cc8820;color:#ffcc44;}
.rwy-lt.off{background:rgba(0,0,0,.3);border-color:var(--border);color:var(--t2);}
.rwy-info{font-family:var(--mono);font-size:9px;color:var(--t2);}
#cmd-wx-rwy{display:flex;gap:5px;align-items:center;}
#cmd-wx-vals{display:flex;flex-direction:column;gap:3px;}
#cmd-clock{
  border-right:1px solid var(--border);padding-right:10px;
  font-family:var(--mono);font-size:17px;font-weight:700;
  color:var(--green);letter-spacing:1px;white-space:nowrap;
  min-width:90px;text-align:center;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}

/* ═══════════════════════════════════════════
   RIGHT COLUMN
═══════════════════════════════════════════ */

/* ── 右上：SMR 機場畫面 ── */
#smr-wrap{
  grid-column:2; grid-row:1;
  background:#070f1c;position:relative;overflow:hidden;
}
canvas#radar{display:block;}
.smr-label{
  position:absolute;top:6px;left:10px;
  font-family:var(--disp);font-size:10px;
  color:rgba(100,200,255,0.85);letter-spacing:2px;font-weight:700;
  pointer-events:none;
}

/* ── 指令選單橫帶 ── */
#cmd-bar{
  grid-column:2; grid-row:2;
  display:flex;align-items:center;gap:6px;padding:0 10px;
  background:rgba(0,0,0,.35);
  border-top:1px solid rgba(100,180,255,0.2);
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
#cmd-label{
  font-family:var(--disp);font-size:8px;color:var(--t3);
  letter-spacing:1.5px;white-space:nowrap;flex-shrink:0;
}
#cmd-btns{display:flex;align-items:center;flex-wrap:nowrap;gap:5px;overflow-x:auto;flex:1;}
#cmd-btns::-webkit-scrollbar{height:2px;}
#cmd-btns::-webkit-scrollbar-thumb{background:var(--border);}
/* Seat-colored command buttons */
.cb{
  background:var(--bg2);border:1px solid var(--border);color:var(--t2);
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:4px;
  cursor:pointer;transition:all .12s;white-space:nowrap;flex-shrink:0;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.cb:hover:not(:disabled){
  background:rgba(0,200,190,0.12);border-color:var(--teal);
  color:var(--teal);
}
.cb:active:not(:disabled){background:rgba(0,200,190,0.22);}
.cb:disabled{opacity:.2;cursor:default;}
/* seat-specific button border accent */
.cb.seat-APP{border-left:3px solid var(--blue);}
.cb.seat-TWR{border-left:3px solid var(--blue);}
.cb.seat-GND{border-left:3px solid var(--amber);}
.cb.seat-DEL{border-left:3px solid var(--green);}
.cb-seat-lbl{font-size:7px;font-weight:700;letter-spacing:0.5px;opacity:0.8;}
.cb-seat-lbl.APP{color:var(--blue);}
.cb-seat-lbl.TWR{color:var(--blue);}
.cb-seat-lbl.GND{color:var(--amber);}
.cb-seat-lbl.DEL{color:var(--green);}

/* ── 航班區（離場｜詳情｜進場） ── */
#strips-area{
  grid-column:2; grid-row:3;
  display:grid;
  grid-template-columns:1fr 200px 1fr;
  overflow:hidden;min-height:0;
}

/* 管制條欄 */
.strip-col{
  display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--border);
}
.strip-col:last-child{border-right:none;}
.strip-col-hdr{
  display:flex;align-items:center;gap:6px;padding:5px 10px;
  font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:1.5px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.hdr-dep{color:var(--amber);background:rgba(255,184,48,.05);}
.hdr-arr{color:var(--sky);background:rgba(126,207,255,.05);}
.strip-cnt{font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--t2);}
.strip-list{flex:1;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:4px;}
.strip-list::-webkit-scrollbar{width:3px;}
.strip-list::-webkit-scrollbar-thumb{background:var(--border);}

/* 管制條 card */
.fs{
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:5px 8px;cursor:pointer;transition:all .14s;
  border-left:3px solid transparent;flex-shrink:0;
}
.fs:hover{background:var(--panel2);}
.fs.dep{border-left-color:var(--amber);}
.fs.arr{border-left-color:var(--sky);}
.fs.sel.dep{box-shadow:0 0 0 1px var(--amber),0 2px 8px rgba(255,184,48,.25);}
.fs.sel.arr{box-shadow:0 0 0 1px var(--sky),0 2px 8px rgba(126,207,255,.25);}
.fs-top{display:flex;align-items:center;gap:5px;margin-bottom:2px;}
.fs-cs{font-family:var(--mono);font-size:14px;font-weight:bold;}
.dep .fs-cs{color:var(--amber);}
.arr .fs-cs{color:var(--sky);}
.fs-badge{font-size:7px;padding:1px 4px;border-radius:2px;font-weight:700;font-family:var(--mono);}
.b-gnd{background:rgba(255,184,48,.18);color:var(--amber);}
.b-rwy{background:rgba(255,92,92,.18);color:var(--red);}
.b-air{background:rgba(90,190,255,.18);color:var(--blue);}
.b-app{background:rgba(61,220,132,.18);color:var(--green);}
.fs-bot{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.fs-ty{font-size:10px;color:var(--t2);font-family:var(--mono);}
.fs-dest{font-size:10px;color:var(--t2);}
.fs-pos{
  font-size:10px;font-family:var(--mono);margin-left:auto;
  padding:1px 5px;border-radius:2px;background:rgba(0,0,0,.25);
}
.fs-pos.gnd{color:var(--amber);}
.fs-pos.rwy{color:var(--red);}
.fs-pos.air{color:var(--sky);}
.fs-pos.app{color:var(--green);}
@keyframes reqTagBlink{
  0%,100%{background:rgba(220,40,40,0.9);color:#fff;box-shadow:0 0 6px rgba(220,40,40,0.6);}
  50%{background:rgba(220,40,40,0.3);color:rgba(255,200,200,0.8);box-shadow:none;}
}
.req-tag{
  font-size:6px;font-weight:700;padding:1px 4px;border-radius:2px;
  background:rgba(220,40,40,0.9);color:#fff;font-family:var(--mono);
  letter-spacing:.5px;display:inline-block;vertical-align:middle;margin-left:3px;
  animation:reqTagBlink .6s ease-in-out infinite;
}
.req-flash{}

/* 中間：選中航班詳情 */
#ac-detail-col{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border-right:1px solid var(--border);
}
#ac-img-box{
  width:100%;aspect-ratio:3/2;background:#0a141e;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
}
#ac-img-box img{width:100%;height:100%;object-fit:cover;}
#ac-img-placeholder{color:var(--t3);font-size:9px;text-align:center;padding:8px;font-family:var(--mono);}
#ac-info-text{padding:6px 8px;flex:1;overflow-y:auto;}
#ac-cs-big{font-family:var(--mono);font-size:16px;font-weight:bold;color:var(--teal);margin-bottom:2px;}
#ac-airline-lbl{font-size:11px;color:var(--t2);margin-bottom:4px;}
.ac-row{font-size:11px;color:var(--t2);font-family:var(--mono);line-height:1.7;}
.ac-row span{color:var(--t1);}
#ac-empty-msg{color:var(--t3);font-size:11px;text-align:center;padding:12px 8px;font-family:var(--mono);line-height:1.6;}



/* cmd-bar wx block */
#cmd-wx{
  display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;
  border-left:1px solid var(--border);padding-left:10px;
}
#cmd-wx-rwy{display:flex;gap:5px;align-items:center;}
#cmd-wx-vals{display:flex;flex-direction:column;gap:3px;}
/* route toggle button in ASR */
.asr-ctrl-bar{
  display:flex;align-items:center;gap:5px;padding:5px 7px;flex-shrink:0;
  background:rgba(4,10,22,0.90);border-top:none;
  z-index:5;flex-wrap:wrap;
}
.asr-btn{
  font-family:var(--mono);font-size:9.5px;padding:3px 7px;
  background:rgba(0,200,190,0.13);border:1px solid rgba(0,200,190,0.40);
  color:var(--teal);border-radius:3px;cursor:pointer;
  letter-spacing:0.4px;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.asr-btn:hover{background:rgba(0,200,190,0.25);}
.asr-btn.off{background:rgba(30,45,65,0.4);border-color:var(--border);color:var(--t3);}
.asr-popup-btn{
  margin-left:auto;
  font-family:var(--mono);font-size:9.5px;padding:3px 7px;
  background:rgba(90,190,255,0.10);border:1px solid rgba(90,190,255,0.35);
  color:var(--sky);border-radius:3px;cursor:pointer;
  letter-spacing:0.4px;transition:all .15s;white-space:nowrap;
}
.asr-popup-btn:hover{background:rgba(90,190,255,0.22);}
/* ASR inline legend inside ctrl bar */
.asr-inline-legend{display:flex;align-items:center;gap:10px;margin:0 6px;}
.asr-leg-item{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;color:var(--t2);white-space:nowrap;}
.asr-leg-dash{width:18px;height:0;border-top:1.5px dashed;flex-shrink:0;}
#sb{display:none;}
</style>
</head>
<body>

<!-- ═══ LEFT COLUMN: ASR radar (top) + Channels (bottom) ═══ -->
<div id="left-col">

  <!-- 左上：ASR 雷達 -->
  <div id="asr-wrap">
    <canvas id="minimap"></canvas>
    <div class="mm-title">ASR · 廣域進場雷達</div>

    <!-- 圖例 -->
    <!-- 控制列（含圖例）-->
    <div class="asr-ctrl-bar" id="asr-ctrl-bar">
      <button class="asr-btn" id="btn-routes" onclick="toggleRoutes()">隱藏航線</button>
      <button class="asr-btn" id="btn-ac"     onclick="toggleAC()">隱藏班機</button>
      <div class="asr-inline-legend">
        <div class="asr-leg-item"><div class="asr-leg-dash" style="border-color:rgba(96,200,255,0.92)"></div><span>進場航線</span></div>
        <div class="asr-leg-item"><div class="asr-leg-dash" style="border-color:rgba(255,90,180,0.92)"></div><span>離場航線</span></div>
        <div class="asr-leg-item"><div class="asr-leg-dash" style="border-color:rgba(255,150,40,0.92)"></div><span>終端管制區域</span></div>
      </div>
      <button class="asr-popup-btn" onclick="openASRPopup()" title="放大檢視">⤢ 放大</button>
    </div>
  </div>

  <!-- 左下：頻道通話記錄 -->
  <div id="ch-col">
    <div id="ch-header">
      <span>COMM LOG · RCBS</span>
      <div class="ch-live-badges">
        <span class="ch-live-badge app" id="badge-app">APP 124.6</span>
        <span class="ch-live-badge twr" id="badge-twr">TWR 118.0</span>
        <span class="ch-live-badge gnd" id="badge-gnd">GND 126.2</span>
      </div>
    </div>
    <div id="ch-log">
      <div class="ch-entry">
        <div class="ch-entry-badge"><span class="ch-badge-sq atis">ATIS</span></div>
        <span class="ch-entry-msg atis-txt">甲 · RWY06 · QNH 1013 · 127.2</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══ RIGHT TOP: SMR Airport View ═══ -->
<div id="smr-wrap">
  <canvas id="radar"></canvas>
  <div class="smr-label">SMR · 金門尚義 RCBS · 地面+近場</div>
</div>

<!-- ═══ RIGHT MID: Command Bar ═══ -->
<div id="cmd-bar">
  <span id="cmd-label">CMD ▸</span>
  <div id="cmd-btns">
    <span style="color:var(--t3);font-size:9px;font-family:var(--mono);">— 點選航機後顯示指令 —</span>
  </div>
  <!-- 氣象 + 跑道狀態（靠右） -->
  <div id="cmd-wx">
    <div id="cmd-clock">
      <span id="clock-sm">08:00:00</span>
    </div>
    <canvas id="wind-canvas" width="44" height="44" style="flex-shrink:0;width:44px;height:44px;"></canvas>
    <div id="cmd-wx-rwy">
      <span class="rwy-lt off" id="rwy06-light">06</span>
      <span class="rwy-lt off" id="rwy24-light">24</span>
    </div>
    <div id="cmd-wx-vals">
      <span id="wx-wind" style="font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600">050°/12KT</span>
      <span id="wx-qnh" style="font-family:var(--mono);font-size:11px;color:var(--sky);font-weight:600">QNH 1013</span>
    </div>
  </div>
</div>

<!-- ═══ RIGHT BOTTOM: Strips ═══ -->
<div id="strips-area">

  <!-- 離場管制條 -->
  <div class="strip-col">
    <div class="strip-col-hdr hdr-dep">
      ↑ 離場 DEPARTURE
      <span class="strip-cnt" id="cnt-dep">0</span>
    </div>
    <div class="strip-list" id="sdep"></div>
  </div>

  <!-- 中間：選中航班詳情 -->
  <div id="ac-detail-col">
    <div id="ac-img-box">
      <div id="ac-img-placeholder">— 點選航機 —</div>
    </div>
    <div id="ac-info-text">
      <div id="ac-empty-msg">選擇左側或右側<br>管制條以顯示詳情</div>
    </div>
  </div>

  <!-- 進場管制條 -->
  <div class="strip-col" style="border-right:none;">
    <div class="strip-col-hdr hdr-arr">
      ↓ 進場 ARRIVAL
      <span class="strip-cnt" id="cnt-arr">0</span>
    </div>
    <div class="strip-list" id="sarr"></div>
  </div>

</div>


<script>
'use strict';
// ══════════════════════════════════════
// EVENT DELEGATION (survives DOM rebuilds)

document.addEventListener('click', e=>{
  // CMD button clicks
  const btn=e.target.closest('button.cb[data-action]');
  if(btn){
    const acid=btn.dataset.acid;
    const action=btn.dataset.action;
    const ac=ACs[acid];
    if(ac&&action){ execCmd(ac,action); return; }
  }
  // Strip card clicks
  const strip=e.target.closest('.fs[data-acid]');
  if(strip){
    selectStrip(strip.dataset.acid);
    return;
  }
});

function imgToCv(ix, iy) {
  const { sx, sy, ox, oy } = getImgTransform();
  return { x: ox + ix * sx, y: oy + iy * sy };
}
let _imgTransform = null;
function getImgTransform() {
  if (_imgTransform &&
      _imgTransform.cW === cW && _imgTransform.cH === cH) return _imgTransform;
  // cover：維持圖片比例填滿canvas，以跑道中心線為垂直錨點
  const sx = cW / IMG_W;
  const sy = cH / IMG_H;
  // 使用 cover（取較大縮放），但允許上下裁切
  const s = Math.max(sx, sy);
  const ox = (cW - IMG_W * s) / 2;
  const oy = (cH - IMG_H * s) / 2;
  _imgTransform = { sx:s, sy:s, ox, oy, cW, cH };
  return _imgTransform;
}

  if(mmCv){

    if(asrWrap){
      mmW=mmCv.clientWidth||asrWrap.clientWidth;
      mmH=mmCv.clientHeight||200;
      // Fallback: subtract ctrl bar if clientHeight not yet set
      if(!mmH||mmH===asrWrap.clientHeight){
        const ctrlBar=document.getElementById('asr-ctrl-bar');
        mmH=asrWrap.clientHeight-(ctrlBar?ctrlBar.offsetHeight:30);

      mmCv.width=Math.round(mmW*dpr); mmCv.height=Math.round(mmH*dpr);
      mmCv.style.width=mmW+'px'; mmCv.style.height=mmH+'px';
      if(mmCx){mmCx.setTransform(1,0,0,1,0,0); mmCx.scale(dpr,dpr);}
    }

}

  const wc=document.getElementById('wind-canvas');
  if(!wc)return;
  const wctx=wc.getContext('2d');
  const W=44, R=17, cx2=22, cy2=22;
  wctx.clearRect(0,0,W,W);
  wctx.strokeStyle='rgba(80,160,220,0.6)'; wctx.lineWidth=1.2;
  wctx.beginPath(); wctx.arc(cx2,cy2,R,0,Math.PI*2); wctx.stroke();
  wctx.strokeStyle='rgba(80,160,220,0.3)'; wctx.lineWidth=0.8;
  wctx.beginPath(); wctx.arc(cx2,cy2,R*0.5,0,Math.PI*2); wctx.stroke();
  // Cardinal letters — N at top, E right, S bottom, W left
  wctx.fillStyle='rgba(120,190,240,0.90)'; wctx.font='bold 6px Orbitron,monospace';
  wctx.textAlign='center'; wctx.textBaseline='middle';
  wctx.fillText('N',cx2,cy2-R+4);
  wctx.fillText('S',cx2,cy2+R-4);
  wctx.fillText('E',cx2+R-4,cy2);
  wctx.fillText('W',cx2-R+4,cy2);
  // Wind arrow: points in the direction wind is GOING TO (from = dir, to = dir+180)
  // Compass bearing → canvas angle: rad = (bearing - 90) * π/180
  // Wind FROM 050 → arrow points TOWARD 230°
  const toDir = (wind.dir + 180) % 360;
  const rad = (toDir - 90) * Math.PI / 180;
  // Tail (origin side) and head (arrow tip)
  const tailX = cx2 - Math.cos(rad) * (R * 0.55);
  const tailY = cy2 - Math.sin(rad) * (R * 0.55);
  const headX = cx2 + Math.cos(rad) * (R - 3);
  const headY = cy2 + Math.sin(rad) * (R - 3);
  wctx.strokeStyle='#ffb830'; wctx.lineWidth=2; wctx.lineCap='round';
  wctx.beginPath(); wctx.moveTo(tailX, tailY); wctx.lineTo(headX, headY); wctx.stroke();
  // Arrowhead at head — use rad for direction
  const aSize = 5;
  wctx.fillStyle='#ffb830';
  wctx.beginPath();
  wctx.moveTo(headX, headY);
  wctx.lineTo(headX - Math.cos(rad - 0.45)*aSize, headY - Math.sin(rad - 0.45)*aSize);
  wctx.lineTo(headX - Math.cos(rad + 0.45)*aSize, headY - Math.sin(rad + 0.45)*aSize);
  wctx.closePath(); wctx.fill();
}

function updateRunwayLights(){
  function xwind(rwyHdg){
    const diff=(wind.dir - rwyHdg + 360)%360;
    return Math.abs(Math.sin(diff*Math.PI/180)*wind.spd);
  }
  const xw06=xwind(63), xw24=xwind(243);
  function applyState(el,xw){
    if(!el)return;
    el.classList.remove('on-green','on-amber','off');
    if(xw>XW_CLOSE) el.classList.add('off');
    else if(xw>XW_AMBER) el.classList.add('on-amber');
    else el.classList.add('on-green');
  }
  applyState(document.getElementById('rwy06-light'),xw06);
  applyState(document.getElementById('rwy24-light'),xw24);
  // wind display
  const wEl=document.getElementById('wx-wind');
  if(wEl) wEl.textContent=String(wind.dir).padStart(3,'0')+'°/'+wind.spd+'KT';
}

  // 跑道帶（淡色草地）

  cx.fillStyle='#1e351e';
  cx.fillRect(0, rwyBandTop, cW, rwyBandBot-rwyBandTop);

  // 跑道本體（深灰瀝青）
  const rTop = imgToCv(0, RWY_Y - RWY_W_PX/2);
  const rBot = imgToCv(0, RWY_Y + RWY_W_PX/2);
  const rL   = imgToCv(60, 0);
  const rR   = imgToCv(2490, 0);
  cx.fillStyle='#2e2e2e';
  cx.fillRect(rL.x, rTop.y, rR.x-rL.x, rBot.y-rTop.y);

  // 跑道中線（白色虛線）
  const rMid = imgToCv(0, RWY_Y).y;
  cx.setLineDash([imgToCv(30,0).x - imgToCv(0,0).x, imgToCv(15,0).x - imgToCv(0,0).x]);
  cx.strokeStyle='rgba(255,255,255,0.55)'; cx.lineWidth=Math.max(1,1.5*GS);
  cx.beginPath(); cx.moveTo(rL.x, rMid); cx.lineTo(rR.x, rMid); cx.stroke();
  cx.setLineDash([]);

  // RWY06 위치입력 표시 (DTHR 사선)
  const dthrX = imgToCv(DTHR06.x, 0).x;
  cx.strokeStyle='rgba(255,220,80,0.85)'; cx.lineWidth=Math.max(2,2.5*GS);
  cx.beginPath(); cx.moveTo(dthrX, rTop.y); cx.lineTo(dthrX, rBot.y); cx.stroke();

  // 跑道端號（RWY06/24）
  const r06px = imgToCv(DTHR06.x + 30, RWY_Y);
  const r24px = imgToCv(THR24.x  - 30, RWY_Y);
  cx.fillStyle='rgba(255,255,255,0.75)';
  cx.font=`bold ${Math.max(10, Math.round(14*GS))}px Share Tech Mono`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('06', r06px.x, r06px.y);
  cx.fillText('24', r24px.x, r24px.y);

  // TWY N（平行滑行道）
  const twyNpx = imgToCv(0, TWY_N_Y).y;
  const twyH   = Math.max(3, Math.round(23 * PX_PER_M * GS));
  cx.fillStyle='#272727';
  cx.fillRect(0, twyNpx - twyH/2, cW, twyH);
  // TWY N 中線
  cx.strokeStyle='rgba(255,220,80,0.35)'; cx.lineWidth=Math.max(1,1*GS);
  cx.setLineDash([]);
  cx.beginPath(); cx.moveTo(0, twyNpx); cx.lineTo(cW, twyNpx); cx.stroke();

  // TWY A/B/C/D 連接道
  Object.entries(CONN).forEach(([id, ix])=>{
    const cp = imgToCv(ix, RWY_Y);
    const np = imgToCv(ix, TWY_N_Y);
    cx.fillStyle='#272727';
    const tw2 = Math.max(3, Math.round(23 * PX_PER_M * GS / 2));
    cx.fillRect(cp.x - tw2, np.y, tw2*2, cp.y - np.y);
    // 連接道標籤
    cx.fillStyle='rgba(255,220,80,0.60)';
    cx.font=`${Math.max(8, Math.round(10*GS))}px Share Tech Mono`;
    cx.textAlign='center'; cx.textBaseline='bottom';
    cx.fillText('TWY '+id, cp.x, np.y - 4);
  });

  // 停機坪區域（北側建築）
  const apronY = imgToCv(0, 160).y;
  const apronH = Math.abs(imgToCv(0, TWY_N_Y).y - imgToCv(0, 160).y);
  cx.fillStyle='#242424';
  cx.fillRect(0, apronY, cW, apronH);
  // 停機坪前緣線
  cx.strokeStyle='rgba(255,255,255,0.2)'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0, apronY+apronH); cx.lineTo(cW, apronY+apronH); cx.stroke();

  // 跑道兩端白色入口標線
  [[DTHR06.x, 'L'],[THR24.x, 'R']].forEach(([ix, side])=>{
    const p = imgToCv(ix, RWY_Y);
    cx.fillStyle='rgba(255,255,255,0.7)';
    const barW = Math.max(2, 3*GS), barH = Math.max(8, 18*GS), gap = Math.max(3, 4*GS);
    const count = 6;
    const totalW = count*(barW+gap);
    const startX = side==='L' ? p.x : p.x - totalW;
    for(let i=0;i<count;i++){
      cx.fillRect(startX + i*(barW+gap), rTop.y+2, barW, barH);
    }
  });
}

function drawGateMarker(g){
  const p = imgToCv(g.x, g.y);
  const cols = {
    MIL:['rgba(180,40,40,0.85)','rgba(255,120,120,1)'],
    COM:['rgba(20,140,70,0.85)','rgba(80,240,140,1)'],

  const r = Math.max(5, 6*GS);
  cx.fillStyle=fill;
  cx.beginPath(); cx.arc(p.x,p.y,r,0,Math.PI*2); cx.fill();
  cx.fillStyle=txtCol;
  cx.font=`bold ${Math.round(Math.max(9,8*GS+6))}px Share Tech Mono`;
  cx.textAlign='center'; cx.textBaseline='bottom';
  cx.fillText(g.id, p.x, p.y-r-2);

  cx.font=(bold?'bold ':'')+sz+'px Share Tech Mono';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(t,x,y); cx.restore();
}

    [-12.1,1.9],[-14.3,0.7],[-15.9,0.7],[-17.0,1.9]

  [
    {pts:bigKinmen,   fill:'rgba(22,50,24,0.92)', stroke:'rgba(55,170,80,0.50)', sw:1.2},
    {pts:smallKinmen, fill:'rgba(20,46,22,0.90)', stroke:'rgba(50,155,72,0.45)', sw:1.0},

    cx.fillStyle=fill; cx.fill();
    cx.strokeStyle=stroke; cx.lineWidth=sw; cx.stroke();
  });

  cx.textAlign='center'; cx.fillText('金廈海峽',straitP.x,straitP.y);

    cx.beginPath(); cx.moveTo(ox,oy); cx.lineTo(ox+Math.cos(rad)*28*NM_PX,oy+Math.sin(rad)*28*NM_PX); cx.stroke();

  // ── SID routes (correct per AIP charts) ──

  const BS_129_MID = [5.8, -4.4];  // midpoint along BS 129BRG bearing toward SANDY

  const sidRoutes=[
    // CUBON 1A: RWY06 → maintain 063° to 600ft → right → BS001(E) → INDIA(SE) → CUBON(SE far)
    {pts:[RWY06_exit, TURN06,
          [WPT.BS001.x,WPT.BS001.y],
          [WPT.INDIA.x,WPT.INDIA.y],
          [WPT.CUBON.x,WPT.CUBON.y]],
     col:'rgba(61,220,132,0.38)', lbl:'CUBON 1A', dash:[6,5]},

    {pts:[RWY06_exit, TURN06,
          [WPT.BS001.x,WPT.BS001.y],
          [WPT.INDIA.x,WPT.INDIA.y]],
     col:'rgba(61,220,132,0.28)', lbl:'INDIA 1A', dash:[6,5]},
    // SANDY 1A: RWY06 → 600ft → right → track BS 129BRG → SANDY

          BS_129_MID,
          [WPT.SANDY.x,WPT.SANDY.y]],
     col:'rgba(61,220,132,0.24)', lbl:'SANDY 1A', dash:[4,6]},
    // SPRAY 1J: RWY06 → 600ft → right → HDG170 radar vectors (south ~15NM)

          [WPT.SPRAY_J.x,WPT.SPRAY_J.y]],
     col:'rgba(61,220,132,0.18)', lbl:'SPRAY 1J', dash:[3,7]},
    // CUBON 1B: RWY24 → 600ft → left → BS002(W-SW) → CUBON(SE far)
    {pts:[RWY24_exit, TURN24,
          [WPT.BS002.x,WPT.BS002.y],
          [WPT.CUBON.x,WPT.CUBON.y]],
     col:'rgba(255,184,48,0.35)', lbl:'CUBON 1B', dash:[6,5]},
    // INDIA 1B: RWY24 → 600ft → left → BS002 → INDIA
    {pts:[RWY24_exit, TURN24,
          [WPT.BS002.x,WPT.BS002.y],
          [WPT.INDIA.x,WPT.INDIA.y]],
     col:'rgba(255,184,48,0.25)', lbl:'INDIA 1B', dash:[6,5]},
    // SANDY 1B: RWY24 → 600ft → left → track BS 129BRG → SANDY
    {pts:[RWY24_exit, TURN24,
          BS_129_MID,
          [WPT.SANDY.x,WPT.SANDY.y]],
     col:'rgba(255,184,48,0.22)', lbl:'SANDY 1B', dash:[4,6]},

          [WPT.SPRAY_K.x,WPT.SPRAY_K.y]],
     col:'rgba(255,184,48,0.16)', lbl:'SPRAY 1K', dash:[3,7]},
  ];

    // ILS RWY24: AMTIK → INDOK(IF) → FAP_24 → THR
    {pts:[[WPT.AMTIK.x,WPT.AMTIK.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],[0,0]],
     col:'rgba(0,200,190,0.22)', lbl:'ILS RWY24', anchor:'start'},
    // ILS RWY24 alt entry: SANDY → MELOG → INDOK → FAP_24
    {pts:[[WPT.SANDY.x,WPT.SANDY.y],[WPT.MELOG.x,WPT.MELOG.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],[0,0]],
     col:'rgba(0,200,190,0.14)', lbl:'', anchor:'start'},
  ];
  starRoutes.forEach(({pts,col,lbl,anchor})=>{
    cx.strokeStyle=col; cx.lineWidth=1.1; cx.setLineDash([4,6]);
    cx.beginPath();
    pts.forEach(([nx,ny],i)=>{const p=nm2c(nx,ny); i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y);});
    cx.stroke(); cx.setLineDash([]);
    if(lbl){
      const sp=pts[0], sp2=nm2c(sp[0],sp[1]);
      cx.fillStyle=col.replace(/[\d.]+\)$/,'0.80)');
      cx.font='bold 8px Share Tech Mono'; cx.textAlign='left';
      cx.fillText(lbl,sp2.x+5,sp2.y-4);
    }
  });

  // ILS localizer feathers — beam extends outbound FROM threshold
  // RWY06 threshold at W end → localizer points W (inbound hdg 063° = aircraft flies EAST)
  // Feather shows the extended centreline toward SPICA/SANDY (ESE direction from ARP)
  drawILS_air('06'); drawILS_air('24');

  // ── Waypoints ──
  const IAF_names=['SANDY','SPICA','CUBON','AMTIK','MELOG'];
  const FF_names=['FAP_06','FAP_24','SKIRT','INDOK'];
  const HIDE=['SPRAY_J','SPRAY_K','RWY06_DTHR','RWY24_THR','KNISH','KETCH','KEBAB'];
  Object.entries(WPT).forEach(([nm,wp])=>{
    if(HIDE.includes(nm)) return;
    const p=nm2c(wp.x,wp.y);
    const isFF=FF_names.includes(nm);
    const isIAF=IAF_names.includes(nm);
    if(isFF){
      cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1;
      const s=5;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y); cx.lineTo(p.x,p.y+s); cx.lineTo(p.x-s,p.y); cx.closePath(); cx.stroke();
      cx.fillStyle='rgba(0,200,190,0.15)'; cx.fill();
    } else if(isIAF){
      cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1.2;
      const s=6;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y+s); cx.lineTo(p.x-s,p.y+s); cx.closePath(); cx.stroke();
    } else {
      cx.strokeStyle='rgba(0,200,190,0.50)'; cx.lineWidth=1;
      const s=4;
      cx.beginPath(); cx.moveTo(p.x,p.y-s); cx.lineTo(p.x+s,p.y+s); cx.lineTo(p.x-s,p.y+s); cx.closePath(); cx.stroke();
    }
    cx.fillStyle=isFF?'rgba(0,220,210,0.75)':'rgba(0,230,210,0.95)';
    cx.font=(isIAF?'bold ':'')+'10px Share Tech Mono';
    cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText(nm,p.x+8,p.y+3);
  });

  // ── RCBS ARP symbol ──
  cx.strokeStyle='rgba(80,240,150,0.95)'; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(ox,oy,5,0,Math.PI*2); cx.stroke();
  cx.beginPath(); cx.moveTo(ox-12,oy); cx.lineTo(ox+12,oy); cx.moveTo(ox,oy-12); cx.lineTo(ox,oy+12); cx.stroke();
  cx.fillStyle='rgba(80,240,150,0.95)'; cx.font='bold 11px Share Tech Mono';
  cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText('RCBS',ox+9,oy+16);

  // ── NDB BS symbol (345 kHz, at ARP area) ──
  const ndbP=nm2c(-0.5,0.3);
  cx.strokeStyle='rgba(255,200,60,0.80)'; cx.lineWidth=1.2;
  cx.beginPath(); cx.arc(ndbP.x,ndbP.y,6,0,Math.PI*2); cx.stroke();
  cx.beginPath(); cx.arc(ndbP.x,ndbP.y,3,0,Math.PI*2); cx.stroke();
  cx.fillStyle='rgba(255,200,60,0.90)'; cx.font='bold 9px Share Tech Mono';
  cx.textAlign='left'; cx.textBaseline='alphabetic'; cx.fillText('BS 345',ndbP.x+9,ndbP.y+3);

  Object.values(ACs).forEach(ac=>{if(!isGnd(ac.cmdStep))drawACAir(ac);});
}
function drawILS_air(rwy){
  // Localizer centreline extends outbound (away from runway, toward arriving aircraft)
  // RWY06: aircraft approaches from SE on hdg 063° → localizer extends to SE = hdg 063°+180 = 243° TRUE
  // RWY24: aircraft approaches from NW on hdg 243° → localizer extends to NW = hdg 243°+180 = 063° TRUE
  // In canvas: hdg 063° = ENE (right of east slightly) = inbound for RWY06
  // Outbound from RWY06 threshold = back-course toward SPICA/SANDY area
  const outHdg = rwy==='06' ? 63 : 243;   // outbound direction (toward arriving aircraft)
  const rad=(outHdg-90)*Math.PI/180;       // canvas rotation (0°=N → -90 offset)
  const{ox,oy}=aOrig(); const len=12*NM_PX;
  const ex=ox+Math.cos(rad)*len, ey=oy+Math.sin(rad)*len;
  cx.strokeStyle='rgba(0,200,190,0.25)'; cx.lineWidth=1; cx.setLineDash([8,6]);
  cx.beginPath(); cx.moveTo(ox,oy); cx.lineTo(ex,ey); cx.stroke(); cx.setLineDash([]);
  // Feather ticks
  const perp=rad+Math.PI/2;
  for(let d=2;d<=10;d+=2){
    const mx2=ox+Math.cos(rad)*d*NM_PX, my2=oy+Math.sin(rad)*d*NM_PX;
    const fw=0.45*NM_PX*(1-d/14);
    cx.strokeStyle='rgba(0,165,155,0.15)'; cx.lineWidth=0.5;
    cx.beginPath();
    cx.moveTo(mx2+Math.cos(perp)*fw,my2+Math.sin(perp)*fw);
    cx.lineTo(mx2-Math.cos(perp)*fw,my2-Math.sin(perp)*fw); cx.stroke();
  }
  cx.fillStyle='rgba(0,200,190,0.65)'; cx.font='8px Share Tech Mono'; cx.textAlign='left';
  const ilsIdent = rwy==='06'?'ILS/DME RWY06 · ICKM 108.9':'ILS/DME RWY24 · ICSY 110.7';
  cx.fillText(ilsIdent,ex+4,ey+3);
}

// AIRCRAFT ARROWS
// ══════════════════════════════════════
function drawArrow(px,py,hdgDeg,sz,col,isSel){
  const ang=hdgDeg*Math.PI/180;
  cx.save(); cx.translate(px,py); cx.rotate(ang);
  if(isSel){
    // Fixed-size selection rings regardless of sz (prevents jump on state change)
    const r1=sz*2.2, r2=sz*3.0;
    cx.strokeStyle='rgba(0,200,190,0.75)'; cx.lineWidth=1.8; cx.setLineDash([]);
    cx.beginPath(); cx.arc(0,0,r1,0,Math.PI*2); cx.stroke();
    cx.strokeStyle='rgba(0,200,190,0.22)'; cx.lineWidth=1;
    cx.beginPath(); cx.arc(0,0,r2,0,Math.PI*2); cx.stroke();
  }
  // Arrow body
  cx.fillStyle=col; cx.strokeStyle='rgba(0,0,0,0.3)'; cx.lineWidth=0.5;
  cx.beginPath();
  cx.moveTo(0,-sz*2.0);
  cx.lineTo(sz*0.95,sz*0.9);
  cx.lineTo(0,sz*0.25);
  cx.lineTo(-sz*0.95,sz*0.9);
  cx.closePath(); cx.fill(); cx.stroke();
  cx.restore();
}

function getACPos(ac){
  if(ac.cmdStep==='TAKEOFF_ROLL'){
    const rwy=ac.assignedRwy||'06';
    // 起飛起始x（像素），RWY06從DTHR附近，RWY24從THR24端
    const rwyStartX = rwy==='06' ? DTHR06.x+30 : THR24.x-50;
    const rwyEndX   = rwy==='06' ? THR24.x      : DTHR06.x+30;
    const totalRoll = Math.abs(rwyEndX - rwyStartX);
    const t = Math.min(ac.rwyRollDist / Math.max(totalRoll, 1), 1);
    const curX = rwyStartX + (rwyEndX - rwyStartX) * t;
    const p = imgToCv(curX, RWY_Y);
    const hdg = rwy==='06' ? 90 : 270; // 畫面角度：90=向右(東)，270=向左(西)
    return { px:p.x, py:p.y, hdg };
  }
  if(ac.cmdStep==='TURNING_06'){
    const p = imgToCv(ac.gx, ac.gy);
    return { px:p.x, py:p.y, hdg:ac.gHdg };
  }
  if(ac.cmdStep==='WAIT_LINEUP'||ac.cmdStep==='TAXIING_TO_RWY'){
    if(ac.taxiIdx>=ac.taxiRoute.length && ac.cmdStep==='WAIT_LINEUP'){
      const rwyX = ac.assignedRwy==='06' ? DTHR06.x+30 : THR24.x-50;
      const p = imgToCv(rwyX, RWY_Y);
      return { px:p.x, py:p.y, hdg:ac.assignedRwy==='06'?90:270 };
    }
  }
  const p = imgToCv(ac.gx, ac.gy);
  return { px:p.x, py:p.y, hdg:ac.gHdg };
}

function drawACGnd(ac){
  const{px,py,hdg}=getACPos(ac);
  const isSel=ac.id===sel;
  const col=isSel?'#00c8be':ac.cat==='MIL'?'#ff9060':'#3ddc84';
  const sz=Math.max(GS*12,4.5);

  // 閃爍請求光環
  if(ac.reqFlash){
    const pulse=0.5+0.5*Math.sin(Date.now()/200);
    cx.strokeStyle=`rgba(255,184,48,${0.5+0.4*pulse})`;
    cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(px,py,sz*3.8,0,Math.PI*2); cx.stroke();
    cx.strokeStyle=`rgba(255,184,48,${0.2+0.2*pulse})`;
    cx.lineWidth=1;
    cx.beginPath(); cx.arc(px,py,sz*5,0,Math.PI*2); cx.stroke();
  }

  drawArrow(px,py,hdg,sz,col,isSel);

  // 班號：圓角矩形反白背景
  cx.save();
  const cs=ac.callsign;
  cx.font='bold 11px Share Tech Mono';
  const tw=cx.measureText(cs).width;
  const bx=px+sz*2+3, by=py-8, bw=tw+10, bh=16, br=4;
  // 背景
  const bgCol=isSel?'rgba(0,200,190,0.95)':ac.cat==='MIL'?'rgba(255,144,96,0.9)':'rgba(61,220,132,0.9)';
  cx.fillStyle=bgCol;
  cx.beginPath();
  cx.moveTo(bx+br,by); cx.lineTo(bx+bw-br,by);
  cx.arcTo(bx+bw,by,bx+bw,by+bh,br);
  cx.lineTo(bx+bw,by+bh-br);
  cx.arcTo(bx+bw,by+bh,bx,by+bh,br);
  cx.lineTo(bx+br,by+bh);
  cx.arcTo(bx,by+bh,bx,by,br);
  cx.lineTo(bx,by+br);
  cx.arcTo(bx,by,bx+bw,by,br);
  cx.closePath(); cx.fill();
  cx.fillStyle='#0a1820';
  cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText(cs,bx+5,by+bh/2);

  // REQ 標記
  if(ac.reqFlash){
    cx.font='bold 8px Share Tech Mono';
    cx.fillStyle='rgba(255,184,48,0.9)';
    const reqX=bx+bw+3, reqY=by;
    cx.fillText('REQ',reqX,reqY+8);
  }

  cx.restore();
}

// 畫滑行路線預覽（懸停跑道選項時）
function drawTaxiPreview(route, col){
  if(!route||route.length<2) return;
  cx.save();
  cx.strokeStyle=col||'rgba(255,220,80,0.6)';
  cx.lineWidth=Math.max(2, 3*GS); cx.setLineDash([8,5]);
  cx.beginPath();
  route.forEach((pt,i)=>{
    const p=imgToCv(pt.x, pt.y);
    i===0?cx.moveTo(p.x,p.y):cx.lineTo(p.x,p.y);
  });
  cx.stroke(); cx.setLineDash([]); cx.restore();
}
function drawACAir(ac){
  const p=nm2c(ac.ax,ac.ay);
  const isSel=ac.id===sel;
  const col=isSel?'#00c8be':ac.cmdStep==='FINAL_APPROACH'?'#ffb830':ac.cat==='MIL'?'#ff9060':'#5abeff';
  const sz=8;
  const ang=ac.aHdg*Math.PI/180;
  for(let i=1;i<=5;i++){
    const bx=p.x-Math.sin(ang)*i*7, by=p.y+Math.cos(ang)*i*7;
    cx.fillStyle=`rgba(90,190,255,${0.16-i*0.025})`;
    cx.beginPath(); cx.arc(bx,by,3.5-i*0.5,0,Math.PI*2); cx.fill();
  }
  drawArrow(p.x,p.y,ac.aHdg,sz,col,isSel);
  cx.save();
  const lx=p.x+sz*2+4,ly=p.y-8;
  // 班號圓角標
  cx.font='bold 11px Share Tech Mono';
  const tw=cx.measureText(ac.callsign).width;
  const bw=tw+10,bh=15,br=4;
  cx.fillStyle=isSel?'rgba(0,200,190,0.9)':'rgba(90,190,255,0.85)';
  cx.beginPath();
  cx.moveTo(lx+br,ly); cx.lineTo(lx+bw-br,ly);
  cx.arcTo(lx+bw,ly,lx+bw,ly+bh,br); cx.lineTo(lx+bw,ly+bh-br);
  cx.arcTo(lx+bw,ly+bh,lx,ly+bh,br); cx.lineTo(lx+br,ly+bh);
  cx.arcTo(lx,ly+bh,lx,ly,br); cx.lineTo(lx,ly+br);
  cx.arcTo(lx,ly,lx+bw,ly,br); cx.closePath(); cx.fill();
  cx.fillStyle='#060e1a'; cx.textAlign='left'; cx.textBaseline='middle';
  cx.fillText(ac.callsign,lx+5,ly+bh/2);
  // 高度速度
  cx.font='10px Share Tech Mono'; cx.fillStyle='rgba(160,218,208,0.88)';
  cx.textBaseline='alphabetic';
  cx.fillText(Math.round(ac.altitude/100)*100+'ft',lx,ly+bh+11);
  cx.fillText(Math.round(ac.aSpd)+'kt',lx+56,ly+bh+11);
  cx.restore();
}

// Convert NM offset → ground canvas pixel (overlays air AC on SMR ground view)
// ARP is at roughly ground coordinate (RWY_LEN/2, 0) = runway midpoint
function nm2gCanvas(nx, ny){
  // NM座標（以ARP為原點）→ 圖片像素 → canvas像素
  const arpPxX = (DTHR06.x + THR24.x) / 2;  // ARP x 像素 ≈ 1275
  const arpPxY = RWY_Y;                        // ARP y 像素 = 跑道中心線
  const imgX = arpPxX + nx * 1852 * PX_PER_M;
  const imgY = arpPxY - ny * 1852 * PX_PER_M; // NM y正=北=圖片y減小
  return imgToCv(imgX, imgY);
}

function drawACsOnGround(){
  // Draw arriving/departing air aircraft on the ground SMR view
  Object.values(ACs).forEach(ac=>{
    if(isGnd(ac.cmdStep)) return; // ground AC drawn separately
    if(['DEP_APP'].includes(ac.cmdStep) && Math.abs(ac.ax)>18) return; // too far out
    const p = nm2gCanvas(ac.ax, ac.ay);
    // Only draw if within canvas bounds (with margin)
    if(p.x < -40 || p.x > cW+40 || p.y < -40 || p.y > cH+40) return;
    const isSel = ac.id===sel;
    const isArr = ['APPROACHING','INBOUND','SEQUENCING','FINAL_APPROACH'].includes(ac.cmdStep);
    const col = isSel?'#00c8be': isArr?'#5abeff':'#3ddc84';
    const sz = Math.max(GS*12, 4.5); // same as drawACGnd — prevents jump on transition; GS refreshed by getGS()
    // Speed vector trail
    const ang = ac.aHdg*Math.PI/180;
    for(let i=1;i<=4;i++){
      const tx=p.x - Math.sin(ang)*i*9, ty=p.y + Math.cos(ang)*i*9;
      cx.fillStyle=`rgba(90,190,255,${0.18-i*0.03})`;
      cx.beginPath(); cx.arc(tx,ty,3-i*0.4,0,Math.PI*2); cx.fill();
    }
    drawArrow(p.x, p.y, ac.aHdg, sz, col, isSel);
    // Label
    cx.save();
    cx.font='bold 10px Share Tech Mono';
    const tw2=cx.measureText(ac.callsign).width;
    const bx=p.x+sz*2+3, by=p.y-7, bw=tw2+8, bh=14, br=3;
    cx.fillStyle=isSel?'rgba(0,200,190,0.92)':'rgba(90,190,255,0.88)';
    cx.beginPath();
    cx.moveTo(bx+br,by); cx.lineTo(bx+bw-br,by);
    cx.arcTo(bx+bw,by,bx+bw,by+bh,br); cx.lineTo(bx+bw,by+bh-br);
    cx.arcTo(bx+bw,by+bh,bx,by+bh,br); cx.lineTo(bx+br,by+bh);
    cx.arcTo(bx,by+bh,bx,by,br); cx.lineTo(bx,by+br);
    cx.arcTo(bx,by,bx+bw,by,br); cx.closePath(); cx.fill();
    cx.fillStyle='#060e1a'; cx.textAlign='left'; cx.textBaseline='middle';
    cx.fillText(ac.callsign,bx+4,by+bh/2);
    // Alt+spd tag
    const altTxt=Math.round(ac.altitude/100)*100+'ft';
    cx.font='9px Share Tech Mono'; cx.fillStyle='rgba(160,218,208,0.85)';
    cx.textBaseline='alphabetic';
    cx.fillText(altTxt, bx, by+bh+10);
    cx.restore();
  });
}

function render(){ drawGround(); drawACsOnGround(); drawMinimap(); }

// ── 公用 minimap 繪圖核心（主畫面 & 彈出視窗共用）──
function drawMinimapTo(mc, W, H, doRoutes, doAC){
  const RANGE=30;
  const NM_MM = Math.min(W,H)*0.5/RANGE;
  // 左移、上移中心使CUBON（SE方向約32.5NM）可見於畫面右下
  const mox=W*0.34, moy=H*0.32;
  function mm2px(nx,ny){return{x:mox+nx*NM_MM, y:moy-ny*NM_MM};}

  // Background
  mc.fillStyle='#060e18'; mc.fillRect(0,0,W,H);

  // ── Range rings ──
  [5,10,15,20,25,30].forEach((r,i)=>{
    const bright=i%2===1;
    mc.strokeStyle=bright?'rgba(0,210,200,0.40)':'rgba(0,210,200,0.15)';
    mc.lineWidth=bright?0.8:0.4;
    mc.beginPath(); mc.arc(mox,moy,r*NM_MM,0,Math.PI*2); mc.stroke();
    if(bright){
      mc.fillStyle='rgba(0,220,210,0.60)'; mc.font='bold 7px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(r+'NM', mox+r*NM_MM+2, moy-2);
    }
  });

  // ── 跑道 + LOC延伸線 ──
  {
    const r06=mm2px(WPT.RWY06_DTHR.x, WPT.RWY06_DTHR.y);
    const r24=mm2px(WPT.RWY24_THR.x, WPT.RWY24_THR.y);
    mc.strokeStyle='rgba(200,220,200,0.80)'; mc.lineWidth=2.5;
    mc.beginPath(); mc.moveTo(r06.x,r06.y); mc.lineTo(r24.x,r24.y); mc.stroke();
    const sin63=Math.sin(63*Math.PI/180), cos63=Math.cos(63*Math.PI/180);
    const ext=12*NM_MM;
    mc.strokeStyle='rgba(0,200,190,0.20)'; mc.lineWidth=0.7; mc.setLineDash([5,5]);
    mc.beginPath(); mc.moveTo(r06.x,r06.y); mc.lineTo(r06.x-sin63*ext, r06.y+cos63*ext); mc.stroke();
    mc.beginPath(); mc.moveTo(r24.x,r24.y); mc.lineTo(r24.x+sin63*ext, r24.y-cos63*ext); mc.stroke();
    mc.setLineDash([]);
  }

  // ── TMA boundary（畫在航線下方）──
  const tma=[[-16,-7],[-5,-22],[30,-22],[30,8],[8,15],[-8,15],[-16,-7]];
  mc.strokeStyle='rgba(255,150,40,0.70)'; mc.lineWidth=1.1; mc.setLineDash([6,4]);
  mc.beginPath(); tma.forEach(([x,y],i)=>{const p=mm2px(x,y); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.closePath(); mc.stroke(); mc.setLineDash([]);
  const tmaLbl=mm2px(10,12); mc.fillStyle='rgba(255,150,40,0.75)'; mc.font='bold 7px Share Tech Mono'; mc.textAlign='left';
  mc.fillText('KINMEN TMA',tmaLbl.x,tmaLbl.y);

  if(doRoutes){
    const T06=[WPT.RWY06_DTHR.x, WPT.RWY06_DTHR.y];
    const T24=[WPT.RWY24_THR.x,  WPT.RWY24_THR.y];
    const R06=T06, R24=T24;

    // SID（離場，亮粉色）
    const mmSIDs=[
      {pts:[T06,[WPT.BS001.x,WPT.BS001.y],[WPT.INDIA.x,WPT.INDIA.y],[WPT.CUBON.x,WPT.CUBON.y]], col:'rgba(255,90,180,0.75)'},
      {pts:[T06,[WPT.SANDY.x,WPT.SANDY.y]], col:'rgba(255,90,180,0.58)'},
      {pts:[T24,[WPT.BS002.x,WPT.BS002.y],[WPT.CUBON.x,WPT.CUBON.y]], col:'rgba(255,90,180,0.65)'},
      {pts:[T24,[WPT.SANDY.x,WPT.SANDY.y]], col:'rgba(255,90,180,0.50)'},
    ];
    mmSIDs.forEach(({pts,col})=>{
      mc.strokeStyle=col; mc.lineWidth=0.9; mc.setLineDash([5,4]);
      mc.beginPath(); pts.forEach(([nx,ny],i)=>{const p=mm2px(nx,ny); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.stroke(); mc.setLineDash([]);
    });

    // STAR（進場，亮藍色）
    const mmSTARs=[
      {pts:[[WPT.SANDY.x,WPT.SANDY.y],[WPT.SPICA.x,WPT.SPICA.y]], col:'rgba(96,200,255,0.58)'},
      {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.SPICA.x,WPT.SPICA.y],[WPT.SKIRT.x,WPT.SKIRT.y],[WPT.FAP_06.x,WPT.FAP_06.y],R06], col:'rgba(96,200,255,0.75)'},
      {pts:[[WPT.AMTIK.x,WPT.AMTIK.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],R24], col:'rgba(96,200,255,0.58)'},
      {pts:[[WPT.CUBON.x,WPT.CUBON.y],[WPT.POSTY.x,WPT.POSTY.y],[WPT.MELOG.x,WPT.MELOG.y],[WPT.INDOK.x,WPT.INDOK.y],[WPT.FAP_24.x,WPT.FAP_24.y],R24], col:'rgba(96,200,255,0.58)'},
    ];
    mmSTARs.forEach(({pts,col})=>{
      mc.strokeStyle=col; mc.lineWidth=0.9; mc.setLineDash([3,5]);
      mc.beginPath(); pts.forEach(([nx,ny],i)=>{const p=mm2px(nx,ny); i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y);}); mc.stroke(); mc.setLineDash([]);
    });

    // ── Waypoints：AMTIK省略（與MELOG距離僅0.7NM，ASR上重疊）──
    const SHOW_WPT=['BS001','BS002','INDIA','CUBON','POSTY','SPICA','MELOG','SANDY','SKIRT','INDOK','FAP_06','FAP_24'];
    SHOW_WPT.forEach(nm=>{
      const wp=WPT[nm]; if(!wp) return;
      const p=mm2px(wp.x,wp.y);
      if(p.x<-10||p.x>W+10||p.y<-10||p.y>H+10) return;
      // 三角形符號
      mc.strokeStyle='rgba(0,220,205,0.85)'; mc.lineWidth=0.9;
      const s=3.5;
      mc.beginPath(); mc.moveTo(p.x,p.y-s); mc.lineTo(p.x+s,p.y+s); mc.lineTo(p.x-s,p.y+s); mc.closePath(); mc.stroke();
      // 名稱標籤
      mc.fillStyle='rgba(0,225,210,0.92)';
      mc.font='10px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(nm, p.x+5, p.y+4);
    });
  }

  // ── RCBS ARP crosshair ──
  const arp=mm2px(0,0);
  mc.strokeStyle='rgba(80,240,150,0.95)'; mc.lineWidth=1.2;
  mc.beginPath(); mc.arc(arp.x,arp.y,3.5,0,Math.PI*2); mc.stroke();
  mc.beginPath(); mc.moveTo(arp.x-9,arp.y); mc.lineTo(arp.x+9,arp.y); mc.moveTo(arp.x,arp.y-9); mc.lineTo(arp.x,arp.y+9); mc.stroke();
  mc.fillStyle='rgba(80,240,150,0.95)'; mc.font='bold 10px Share Tech Mono';
  mc.textAlign='left'; mc.fillText('RCBS',arp.x+6,arp.y+14);

  // ── Aircraft blips ──
  if(doAC){
    Object.values(ACs).forEach(ac=>{
      const isAir=!isGnd(ac.cmdStep);
      if(!isAir) return;
      const isArr=['APPROACHING','INBOUND','SEQUENCING','FINAL_APPROACH'].includes(ac.cmdStep);
      const isSel=ac.id===sel;
      const p=mm2px(ac.ax,ac.ay);
      if(p.x<-8||p.x>W+8||p.y<-8||p.y>H+8) return;
      const col=isSel?'rgba(0,200,190,1)':isArr?'rgba(126,207,255,0.95)':'rgba(61,220,132,0.95)';
      const r=3.5;
      if(isSel){
        mc.strokeStyle='rgba(0,200,190,0.7)'; mc.lineWidth=1;
        mc.beginPath(); mc.arc(p.x,p.y,r+3,0,Math.PI*2); mc.stroke();
      }
      mc.fillStyle=col; mc.beginPath(); mc.arc(p.x,p.y,r,0,Math.PI*2); mc.fill();
      const vrad=ac.aHdg*Math.PI/180;
      mc.strokeStyle=col; mc.lineWidth=0.9;
      mc.beginPath(); mc.moveTo(p.x,p.y); mc.lineTo(p.x+Math.sin(vrad)*10, p.y-Math.cos(vrad)*10); mc.stroke();
      mc.fillStyle=col; mc.font='bold 9px Share Tech Mono'; mc.textAlign='left';
      mc.fillText(ac.callsign, p.x+r+3, p.y+3);
      mc.fillStyle='rgba(180,235,225,0.85)'; mc.font='8px Share Tech Mono';
      mc.fillText(Math.round(ac.altitude/100)*100+'ft', p.x+r+3, p.y+13);
    });
  }
}

function drawMinimap(){
  if(!mmCx||!mmW||!mmH) return;
  drawMinimapTo(mmCx, mmW, mmH, showRoutes, showAC);
}

// ══════════════════════════════════════
// GAME LOGIC
// ══════════════════════════════════════
let lastT=0;
function update(rdt){
  gTime+=rdt;
  Object.values(ACs).forEach(ac=>upAC(ac,rdt));
}
function upAC(ac,dt){
  ac.waitTimer+=dt;

  switch(ac.cmdStep){

    // 停機坪等待，飛行員主動請求出發許可
    case 'WAIT_REQ':
      if(!ac.pilotCalled && ac.waitTimer>18){
        ac.pilotCalled=true;
        qC([{seat:'AC',cs:ac.callsign,
          msg:PHR.AC.REQ_CLR(ac.callsign,ac.gate,ac.destination,ac.fl),type:'ac'}],
          ()=>{
            ac.cmdStep='WAIT_CLR';
            ac.reqFlash=true;
            updateUI();
          });
      }
      break;

    // 已頒出發許可，等玩家按後推
    case 'WAIT_CLR':
    case 'WAIT_PBK':
      break;

    // 已後推，等玩家選跑道
    case 'WAIT_RWY':
      break;

    // 滑行中（後推+轉彎+前進至等待點）
    case 'TAXIING':
      moveTaxi(ac,dt);
      // 到達滑行路線終點後進入跑道外等待
      if(ac.taxiIdx>=ac.taxiRoute.length){
        ac.cmdStep='WAIT_ENTRY';
        ac.reqFlash=true;
        updateUI();
      }
      break;

    // 在跑道外等待點，等玩家選擇進入跑道/等待
    case 'WAIT_ENTRY':
      break;

    // 已進入跑道，等待起飛許可
    case 'WAIT_LINEUP':
      if(!ac.pilotCalled2 && ac.waitTimer>8){
        ac.pilotCalled2=true;
        ac.reqFlash=true;
        qC([{seat:'AC',cs:ac.callsign,
          msg:PHR.AC.READY(ac.callsign,ac.assignedRwy),type:'ac'}],
          ()=>{ updateUI(); });
      }
      break;

    case 'TAKEOFF_ROLL': {
      const perf = getPerf(ac);
      // 速度單位：px/s（liftoff kt × PX_PER_M ≈ px/s，近似 kt→m/s 後乘比例尺）
      const maxSpd = perf.spd_liftoff * PX_PER_M * 0.5144; // kt→px/s
      const accelRate = (14 + (ac.gSpd / maxSpd) * 22) * PX_PER_M * 0.5144;
      ac.gSpd = Math.min(ac.gSpd + accelRate * dt, maxSpd);
      ac.rwyRollDist += ac.gSpd * dt; // px
      const rwyStartX = ac.assignedRwy==='06' ? DTHR06.x+30 : THR24.x-30;
      const availRoll = ac.assignedRwy==='06'
        ? (THR24.x - rwyStartX)     // px
        : (rwyStartX - DTHR06.x);   // px
      if(ac.rwyRollDist >= availRoll * 0.70){
        ac.cmdStep='AIRBORNE_CLIMB';
        ac.onRwy=false;
        const rwyHdg = ac.assignedRwy==='06' ? 63 : 243;
        const arpPxX = (DTHR06.x + THR24.x) / 2;
        const liftPxX = ac.assignedRwy==='06'
          ? (rwyStartX + ac.rwyRollDist)
          : (rwyStartX - ac.rwyRollDist);
        ac.ax = (liftPxX - arpPxX) / PX_PER_M / 1852; // px→m→NM
        ac.ay = 0;
        ac.aHdg = rwyHdg;
        ac.aSpd = perf.spd_liftoff;
        ac.altitude = 80;
        ac.targetAlt = ac.fl*100 || 18000;
        ac.targetHdg = rwyHdg;
        ac.holdRwyHdg = true;
        ac.airRouteIdx = 0;
        qC([
          {seat:'TWR',cs:ac.callsign,msg:PHR.TWR.AIRBORNE(ac.callsign),type:'atc'},
          {seat:'AC', cs:ac.callsign,msg:PHR.AC.WILCO('離場，'+ac.callsign+'，再見'),type:'ac'},
        ],()=>{ ac.reqFlash=true; ac.handoffPending=true; updateUI(); });
        setMsg(ac.callsign+' 離地');
      }
      break;
    }

    // 空中爬升，等交接塔台→進近
    case 'AIRBORNE_CLIMB':
      moveAir(ac,dt);
      break;

    // RWY06 起飛前在 DTHR 迴轉（gHdg 270→90）
    case 'TURNING_06': {
      const turnSpd = 45; // deg/s
      let diff = 90 - ac.gHdg;
      while(diff > 180) diff -= 360; while(diff < -180) diff += 360;
      if(Math.abs(diff) < turnSpd*dt){
        ac.gHdg = 90;
        ac.cmdStep = 'TAKEOFF_ROLL';
        ac.gSpd = 0;
      } else {
        ac.gHdg = (ac.gHdg + Math.sign(diff)*turnSpd*dt + 360) % 360;
      }
      break;
    }

    // 進入跑道頭的最後一段滑行
    case 'TAXIING_TO_RWY':
      moveTaxi(ac,dt);
      break;

    // 進場相關
    case 'INBOUND': case 'SEQUENCING':
      // 若 waitTimer 為負，飛機尚未出現，保持靜止
      if(ac.waitTimer < 0) break;
      moveAir(ac,dt);
      // 進場中首次呼叫高雄進近
      if(!ac.pilotCalled && ac.cmdStep==='INBOUND' && ac.waitTimer>5){
        ac.pilotCalled=true;
        const distNM=Math.round(Math.sqrt(ac.ax*ac.ax+ac.ay*ac.ay));
        const alt=Math.round(ac.altitude/100)*100;
        let nearWpt='進場中';
        if(ac.airRoute && ac.airRoute.length>0 && ac.airRouteIdx<ac.airRoute.length){
          nearWpt=ac.airRoute[ac.airRouteIdx].name||'進場中';
        }
        qC([{seat:'AC',cs:ac.callsign,
          msg:`高雄進近，${ac.callsign}，${nearWpt}報告，距場${distNM}浬，高度${alt}呎，請求ILS進場`,
          type:'ac'}],()=>{ac.reqFlash=true; updateUI();});
      }
      break;

    // APPROACHING：飛機從畫面外飛向CUBON，期間顯示跑道選項
    case 'APPROACHING':
      if(ac.waitTimer < 0) break;
      // 持續將航向指向CUBON
      {
        const dx = WPT.CUBON.x - ac.ax;
        const dy = WPT.CUBON.y - ac.ay;
        ac.targetHdg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
      }
      moveAir(ac, dt);
      // 第一次出現在雷達上：APP發雷達識別通話，顯示REQ讓玩家選跑道
      if(!ac.pilotCalled && ac.waitTimer > 2){
        ac.pilotCalled = true;
        ac.reqFlash = true;
        const distNM = Math.round(Math.sqrt(ac.ax*ac.ax + ac.ay*ac.ay));
        const alt = Math.round(ac.altitude/100)*100;
        qC([
          {seat:'AC', cs:ac.callsign,
           msg:`高雄進近，${ac.callsign}，距場${distNM}浬，高度${alt}呎，請求進場`,
           type:'ac'},
          {seat:'APP',cs:ac.callsign,
           msg:`${ac.callsign}，高雄進近，雷達識別，請確認進場跑道`,
           type:'atc'},
        ],()=>{ updateUI(); });
        updateUI();
      }
      // 超時自動指派RWY06（60遊戲秒內未選），APP發通知
      if(!ac.rwyAssigned && ac.waitTimer > 60){
        ac.assignedRwy = '06';
        ac.rwyAssigned = true;
        ac.pendingArrRoute = 'CUBON-1C-06';
        qC([
          {seat:'APP',cs:ac.callsign,
           msg:`${ac.callsign}，預設指派ILS跑道06，CUBON 1C進場`,
           type:'atc'},
          {seat:'AC', cs:ac.callsign,
           msg:`ILS跑道06，CUBON 1C，${ac.callsign}`,
           type:'ac'},
        ],null);
      }
      // 抵達CUBON附近 → 切換為INBOUND，設定航路
      {
        const dx = WPT.CUBON.x - ac.ax;
        const dy = WPT.CUBON.y - ac.ay;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 1.5){
          const routeKey = ac.pendingArrRoute || 'CUBON-1C-06';
          ac.airRoute = [...(ARR_ROUTES[routeKey] || [])];
          ac.airRouteIdx = 0;
          ac.holdRwyHdg = false;
          ac.cmdStep = 'INBOUND';
          ac.reqFlash = false;
          updateUI();
        }
      }
      break;

    // 已移交高雄進近的離場飛機（TMA內，等待移交台北ACC）
    case 'DEP_APP':
      moveAir(ac,dt);
      // 飛完SID終點（CUBON等）後，APP發移交台北ACC訊息，然後消失
      if(ac.airRouteIdx >= ac.airRoute.length && !ac.accHandoffDone){
        ac.accHandoffDone=true;
        qC([
          {seat:'APP',cs:ac.callsign,msg:`${ac.callsign}，聯繫台北管制，再見`,type:'atc'},
          {seat:'AC', cs:ac.callsign,msg:`台北管制，${ac.callsign}，再見`,type:'ac'},
        ],()=>{
          // 短暫延遲後移除
          setTimeout(()=>{
            delete ACs[ac.id];
            if(sel===ac.id){sel=null; updateUI();}
          }, 3000);
        });
      }
      break;

    case 'FINAL_APPROACH':
      moveAir(ac,dt);
      if(ac.clearedILS){
        const rwy = ac.assignedRwy||'06';
        // 觸地：飛機接近跑道入口且高度低於 200ft
        const thrNM = rwy==='06' ? WPT.RWY06_DTHR : WPT.RWY24_THR;
        const distToThr = Math.sqrt((ac.ax-thrNM.x)**2+(ac.ay-thrNM.y)**2);
        if(distToThr < 0.5 && ac.altitude < 200){
          ac.cmdStep='LANDED';
          ac.onRwy=true;
          ac.gx = rwy==='06' ? THR24.x-80 : DTHR06.x+80;
          ac.gy = RWY_Y;
          ac.gHdg = rwy==='06' ? 270 : 90;
          ac.gSpd = 8;
          ac.altitude = 0;
          qC([
            {seat:'TWR',cs:ac.callsign,msg:PHR.TWR.VACATE(ac.callsign,'TWY A'),type:'atc'},
            {seat:'AC', cs:ac.callsign,msg:`脫離跑道，聯繫地面，${ac.callsign}`,type:'ac'},
          ],()=>{ updateUI(); });
          setMsg(ac.callsign+' 落地');
          updateUI();
        }
      }
      break;

    case 'LANDED':
      // 落地後滑行至停機坪後移除
      ac.gSpd=8;
      ac.waitTimer+=dt;
      if(ac.waitTimer>12){
        delete ACs[ac.id];
        if(sel===ac.id){sel=null; updateUI();}
      }
      break;
  }
}

function moveTaxi(ac,dt){
  if(ac.taxiIdx>=ac.taxiRoute.length) return;
  const tgt=ac.taxiRoute[ac.taxiIdx];
  const dx=tgt.x-ac.gx, dy=tgt.y-ac.gy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  // gSpd 單位 m/s，座標為像素；移動量 = gSpd * dt * PX_PER_M
  const spd=(ac.gSpd||5) * PX_PER_M;
  if(dist<Math.max(spd*dt*1.5, 1.5)){
    ac.gx=tgt.x; ac.gy=tgt.y; ac.taxiIdx++;
  } else {
    ac.gx+=dx/dist*spd*dt;
    ac.gy+=dy/dist*spd*dt;
    if(!tgt.isPushback){
      // 圖片座標：+x向右(東)，+y向下(南)，北=上=y減小
      let targetHdg=Math.atan2(dx, -dy)*180/Math.PI;
      if(targetHdg<0) targetHdg+=360;
      let diff=targetHdg-ac.gHdg;
      while(diff>180)diff-=360; while(diff<-180)diff+=360;
      const maxTurn=120*dt;
      if(Math.abs(diff)<maxTurn) ac.gHdg=targetHdg;
      else ac.gHdg=(ac.gHdg+Math.sign(diff)*maxTurn+360)%360;
    }
  }
}
function moveAir(ac,dt){
  const perf = getPerf(ac);

  // ── 1. 600ft 前維持跑道航向 ──
  if(ac.holdRwyHdg){
    if(ac.altitude >= 600){
      ac.holdRwyHdg = false;
    } else {
      const rwyHdg = ac.assignedRwy==='06' ? 63 : 243;
      ac.targetHdg = rwyHdg;
    }
  }

  // ── 2. airRoute 航點循跡 ──
  if(!ac.holdRwyHdg && ac.airRoute && ac.airRouteIdx < ac.airRoute.length){
    const wpt = ac.airRoute[ac.airRouteIdx];
    const dx = wpt.x - ac.ax, dy = wpt.y - ac.ay;
    const distNM = Math.sqrt(dx*dx + dy*dy);

    if(wpt.spdMax && ac.aSpd > wpt.spdMax) ac.aSpd = wpt.spdMax;
    if(wpt.altTarget !== undefined) ac.targetAlt = wpt.altTarget;

    let hdgToWpt = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;

    // 在 FAP（最後進場點）後 → 維持 ILS 航向，不直飛座標
    if(wpt.isFF && ac.clearedILS){
      hdgToWpt = ac.assignedRwy==='06' ? 67 : 247;
    }
    // 已過 FAP 正在飛向 THR → 維持 ILS 航向
    if(wpt.isTHR && ac.clearedILS){
      hdgToWpt = ac.assignedRwy==='06' ? 67 : 247;
    }
    // 名稱確認（FAP_06 / FAP_24）
    if((wpt.name==='FAP_06' || wpt.name==='RWY06') && ac.clearedILS) hdgToWpt = 67;
    if((wpt.name==='FAP_24' || wpt.name==='RWY24') && ac.clearedILS) hdgToWpt = 247;

    ac.targetHdg = hdgToWpt;

    const captureR = wpt.isTHR ? 0.4 : (wpt.isFF ? 0.5 : 0.8);
    if(distNM < captureR) ac.airRouteIdx++;
  }

  // ── 3. 平滑轉向 ──
  if(ac.targetHdg !== null && ac.targetHdg !== undefined){
    let d = ac.targetHdg - ac.aHdg;
    while(d > 180) d -= 360; while(d < -180) d += 360;
    const maxTurn = perf.turn_rate * dt;
    if(Math.abs(d) < maxTurn) ac.aHdg = ac.targetHdg;
    else ac.aHdg = (ac.aHdg + Math.sign(d)*maxTurn + 360) % 360;
  }

  // ── 4. 高度管理（從 AC_PERF 取值）──
  if(ac.targetAlt !== undefined){
    const altDiff = ac.targetAlt - ac.altitude;
    let vs;
    if(ac.cmdStep === 'FINAL_APPROACH') vs = perf.vs_final / 60;
    else if(altDiff > 0)                vs = perf.vs_climb  / 60;
    else                                vs = perf.vs_desc   / 60;
    if(Math.abs(altDiff) < vs*dt) ac.altitude = ac.targetAlt;
    else ac.altitude += Math.sign(altDiff) * vs * dt;
  }

  // ── 5. 速度管理（從 AC_PERF 取值）──
  if(ac.cmdStep==='AIRBORNE_CLIMB'||ac.cmdStep==='DEP_APP'){
    const tgt = ac.altitude > 10000 ? perf.spd_cruise : perf.spd_climb;
    if(ac.aSpd < tgt) ac.aSpd = Math.min(ac.aSpd + 5*dt, tgt);
  } else if(ac.cmdStep==='INBOUND'||ac.cmdStep==='SEQUENCING'||ac.cmdStep==='APPROACHING'){
    if(ac.aSpd > perf.spd_approach) ac.aSpd = Math.max(ac.aSpd - 3*dt, perf.spd_approach);
  } else if(ac.cmdStep==='FINAL_APPROACH'){
    const tgt = ac.clearedILS ? perf.spd_land : perf.spd_approach;
    if(ac.aSpd > tgt) ac.aSpd = Math.max(ac.aSpd - 4*dt, tgt);
    else              ac.aSpd = Math.min(ac.aSpd + 2*dt, tgt);
  }

  // ── 6. 位置更新 ──
  const rad = ac.aHdg * Math.PI / 180;
  const nms = ac.aSpd / 3600;
  ac.ax += Math.sin(rad) * nms * dt;
  ac.ay += Math.cos(rad) * nms * dt;
}

// ══════════════════════════════════════
// ATC PHRASE LIBRARY (realistic)
// ══════════════════════════════════════
const PHR={
  DEL:{
    CLEARANCE:(cs,dest,fl,sid,sq)=>
      `${cs}，出發許可，目的地${dest}，飛行計畫航路，爬升至飛行高度層${fl}，離場程序${sid}，應答機${sq}，離地後聯繫塔台`,
    READBACK:(cs,dest,fl,sid,sq)=>
      `出發許可，目的地${dest}，FL${fl}，${sid}，應答機${sq}，${cs}`,
  },
  GND:{
    PUSHBACK:(cs,gate,face)=>
      `${cs}，後推許可，由${gate}機坪後推，面向${face}`,
    PUSHBACK_READBACK:(cs,gate)=>
      `後推，面向東，${gate}機坪，${cs}`,
    TAXI:(cs,twy,hold,rwy)=>
      `${cs}，地面許可，沿${twy}滑行，跑道${rwy}，${hold}等待點`,
    TAXI_READBACK:(cs,twy,hold,rwy)=>
      `${twy}，${hold}，跑道${rwy}，${cs}`,
    HOLD:(cs)=>`${cs}，原地等待`,
    HOLD_RB:(cs)=>`等待，${cs}`,
    RESUME:(cs,twy)=>`${cs}，繼續沿${twy}滑行`,
    RESUME_RB:(cs)=>`繼續，${cs}`,
  },
  TWR:{
    LINEUP:(cs,rwy)=>
      `${cs}，跑道${rwy}，進跑道並等待`,
    LINEUP_RB:(cs,rwy)=>
      `進跑道等待，跑道${rwy}，${cs}`,
    TAKEOFF:(cs,rwy,wind)=>
      `${cs}，跑道${rwy}，地面風${wind}，可以起飛`,

    LAND:(cs,rwy,wind)=>
      `${cs}，跑道${rwy}，地面風${wind}，降落許可`,
    LAND_RB:(cs,rwy)=>

    GOAROUND:(cs)=>
      `${cs}，重飛，重飛，上升至3000呎，保持跑道航向，聯繫進近`,
    GOAROUND_RB:(cs)=>

    AIRBORNE:(cs)=>
      `${cs}，離地，繼續爬升，聯繫高雄進近124.6，再見`,

  },
  AC:{
    WILCO:(msg)=>`${msg}`,
    READY:(cs,rwy)=>`管制，${cs}，在跑道${rwy}，等候起飛`,
    REQ_CLR:(cs,gate,dest,fl)=>
      `金門地面，${cs}，${gate}機坪，請求出發許可，目的地${dest}，申請飛行高度層${fl}`,
  },
};
const W_=()=>String(wind.dir).padStart(3,'0')+'°/'+wind.spd+'KT';
const SQ=()=>Math.floor(Math.random()*6000+1000).toString();

// ══════════════════════════════════════
// COMMANDS
// ══════════════════════════════════════
function getCmds(ac){
  if(!ac) return [];
  switch(ac.cmdStep){
    case 'WAIT_REQ':   return [];
    case 'WAIT_CLR':   return [{l:'出發許可 CLR',a:'CLR',seat:'GND'}];
    case 'WAIT_PBK':   return [
      {l:'後推 PBK',a:'PBK',seat:'GND'},
    ];
    case 'WAIT_RWY':   return [
      {l:'跑道 06',a:'RWY06',seat:'GND',rwy:'06'},
      {l:'跑道 24',a:'RWY24',seat:'GND',rwy:'24'},
      {l:'取消',   a:'CANCEL_RWY',seat:'GND'},
    ];
    case 'TAXIING':    return [{l:'停止 HLD',a:'HLD',seat:'GND'}];
    // ── 三選項：入口外等待、入口等待（跑道外）、進跑道等待 ──
    case 'WAIT_ENTRY': return [
      {l:'許可起飛 T/O',  a:'TOF',        seat:'TWR'},
      {l:'入口等待 EWY',  a:'HOLD_ENTRY', seat:'TWR'},
      {l:'進跑道等待 LUP',a:'LUP',        seat:'TWR'},
    ];
    // 入口等待後：保留三個選項（玩家仍可隨時下其他指令）
    case 'AT_ENTRY': return [
      {l:'許可起飛 T/O',  a:'TOF',        seat:'TWR'},
      {l:'入口等待 EWY',  a:'HOLD_ENTRY', seat:'TWR'},
      {l:'進跑道等待 LUP',a:'LUP',        seat:'TWR'},
    ];
    // 跑道內等待後：僅保留許可起飛
    case 'WAIT_LINEUP': return [{l:'許可起飛 T/O',a:'TOF',seat:'TWR'}];
    case 'AIRBORNE_CLIMB': return ac.handoffPending?[{l:'移交進近 →APP',a:'HANDOFF',seat:'TWR'}]:[];
    case 'DEP_APP':        return []; // 高雄進近管轄中，等待自動移交台北ACC
    // ── APPROACHING：飛往CUBON途中，選擇跑道（高雄進近） ──
    case 'APPROACHING': return [
      {l:'指派 RWY06',a:'ASSIGN06',seat:'APP',rwy:'06'},
      {l:'指派 RWY24',a:'ASSIGN24',seat:'APP',rwy:'24'},
    ];
    // ── 進場指令（高雄進近管） ──
    case 'INBOUND':    return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:'APP'},
      {l:'ILS許可 RWY24',a:'ILS24',seat:'APP'},
      {l:'向量引導',      a:'VEC',  seat:'APP'},
    ];
    case 'SEQUENCING': return [
      {l:'ILS許可 RWY06',a:'ILS06',seat:'APP'},
      {l:'ILS許可 RWY24',a:'ILS24',seat:'APP'},
      {l:'向量引導',      a:'VEC',  seat:'APP'},
    ];
    case 'FINAL_APPROACH':
      // 未下降落許可：顯示降落許可與重飛（塔台管）
      if(!ac.landingCleared) return [
        {l:'降落許可',a:'LND',seat:'TWR'},
        {l:'重飛',    a:'GAR',seat:'TWR'},
      ];
      // 已下降落許可：只剩重飛
      return [{l:'重飛',a:'GAR',seat:'TWR'}];
    default: return [];
  }
}

function execCmd(ac,a){
  const cs=ac.callsign;

  switch(a){
    case 'CLR': {
      // SID 依確認跑道決定（若跑道未選，預設 RWY06）
      const rwy = ac.assignedRwy || '06';
      const sidName = rwy==='24' ? 'CUBON 1B' : 'CUBON 1A';
      ac.sid = sidName;
      ac.airRoute = SID_ROUTES[sidName] ? [...SID_ROUTES[sidName]] : [];
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = true;
      const sq=SQ();
      qC([
        {seat:'GND',cs,msg:PHR.DEL.CLEARANCE(cs,ac.destination,ac.fl,sidName,sq),type:'atc'},
        {seat:'AC', cs,msg:PHR.DEL.READBACK(cs,ac.destination,ac.fl,sidName,sq),type:'ac'},
      ],()=>{ ac.cmdStep='WAIT_PBK'; ac.reqFlash=true; updateUI(); });
      ac.reqFlash=false;
      break;
    }

    case 'PBK':
      // 先靜默進入跑道選擇狀態，不發通話；跑道選定後一併發出後推+滑行指令
      ac.cmdStep='WAIT_RWY';
      ac.reqFlash=true;
      updateUI();
      break;

    case 'RWY06':
    case 'RWY24': {
      const rwy=a==='RWY06'?'06':'24';
      ac.assignedRwy=rwy;
      ac.reqFlash=false;
      const holdPt=rwy==='06'?HOLD_06:HOLD_24;
      const face=rwy==='06'?'東':'西';
      // 一次發出後推+滑行指令（合併為真實程序）
      qC([
        {seat:'GND',cs,msg:PHR.GND.PUSHBACK(cs,ac.gate,face),type:'atc'},
        {seat:'AC', cs,msg:PHR.GND.PUSHBACK_READBACK(cs,ac.gate),type:'ac'},
        {seat:'GND',cs,msg:PHR.GND.TAXI(cs,'TWY N',holdPt.label,rwy),type:'atc'},
        {seat:'AC', cs,msg:PHR.GND.TAXI_READBACK(cs,'TWY N',holdPt.label,rwy),type:'ac'},
      ],()=>{ ac.cmdStep='TAXIING'; updateUI(); });
      // 立即開始後推動畫（速度：px/s，後推約4kt≈5px/s，滑行約15kt≈12px/s）
      ac.taxiRoute=buildTaxiRoute(ac, holdPt);
      ac.taxiIdx=0; ac.gSpd=5;
      ac.cmdStep='TAXIING';
      break;
    }

    case 'CANCEL_RWY':
      // 取消，回到後推待命狀態
      ac.cmdStep='WAIT_PBK';
      ac.reqFlash=false;
      updateUI();
      break;

    case 'HLD':
      ac.taxiIdx=ac.taxiRoute.length; // 停在原地
      setMsg(cs+' 停止');
      break;

    case 'HOLD_ENTRY':
      // 入口等待：停在入口外，保持三個選項（AT_ENTRY 狀態）
      qC([
        {seat:'TWR',cs,msg:`${cs}，跑道${ac.assignedRwy}入口等待`,type:'atc'},
        {seat:'AC', cs,msg:`入口等待，跑道${ac.assignedRwy}，${cs}`,type:'ac'},
      ],()=>{ ac.cmdStep='AT_ENTRY'; updateUI(); });
      setMsg(cs+' 入口等待');
      break;

    case 'LUP': {
      const rwy=ac.assignedRwy||'06';
      const rwyX = rwy==='06' ? DTHR06.x+30 : THR24.x-30;
      qC([
        {seat:'TWR',cs,msg:PHR.TWR.LINEUP(cs,rwy),type:'atc'},
        {seat:'AC', cs,msg:PHR.TWR.LINEUP_RB(cs,rwy),type:'ac'},
      ],()=>{
        ac.taxiRoute=[{x:rwyX, y:RWY_Y}];
        ac.taxiIdx=0; ac.gSpd=5;
        ac.cmdStep='TAXIING_TO_RWY';
        updateUI();
        const chkLUP=setInterval(()=>{
          if(ac.taxiIdx>=ac.taxiRoute.length){
            clearInterval(chkLUP);
            ac.gx=rwyX; ac.gy=RWY_Y;
            ac.gHdg = rwy==='06' ? 270 : 90; // 朝跑道方向停等
            ac.onRwy=true; ac.rwyRollDist=0;
            ac.cmdStep='WAIT_LINEUP';
            ac.waitTimer=0; ac.pilotCalled2=false;
            updateUI();
          }
        },200);
      });
      setMsg(cs+' 進跑道等待');
      break;
    }

    case 'TOF': {
      const rwy=ac.assignedRwy||'06';
      qC([
        {seat:'TWR',cs,msg:PHR.TWR.TAKEOFF(cs,rwy,W_()),type:'atc'},
        {seat:'AC', cs,msg:PHR.TWR.TAKEOFF_RB(cs,rwy),type:'ac'},
      ],null);
      ac.reqFlash=false;

      if(rwy==='06'){
        // RWY06：先從 H-D 滑入跑道 → 向西滑至 DTHR → 小迴轉 → 向東起飛
        // 步驟①：進入跑道，停在 DTHR 附近（x=DTHR06.x+30, y=RWY_Y）
        const dthrX = DTHR06.x + 30;
        ac.taxiRoute=[
          {x: CONN.D, y: RWY_Y},       // 從H-D沿連接道進入跑道
          {x: dthrX,  y: RWY_Y},       // 向西滑至DTHR
        ];
        ac.taxiIdx=0; ac.gSpd=6;
        ac.cmdStep='TAXIING_TO_RWY';
        const chk06=setInterval(()=>{
          if(ac.taxiIdx>=ac.taxiRoute.length){
            clearInterval(chk06);
            // 小迴轉動畫：gHdg 從 270 轉到 90（向東），用 TURNING_06 狀態
            ac.gx=dthrX; ac.gy=RWY_Y;
            ac.gHdg=270; ac.gSpd=0;
            ac.onRwy=true; ac.rwyRollDist=0;
            ac.cmdStep='TURNING_06';
            ac.waitTimer=0;
            updateUI();
          }
        },100);
      } else {
        // RWY24：直接從 H-A 進入跑道東端，向西起飛
        const rwyX = THR24.x - 50;
        ac.taxiRoute=[
          {x: CONN.A,  y: RWY_Y},
          {x: rwyX,    y: RWY_Y},
        ];
        ac.taxiIdx=0; ac.gSpd=7;
        ac.cmdStep='TAXIING_TO_RWY';
        const chk24=setInterval(()=>{
          if(ac.taxiIdx>=ac.taxiRoute.length){
            clearInterval(chk24);
            ac.gx=rwyX; ac.gy=RWY_Y;
            ac.gHdg=270; ac.onRwy=true; ac.rwyRollDist=0; ac.gSpd=0;
            ac.taxiRoute=[]; ac.taxiIdx=0;
            ac.cmdStep='TAKEOFF_ROLL';
            updateUI();
          }
        },100);
      }
      break;
    }

    // ── 指派進場跑道（APPROACHING狀態）──
    case 'ASSIGN06':
    case 'ASSIGN24': {
      const rwy = a==='ASSIGN24' ? '24' : '06';
      const routeKey = rwy==='06' ? 'CUBON-1C-06' : 'CUBON-2D-24';
      const starName = rwy==='06' ? 'CUBON 1C' : 'CUBON 2D';
      ac.assignedRwy = rwy;
      ac.rwyAssigned = true;
      ac.reqFlash = false;
      ac.pendingArrRoute = routeKey;
      qC([
        {seat:'APP',cs,msg:`${cs}，許可ILS跑道${rwy}進場，${starName}，下降並維持8000呎`,type:'atc'},
        {seat:'AC', cs,msg:`ILS跑道${rwy}，${starName}，下降8000呎，${cs}`,type:'ac'},
      ],()=>{ updateUI(); });
      updateUI();
      break;
    }

        case 'HANDOFF':
      // 塔台移交高雄進近（離場）
      qC([
        {seat:'TWR',cs,msg:`${cs}，聯繫高雄進近124.6，再見`,type:'atc'},
        {seat:'AC', cs,msg:PHR.AC.WILCO(`高雄進近124.6，${cs}，再見`),type:'ac'},
      ],()=>{
        ac.cmdStep='DEP_APP';
        ac.handoffPending=false;
        ac.reqFlash=false;
        updateUI();
      });
      setMsg(cs+' 已移交高雄進近 124.6');
      break;

    // ── 進場指令（高雄進近管） ──
    case 'D4K':
      qC([{seat:'APP',cs,msg:PHR.APP.CONTACT(cs,'4000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'4000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=4000; ac.cmdStep='SEQUENCING';}); break;
    case 'D2K':
      qC([{seat:'APP',cs,msg:PHR.APP.CONTACT(cs,'2000',Math.round(ac.aHdg)),type:'atc'},
          {seat:'AC', cs,msg:PHR.APP.CONTACT_RB(cs,'2000',Math.round(ac.aHdg)),type:'ac'}],
        ()=>{ac.targetAlt=2000; ac.cmdStep='SEQUENCING';}); break;
    case 'ILS06':
    case 'ILS24':
    case 'ILS': {
      const ilsRwy = a==='ILS24' ? '24' : '06';
      ac.assignedRwy = ilsRwy;

      // 選擇進場路線：依飛機目前位置選最近 IAF
      let routeKey;
      if(ilsRwy==='06'){
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-1C-06' : 'ILS-SANDY-06';
      } else {
        const distToCubon = Math.sqrt((ac.ax-WPT.CUBON.x)**2+(ac.ay-WPT.CUBON.y)**2);
        routeKey = distToCubon < 10 ? 'CUBON-2D-24' : 'ILS-AMTIK-24';
      }

      // 從距飛機最近的剩餘航點開始
      const fullRoute = [...(ARR_ROUTES[routeKey] || [])];
      let startIdx = 0, minDist = Infinity;
      fullRoute.forEach((wpt,i)=>{
        if(wpt.isTHR) return;
        const d = Math.sqrt((ac.ax-wpt.x)**2+(ac.ay-wpt.y)**2);
        if(d < minDist){ minDist=d; startIdx=i; }
      });
      ac.airRoute = fullRoute.slice(startIdx);
      ac.airRouteIdx = 0;
      ac.holdRwyHdg = false;

      // APP發ILS許可，並在readback後自動移交金門塔台
      qC([
        {seat:'APP',cs,msg:PHR.APP.ILS(cs,ilsRwy,'2000'),type:'atc'},
        {seat:'AC', cs,msg:PHR.APP.ILS_RB(cs,ilsRwy),type:'ac'},
        {seat:'APP',cs,msg:`${cs}，聯繫金門塔台118.0，再見`,type:'atc'},
        {seat:'AC', cs,msg:`金門塔台118.0，${cs}，再見`,type:'ac'},
      ],()=>{
        ac.cmdStep='FINAL_APPROACH';
        ac.clearedILS=true;
        ac.aSpd=155;
        // 飛機呼叫塔台建立最後進場
        setTimeout(()=>{
          qC([{seat:'AC',cs,
            msg:`金門塔台，${cs}，ILS跑道${ilsRwy}，最後進場，請求降落許可`,
            type:'ac'}],()=>{ac.reqFlash=true; updateUI();});
        }, 800);
        updateUI();
      });
      break;
    }
    case 'LND':
      ac.landingCleared=true;
      qC([{seat:'TWR',cs,msg:PHR.TWR.LAND(cs,ac.assignedRwy||'06',W_()),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.LAND_RB(cs,ac.assignedRwy||'06'),type:'ac'}],
        ()=>{ updateUI(); }); break;
    case 'GAR':
      qC([{seat:'TWR',cs,msg:PHR.TWR.GOAROUND(cs),type:'atc'},
          {seat:'AC', cs,msg:PHR.TWR.GOAROUND_RB(cs),type:'ac'}],
        ()=>{ac.cmdStep='SEQUENCING';ac.clearedILS=false;ac.targetAlt=3000;ac.aSpd=200;}); break;
    case 'VEC': {
      const nh=Math.round((ac.aHdg+30)%360);
      qC([{seat:'APP',cs,msg:PHR.APP.VECTOR(cs,nh,'排序間距'),type:'atc'},
          {seat:'AC', cs,msg:PHR.AC.WILCO(`航向${nh}，${cs}`),type:'ac'}],
        ()=>{ac.targetHdg=nh; ac.airRoute=[]; ac.airRouteIdx=0;}); break;
    }
  }
  updateUI();
}

// 建立滑行路線（像素座標）：後推→TWY N→連接道→等待點
function buildTaxiRoute(ac, holdPt){
  return [
    {x: ac.gx,    y: TWY_N_Y, isPushback:true }, // ①後推至TWY N
    {x: holdPt.x, y: TWY_N_Y                  }, // ②沿TWY N滑行
    {x: holdPt.x, y: holdPt.y                 }, // ③連接道進跑道等待點
  ];
}

// 滑行道預覽路線（用於懸停顯示）
function getTaxiPreview(ac, rwy){
  const holdPt=rwy==='06'?HOLD_06:HOLD_24;
  return buildTaxiRoute(ac, holdPt);
}

// TYPEWRITER COMMS
// ══════════════════════════════════════
function qC(lines,onDone){
  twQueue.push({lines,onDone,idx:0});
  if(!twTimer) processQueue();
}
function processQueue(){
  twTimer=null;
  if(!twQueue.length) return;
  const job=twQueue[0];
  if(job.idx>=job.lines.length){
    twQueue.shift();
    if(job.onDone) setTimeout(job.onDone, 150);
    twTimer=setTimeout(processQueue, 60);
    return;
  }
  const e=job.lines[job.idx++];
  // Aircraft readback gets a realistic delay; ATC messages play immediately
  const delay = e.type==='ac' ? REPLY_DELAY : 0;
  twTimer=setTimeout(()=>{
    // typeLine calls onDone when typewriter finishes → triggers next processQueue
    typeLine(e, ()=>{ twTimer=setTimeout(processQueue, 80); });
  }, delay);
}
// Track which channel the last ATC message used
let lastAtcSeatKey = null;
let activeTypingEl = null; // currently typing message element — prevents visual overlap

function typeLine(entry,onDone){
  const{seat,cs,msg,type}=entry;
  cLog.unshift({seat,msg,type,t:gTime});
  if(cLog.length>100)cLog.pop();

  // Determine badge class, label, message class
  let badgeCls, badgeLabel, msgCls;
  if(seat==='TWR'){
    badgeCls='twr'; badgeLabel='TWR'; msgCls='twr-txt';
    lastAtcSeatKey='twr';
  } else if(seat==='APP'){
    badgeCls='app'; badgeLabel='APP'; msgCls='app-txt';
    lastAtcSeatKey='app';
  } else if(seat==='GND'||seat==='DEL'){
    badgeCls='gnd'; badgeLabel='GND'; msgCls='gnd-txt';
    lastAtcSeatKey='gnd';
  } else if(seat==='ATIS'){
    badgeCls='atis'; badgeLabel='ATIS'; msgCls='atis-txt';
    lastAtcSeatKey='atis';
  } else {
    badgeCls='ac'; badgeLabel='A/C'; msgCls='ac-txt';
  }

  const log=document.getElementById('ch-log');
  if(log){
    // Build the new row
    const row=document.createElement('div');
    row.className='ch-entry new-entry';

    const badgeWrap=document.createElement('div');
    badgeWrap.className='ch-entry-badge';
    const sq=document.createElement('span');
    sq.className='ch-badge-sq '+badgeCls;
    sq.textContent=badgeLabel;
    badgeWrap.appendChild(sq);

    const msgEl=document.createElement('span');
    msgEl.className='ch-entry-msg '+msgCls;

    row.appendChild(badgeWrap);
    row.appendChild(msgEl);

    // Insert at top
    log.insertBefore(row, log.firstChild);
    // Trim to max 30 entries
    while(log.children.length>30) log.removeChild(log.lastChild);

    // Mark this as the active typing element
    activeTypingEl=msgEl;

    // Typewriter — character by character
    let i2=0; const chars2=[...msg];
    function tick2(){
      if(i2<chars2.length){
        msgEl.textContent+=chars2[i2++];
        setTimeout(tick2, TW_SPD);
      } else {
        activeTypingEl=null;
        if(onDone) onDone();
      }
    }
    tick2();
    return;
  }
  if(onDone) onDone();
}

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let found=null, bestDist=999;
  Object.values(ACs).forEach(ac=>{
    let px,py;
    if(isGnd(ac.cmdStep)){
      const pos=getACPos(ac); px=pos.px; py=pos.py;
    } else {
      // Air AC drawn on ground view via nm2gCanvas
      const p=nm2gCanvas(ac.ax,ac.ay); px=p.x; py=p.y;
    }
    const d=Math.sqrt((mx-px)**2+(my-py)**2);
    if(d<30 && d<bestDist){ bestDist=d; found=ac; }
  });
  sel = found ? found.id : null;
  updateUI();
});
